<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>嘉基急診檢傷講義</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: reading column with a unit rail (sidebar on desktop, scrolling tab strip on phone); TTAS level colours are the only loud colour */
:root{
  --bg:#F3F6F7; --surface:#FFFFFF; --surface-2:#E8EEF1; --line:#D3DCE1;
  --ink:#16252F; --ink-2:#526570; --brand:#14506B; --brand-ink:#FFFFFF;
  --lv1:#B42318; --lv2:#D9531E; --lv3:#B7790A; --lv4:#2F855A; --lv5:#2B6CB0;
  --tint:#FFF7E6; --tint-line:#E9C77A; --focus:#2B6CB0;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1A20; --surface:#16242C; --surface-2:#1E303A; --line:#2C4250;
  --ink:#E4EDF1; --ink-2:#9AB0BB; --brand:#5FA8C9; --brand-ink:#0F1A20;
  --lv1:#E5544A; --lv2:#E8793E; --lv3:#C99A2E; --lv4:#3F9E6E; --lv5:#4F8FD6;
  --tint:#2A2414; --tint-line:#7A6430; --focus:#6AA6E8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1A20; --surface:#16242C; --surface-2:#1E303A; --line:#2C4250;
  --ink:#E4EDF1; --ink-2:#9AB0BB; --brand:#5FA8C9; --brand-ink:#0F1A20;
  --lv1:#E5544A; --lv2:#E8793E; --lv3:#C99A2E; --lv4:#3F9E6E; --lv5:#4F8FD6;
  --tint:#2A2414; --tint-line:#7A6430; --focus:#6AA6E8; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.75;margin:0}
a{color:var(--brand)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.shell{max-width:1160px;margin:0 auto;padding-inline:16px;padding-block:20px 60px;display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px}
@media (max-width:860px){.shell{grid-template-columns:1fr;gap:12px}}
/* 電腦版：字放大、版面加寬 */
@media (min-width:1200px){.shell{max-width:1180px;zoom:1.12;grid-template-columns:260px minmax(0,1fr)}.doc p,.doc li{max-width:72ch}}
@media (min-width:1500px){.shell{zoom:1.22}}
@media (min-width:1850px){.shell{max-width:1240px;zoom:1.3}}
/* rail */
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);align-self:start;display:grid;gap:14px}
@media (max-width:860px){.rail{position:static}}
.brand{display:flex;align-items:center;gap:10px}
.strip{display:flex;gap:3px}.strip i{width:8px;height:20px;border-radius:2px;display:block}
.strip i:nth-child(1){background:var(--lv1)}.strip i:nth-child(2){background:var(--lv2)}.strip i:nth-child(3){background:var(--lv3)}.strip i:nth-child(4){background:var(--lv4)}.strip i:nth-child(5){background:var(--lv5)}
.brand b{font-size:18px;font-weight:900;letter-spacing:.02em;display:block;line-height:1.3}
.brand small{color:var(--ink-2);font-size:12px}
.units{display:grid;gap:4px}
@media (max-width:860px){.units{display:flex;overflow-x:auto;gap:6px;padding-bottom:4px}}
.units button{border:1px solid transparent;background:transparent;text-align:left;padding:8px 10px;border-radius:8px;font:inherit;font-size:14px;color:var(--ink);cursor:pointer;white-space:nowrap}
.units button span{display:block;font-size:11px;color:var(--ink-2);letter-spacing:.06em}
.units button[aria-current="true"]{background:var(--surface);border-color:var(--line);font-weight:700;color:var(--brand)}
.toc{display:grid;gap:2px;font-size:13px;border-left:2px solid var(--line);padding-left:10px}
.toc a{color:var(--ink-2);text-decoration:none;padding:2px 0}
.toc a:hover{color:var(--brand)}
@media (max-width:860px){.toc{display:none}}
.tool{display:grid;gap:8px;font-size:13px}
.switch{display:flex;align-items:center;gap:8px;cursor:pointer}
.switch input{width:18px;height:18px;accent-color:var(--brand)}
.applink{display:block;background:var(--brand);color:var(--brand-ink);text-decoration:none;border-radius:10px;padding:10px 12px;font-weight:700;font-size:14px}
.applink small{display:block;font-weight:400;opacity:.85;font-size:12px}
/* doc */
main{min-width:0}
.doc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px clamp(16px,4vw,44px) 40px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--ink-2);font-weight:700}
.doc h1{font-size:clamp(26px,4vw,34px);font-weight:900;margin:4px 0 6px;text-wrap:balance;line-height:1.3}
.meta{color:var(--ink-2);font-size:14px;margin:0 0 8px}
.doc h2{font-size:21px;font-weight:900;margin:40px 0 12px;padding-top:4px;text-wrap:balance;scroll-margin-top:16px}
.doc h2:first-of-type{margin-top:28px}
.doc p,.doc li{max-width:68ch}
.doc ul,.doc ol{padding-left:1.4em}
.doc li{margin:2px 0}
.doc strong{font-weight:700}
.tbl{overflow-x:auto;margin:12px 0 16px;border:1px solid var(--line);border-radius:10px}
.doc table{border-collapse:collapse;width:100%;font-size:14.5px;line-height:1.55}
.doc th{background:var(--surface-2);text-align:left;font-weight:700;padding:8px 12px;white-space:nowrap;border-bottom:1px solid var(--line)}
.doc td{padding:8px 12px;border-top:1px solid var(--line);vertical-align:top;min-width:3.5em}
.doc tr:first-child td{border-top:0}
.doc td.blank{background:repeating-linear-gradient(0deg,transparent 0 30px,var(--line) 30px 31px);min-width:6em}
.lv{display:inline-grid;place-items:center;min-width:28px;height:24px;padding:0 6px;border-radius:6px;color:#fff;font-weight:700;font-family:var(--f-data);font-size:13px}
.l1{background:var(--lv1)}.l2{background:var(--lv2)}.l3{background:var(--lv3)}.l4{background:var(--lv4)}.l5{background:var(--lv5)}
input[type=checkbox].ck{width:16px;height:16px;margin:0 6px 0 0;vertical-align:-2px;accent-color:var(--brand)}
.doc ul.tasks{list-style:none;padding-left:0}
/* answers */
.answer{border:1.5px dashed var(--tint-line);background:var(--tint);border-radius:12px;padding:4px 18px 14px;margin-top:40px}
.answer>h2{margin-top:14px}
.answer-lock{border:1.5px dashed var(--tint-line);background:var(--tint);border-radius:12px;padding:16px 18px;margin-top:40px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.answer-lock b{display:block}
.btn{border:0;border-radius:10px;padding:9px 16px;font:inherit;font-weight:700;background:var(--brand);color:var(--brand-ink);cursor:pointer}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:18px;flex-wrap:wrap}
.pager button{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font:inherit;color:var(--ink);cursor:pointer;text-align:left;min-width:0}
.pager button span{display:block;font-size:12px;color:var(--ink-2)}
.foot{font-size:12px;color:var(--ink-2);margin-top:20px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
/* ---------- visual components ---------- */
.viz{margin:18px 0 22px;display:grid;gap:10px}
.viz .cap{font-size:12.5px;color:var(--ink-2)}
.lvbg1{background:var(--lv1)}.lvbg2{background:var(--lv2)}.lvbg3{background:var(--lv3)}.lvbg4{background:var(--lv4)}.lvbg5{background:var(--lv5)}.lvbg0{background:var(--surface-2)}
/* level ladder */
.ladder{display:grid;gap:8px}
.rung{display:grid;grid-template-columns:86px minmax(0,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.rung .num{color:#fff;display:grid;place-items:center;text-align:center;padding:10px 4px}
.rung .num b{font-family:var(--f-data);font-size:30px;line-height:1}
.rung .num small{display:block;font-size:12px;font-weight:700;margin-top:4px}
.rung .body{padding:10px 14px;display:grid;gap:4px;min-width:0}
.rung .top{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}
.rung .top b{font-size:17px}
.rung .clock{font-family:var(--f-data);font-size:13px;color:var(--ink-2)}
.rung .eg{font-size:14px;color:var(--ink-2)}
/* flow */
.flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:stretch}
@media (max-width:640px){.flow{grid-template-columns:1fr}}
.fstep{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px 14px;display:grid;gap:6px;position:relative}
.fstep .k{font-family:var(--f-data);font-size:12px;color:var(--brand);font-weight:600;letter-spacing:.08em}
.fstep b{font-size:16px}
.fstep p{margin:0;font-size:14px;color:var(--ink-2)}
.route{display:grid;gap:6px;margin-top:4px}
.route div{display:flex;gap:8px;align-items:center;font-size:13.5px}
.route i{width:12px;height:12px;border-radius:3px;flex:none}
.arrow{color:var(--ink-2);text-align:center;font-size:20px;line-height:1}
/* scale bar */
.scale{display:grid;gap:6px}
.bar{display:flex;border-radius:10px;overflow:hidden;border:1px solid var(--line);min-height:54px}
.seg{color:#fff;padding:6px 8px;display:grid;align-content:center;gap:2px;min-width:0}
.seg b{font-family:var(--f-data);font-size:14px;white-space:nowrap}
.seg span{font-size:12px;line-height:1.3}
.seg.ok{background:var(--surface-2);color:var(--ink)}
.ticks{display:flex;font-family:var(--f-data);font-size:11.5px;color:var(--ink-2)}
/* pain grid */
.pgrid{display:grid;grid-template-columns:auto repeat(3,minmax(0,1fr));gap:6px;align-items:stretch;max-width:560px}
.pgrid .h{font-size:13px;color:var(--ink-2);font-weight:700;display:grid;place-items:center;text-align:center;padding:4px}
.pgrid .c{border-radius:10px;color:#fff;display:grid;place-items:center;padding:12px 6px;text-align:center}
.pgrid .c b{font-family:var(--f-data);font-size:24px;line-height:1}
.pgrid .c small{font-size:11.5px}
/* timeline */
.tl{position:relative;height:96px;margin:6px 8px 0}
.tl .axis{position:absolute;left:0;right:0;top:44px;height:4px;background:var(--line);border-radius:2px}
.tl .mk{position:absolute;top:0;transform:translateX(-50%);display:grid;justify-items:center;gap:4px;text-align:center}
.tl .mk .dot{width:16px;height:16px;border-radius:50%;margin-top:36px;border:3px solid var(--surface)}
.tl .mk b{font-family:var(--f-data);font-size:13px;white-space:nowrap}
.tl .mk span{font-size:11.5px;color:var(--ink-2);white-space:nowrap}
.tl .lbl{position:absolute;top:2px;transform:translateX(-50%);display:grid;justify-items:center}
/* chips row / stepper */
.stepper{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.chipcard{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px;display:grid;gap:4px;flex:1 1 150px;min-width:0}
.chipcard .k{font-family:var(--f-data);font-size:12px;color:var(--brand);font-weight:600}
.chipcard b{font-size:15px}
.chipcard p{margin:0;font-size:13.5px;color:var(--ink-2)}
.tagrow{display:flex;flex-wrap:wrap;gap:4px}
.tag{display:inline-flex;gap:4px;align-items:center;font-size:12px;border-radius:999px;padding:2px 8px;color:#fff;font-weight:700}
/* mechanism */
.moi{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.moi .m{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px;display:grid;gap:4px;align-content:start}
.moi .m .big{font-family:var(--f-data);font-size:22px;font-weight:600;color:var(--lv2);line-height:1.2}
.moi .m b{font-size:14.5px}
.moi .m p{margin:0;font-size:13px;color:var(--ink-2)}
.moi-h{font-size:13px;font-weight:700;color:var(--ink-2);letter-spacing:.06em;margin-top:6px}
/* PAT */
.pat{display:grid;grid-template-columns:minmax(0,280px) minmax(0,1fr);gap:16px;align-items:center}
@media (max-width:640px){.pat{grid-template-columns:1fr}}
.pat svg{width:100%;height:auto;max-width:280px;justify-self:center}
.pat svg .side{cursor:pointer}
.pat svg text{font-family:var(--f-body);font-size:13px;fill:var(--ink)}
.pat-out{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface);display:grid;gap:6px;min-width:0}
.pat-out .state{font-size:19px;font-weight:900}
.pat-btns{display:flex;flex-wrap:wrap;gap:6px}
.pat-btns button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font:inherit;font-size:13.5px;color:var(--ink);cursor:pointer}
.pat-btns button[aria-pressed="true"]{background:var(--lv1);border-color:var(--lv1);color:#fff}
/* HR range chart */
.hr{display:grid;gap:10px}
.hrrow{display:grid;grid-template-columns:92px minmax(0,1fr);gap:8px;align-items:center}
.hrrow .age{font-size:13.5px;font-weight:700}
.hrtrack{position:relative;height:30px;border-radius:6px;overflow:hidden;background:var(--lv1)}
.hrtrack i{position:absolute;top:0;bottom:0}
.hrtrack em{position:absolute;top:50%;transform:translate(-50%,-50%);font-style:normal;font-family:var(--f-data);font-size:11px;color:#fff;font-weight:600}
.hraxis{display:grid;grid-template-columns:92px minmax(0,1fr);gap:8px}
.hraxis div{position:relative;height:16px;font-family:var(--f-data);font-size:11px;color:var(--ink-2)}
.hraxis span{position:absolute;transform:translateX(-50%)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
/* compare say */
.say{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
@media (max-width:560px){.say{grid-template-columns:1fr}}
.say .no,.say .yes{border-radius:10px;padding:9px 12px;font-size:14.5px}
.say .no{background:var(--surface-2);color:var(--ink-2);text-decoration:line-through;text-decoration-color:var(--lv1)}
.say .yes{background:var(--surface);border:1px solid var(--lv4)}
.say .hd{font-size:12px;font-weight:700;letter-spacing:.08em}
/* START */
.start{display:grid;gap:8px}
.q{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px}
.q b{font-size:15px}
.q .ans{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tri{border-radius:8px;padding:4px 10px;font-size:13px;font-weight:700;color:#fff;white-space:nowrap}
.tri.g{background:var(--lv4)}.tri.y{background:var(--lv3)}.tri.r{background:var(--lv1)}.tri.k{background:#1f2328}
/* case cards */
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin:12px 0 18px}
.case{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px 14px;display:grid;gap:8px;align-content:start}
.case .no{font-family:var(--f-data);font-size:12px;color:var(--brand);font-weight:600}
.case p{margin:0;font-size:14.5px;line-height:1.6}
.case .vs{font-family:var(--f-data);font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border-radius:6px;padding:4px 8px}
.case button{justify-self:start;border:1px solid var(--brand);color:var(--brand);background:transparent;border-radius:8px;padding:5px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.case .reveal{border-top:1px dashed var(--line);padding-top:8px;display:grid;gap:4px;font-size:13.5px}
.case .reveal .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.case .cap{font-size:12.5px;color:var(--ink-2)}
.case .reveal[hidden]{display:none}
.case .reveal .row b{font-size:12.5px;color:var(--ink-2);min-width:4.5em}
.case .reveal .row span{flex:1 1 180px;min-width:0}

/* ---------- v2 ---------- */
:root{ --u1:#14506B; --u2:#8C2F1B; --u3:#2E3A87; --u4:#7D2B63; --u5:#34444F; --uc:var(--u1); --band-ink:#FFFFFF; --pt-bg:#F6F9FA }
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){ --u1:#1C6687; --u2:#9E3A23; --u3:#3A4AA3; --u4:#923677; --u5:#46586A; --pt-bg:#1A2A33 }}
:root[data-theme="dark"]{ --u1:#1C6687; --u2:#9E3A23; --u3:#3A4AA3; --u4:#923677; --u5:#46586A; --pt-bg:#1A2A33 }
.doc.u1{--uc:var(--u1)}.doc.u2{--uc:var(--u2)}.doc.u3{--uc:var(--u3)}.doc.u4{--uc:var(--u4)}.doc.u5{--uc:var(--u5)}
.doc{padding-top:0;overflow:hidden}
#prog{position:fixed;left:0;right:0;top:0;height:4px;background:var(--uc,var(--brand));transform-origin:0 50%;transform:scaleX(0);z-index:10}
/* hero */
.hero{margin:0 calc(-1 * clamp(16px,4vw,44px)) 8px;padding:28px clamp(16px,4vw,44px);background:var(--uc);color:var(--band-ink);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center}
.hero .eyebrow{color:var(--band-ink);opacity:.85}
.hero h1{color:var(--band-ink);font-size:clamp(28px,5vw,42px);margin:4px 0 10px}
.hero .art{width:clamp(92px,16vw,150px);height:auto;filter:drop-shadow(0 6px 14px rgba(0,0,0,.25));animation:float 5s ease-in-out infinite}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{background:rgba(255,255,255,.16);border-radius:999px;padding:3px 12px;font-size:13.5px}
.lvstrip{display:flex;gap:5px;margin-top:14px}
.lvstrip i{font-style:normal;width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-family:var(--f-data);font-weight:600;color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.35)}
@keyframes float{50%{transform:translateY(-6px) rotate(-2deg)}}
/* chapters */
.ch{margin-top:34px}
.band{background:var(--uc);color:var(--band-ink);border-radius:14px;padding:14px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;margin-bottom:14px}
.band h2{color:var(--band-ink);margin:2px 0 0 !important;padding:0;font-size:clamp(19px,3vw,24px)}
.secno{font-family:var(--f-data);font-size:12px;letter-spacing:.12em;opacity:.8}
.band .art{width:58px;height:58px}
.lead{font-size:17.5px;font-weight:500;line-height:1.7;border-left:0;margin:6px 0 14px}
.kicker{font-weight:900;color:var(--uc);margin:18px 0 8px;font-size:16px}
h3.sub{display:flex;align-items:center;gap:10px;font-size:18px;margin:22px 0 10px;color:var(--ink)}
/* icons */
.ico{width:44px;height:44px;flex:none;border-radius:12px;display:grid;place-items:center;background:var(--uc);color:#fff}
.ico svg{width:30px;height:30px}
.ico.sm{width:34px;height:34px;border-radius:10px}.ico.sm svg{width:24px;height:24px}
h3.sub .ico{width:36px;height:36px}.h3.sub .ico svg{width:26px;height:26px}
/* goals & info */
.goals{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:8px 0 16px}
.goal{display:flex;gap:12px;align-items:flex-start;background:var(--pt-bg);border-radius:12px;padding:12px 14px;line-height:1.55}
.goal b{flex:none;width:34px;height:34px;border-radius:50%;background:var(--uc);color:#fff;display:grid;place-items:center;font-family:var(--f-data)}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin:10px 0 14px}
.info div{background:var(--surface-2);border-radius:10px;padding:10px 12px;display:grid;gap:2px;min-width:0}
.info small{color:var(--ink-2);font-size:12px;letter-spacing:.06em}
.info b{font-size:15px;line-height:1.45}
/* point cards */
.pts{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px;margin:10px 0 16px}
.pt{display:flex;gap:12px;align-items:flex-start;background:var(--pt-bg);border:1px solid var(--line);border-radius:14px;padding:14px;position:relative;min-width:0}
.pt-b{min-width:0;display:grid;gap:4px}
.pt-b b{font-size:16px;line-height:1.4}
.pt-b p{margin:0;font-size:14.5px;line-height:1.6;color:var(--ink)}
.pt-b ul{margin:4px 0 0;padding-left:1.1em;font-size:14px;line-height:1.55}
.pt.has-lv{padding-right:58px}
.lvtag{position:absolute;top:12px;right:12px;color:#fff;font-weight:900;font-size:13px;border-radius:8px;padding:3px 8px;font-family:var(--f-data)}
/* steps */
.steps{display:grid;gap:8px;margin:10px 0 16px;counter-reset:s}
.step{display:grid;grid-template-columns:44px minmax(0,1fr);gap:0;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.step>i{font-style:normal;background:var(--uc);color:#fff;font-family:var(--f-data);font-weight:600;font-size:18px;display:grid;place-items:center}
.st-b{display:flex;gap:12px;padding:10px 14px;align-items:flex-start;min-width:0}
.st-b>div{min-width:0}
.st-b p{margin:0;line-height:1.6}
.st-b ul{margin:4px 0 0;padding-left:1.1em;font-size:14.5px}
/* callouts */
.callout{display:flex;gap:12px;align-items:flex-start;border-radius:12px;padding:12px 14px;margin:12px 0;max-width:none !important;line-height:1.6}
.callout.warn{background:var(--tint);border:1.5px solid var(--tint-line)}
.callout.warn .ico{background:var(--lv2)}
/* discussion case */
.dcase{border-radius:16px;overflow:hidden;border:1px solid var(--line);margin:14px 0;background:var(--surface)}
.dc-head{background:var(--uc);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;font-size:17px}
.dc-head .art{width:40px;height:40px}
.dc-scene{background:var(--pt-bg);margin:0;padding:14px 16px;font-size:16px;line-height:1.7;max-width:none !important}
.dc-q{margin:0;padding:10px 16px 14px 2.4em;display:grid;gap:4px}
.dc-q li::marker{color:var(--uc);font-weight:900}
.ans-h{color:var(--uc)}
/* bigger level visuals */
.rung .num b{font-size:34px}
.viz{position:relative}
.vizbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.vb{border:0;border-radius:999px;padding:6px 14px;font:inherit;font-size:13.5px;font-weight:700;cursor:pointer;background:var(--uc);color:#fff}
.vb.all{background:var(--surface-2);color:var(--ink)}
.vb-n{font-family:var(--f-data);font-size:12.5px;color:var(--ink-2)}
.veil{opacity:.08;filter:grayscale(1);transition:opacity .35s,filter .35s}
.pop{animation:pop .45s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{0%{transform:scale(.94);opacity:.2}100%{transform:none;opacity:1}}
/* scroll motion: visible at rest, plays once when it enters */
.anim.in{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.viz.in .rung,.viz.in .fstep,.viz.in .chipcard,.viz.in .m,.viz.in .q,.viz.in .pgrid .c,.viz.in .seg,.viz.in .hrrow,.viz.in .say>div{animation:rise .55s cubic-bezier(.2,.7,.2,1) both}
.viz.in :is(.rung,.fstep,.chipcard,.m,.q,.c,.seg,.hrrow,.say>div):nth-child(2){animation-delay:.08s}
.viz.in :is(.rung,.fstep,.chipcard,.m,.q,.c,.seg,.hrrow,.say>div):nth-child(3){animation-delay:.16s}
.viz.in :is(.rung,.fstep,.chipcard,.m,.q,.c,.seg,.hrrow,.say>div):nth-child(4){animation-delay:.24s}
.viz.in :is(.rung,.fstep,.chipcard,.m,.q,.c,.seg,.hrrow,.say>div):nth-child(5){animation-delay:.32s}
.viz.in :is(.rung,.fstep,.chipcard,.m,.q,.c,.seg,.hrrow,.say>div):nth-child(n+6){animation-delay:.4s}
.pts.in .pt,.steps.in .step,.goals .goal{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
.pts.in .pt:nth-child(2),.steps.in .step:nth-child(2){animation-delay:.07s}
.pts.in .pt:nth-child(3),.steps.in .step:nth-child(3){animation-delay:.14s}
.pts.in .pt:nth-child(4),.steps.in .step:nth-child(4){animation-delay:.21s}
.pts.in .pt:nth-child(n+5),.steps.in .step:nth-child(n+5){animation-delay:.28s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.credit{font-size:11.5px;color:var(--ink-2);margin-top:8px}
@media (max-width:560px){.hero{grid-template-columns:1fr}.hero .art{justify-self:end;margin-top:-8px}.band .art{width:44px;height:44px}.pt.has-lv{padding-right:14px;padding-top:40px}}
@media (prefers-reduced-motion: reduce){.hero .art{animation:none}.anim.in,.viz.in *,.pts.in .pt,.steps.in .step,.goals .goal,.pop{animation:none !important}}

.doc th.lvh{color:#fff;border-bottom-color:transparent}
.doc td.tint1{background:color-mix(in srgb,var(--lv1) 10%,transparent)}.doc td.tint2{background:color-mix(in srgb,var(--lv2) 10%,transparent)}
.doc td.tint3{background:color-mix(in srgb,var(--lv3) 12%,transparent)}.doc td.tint4{background:color-mix(in srgb,var(--lv4) 10%,transparent)}
.doc td.tint5{background:color-mix(in srgb,var(--lv5) 10%,transparent)}
.doc th{background:color-mix(in srgb,var(--uc) 12%,var(--surface))}
.doc th.lvh.lvbg1{background:var(--lv1)}.doc th.lvh.lvbg2{background:var(--lv2)}.doc th.lvh.lvbg3{background:var(--lv3)}.doc th.lvh.lvbg4{background:var(--lv4)}.doc th.lvh.lvbg5{background:var(--lv5)}
.kicker,.ans-h,.dc-q li::marker{color:color-mix(in srgb,var(--uc) 60%,var(--ink))}
.goals{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:640px){.goals{grid-template-columns:1fr}}

:root{--bg:#F3F6F9;--surface:#FFFFFF;--surface-2:#EDF2F6;--line:#DCE4EB;--ink:#1B2A35;--ink-2:#56677A;--brand:#1D74A0;--tint:#FFF3E6;--tint-line:#F2C79A;--warm:#E88B3A;--glow-cool:rgba(64,170,220,.16);--glow-warm:rgba(255,170,110,.18)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#111A22;--surface:#18232D;--surface-2:#202E3A;--line:#2A3B49;--ink:#E6EEF3;--ink-2:#9DB0BD;--brand:#6CB8DE;--tint:#2B2118;--tint-line:#6B4A28;--warm:#F2A65A;--glow-cool:rgba(70,150,200,.12);--glow-warm:rgba(242,166,90,.09);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111A22;--surface:#18232D;--surface-2:#202E3A;--line:#2A3B49;--ink:#E6EEF3;--ink-2:#9DB0BD;--brand:#6CB8DE;--tint:#2B2118;--tint-line:#6B4A28;--warm:#F2A65A;--glow-cool:rgba(70,150,200,.12);--glow-warm:rgba(242,166,90,.09);color-scheme:dark}
body{background:radial-gradient(900px 420px at 105% -8%,var(--glow-warm),transparent 62%),radial-gradient(820px 460px at -12% -4%,var(--glow-cool),transparent 58%),var(--bg);background-repeat:no-repeat}
.doc{border-radius:20px;box-shadow:0 1px 2px rgba(16,40,64,.04),0 8px 24px -10px rgba(16,40,64,.12)}
.sec[hidden],.hero[hidden]{display:none!important}
.secbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin:0 calc(-1 * clamp(16px,4vw,44px)) 18px;padding:14px clamp(16px,4vw,44px);background:linear-gradient(100deg,color-mix(in srgb,var(--brand) 10%,var(--surface)),var(--surface));border-bottom:1px solid var(--line);font-size:13px;color:var(--ink-2)}

.tochd{font-size:12px;font-weight:700;color:var(--ink-2);letter-spacing:.04em;padding:2px 0 6px}
.toc button{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:start;text-align:left;border:0;background:transparent;font:inherit;font-size:13px;color:var(--ink-2);padding:5px 6px;border-radius:8px;cursor:pointer}

.pager{position:relative;padding-top:12px}
.pgbar{position:absolute;left:0;right:0;top:0;height:5px;border-radius:999px;background:var(--surface-2);overflow:hidden}

<script>
/* ---------- visual components ---------- */
const T = (l, txt) => `<span class="tag lvbg${l}">${txt || l + " 級"}</span>`;
const pct = (v, lo, hi) => ((v - lo) / (hi - lo) * 100).toFixed(2) + "%";
const VIZ = {
  levels(){
    const R = [[1,"復甦急救","立即","生命或肢體需立即處置","心跳停止、休克、嚴重呼吸窘迫、GCS ≤ 8、持續抽搐"],
      [2,"危急","10 分鐘","潛在危及生命、肢體或器官功能","疑似心因性胸痛、急性明顯吐血、中樞重度疼痛、GCS 9–13"],
      [3,"緊急","30 分鐘","可能進展為嚴重問題","黑便或咖啡色嘔吐物、中樞中度疼痛、抽搐後意識恢復"],
      [4,"次緊急","60 分鐘","慢性病急性發作，處置可稍緩","局部蜂窩性組織炎、泌尿道症狀、周邊中度疼痛"],
      [5,"非緊急","120 分鐘","可轉介門診","慢性咳嗽且生命徵象正常、換藥、局部紅疹"]];
    return `<div class="ladder">${R.map(r => `<div class="rung"><div class="num lvbg${r[0]}"><div><b>${r[0]}</b><small>${r[1]}</small></div></div>
      <div class="body"><div class="top"><b>${r[3]}</b><span class="clock">再評估 ${r[2]}</span></div><div class="eg">${r[4]}</div></div></div>`).join("")}</div>
      <div class="cap">級數決定看診順序與再評估時間，不是保證的候診時間。</div>`;
  },
  flow(){
    return `<div class="flow">
      <div class="fstep"><span class="k">STEP 1</span><b>快速視診＋生命徵象</b><p>第一眼決定病人去哪裡</p>
        <div class="route"><div><i class="lvbg1"></i>心肺停止、重度窘迫、休克、無意識 → 急救室</div>
        <div><i class="lvbg2"></i>中度窘迫、循環不足、意識改變 → 治療區床邊檢傷</div>
        <div><i class="lvbg0" style="border:1px solid var(--line)"></i>明顯穩定 → 檢傷區完成</div></div></div>
      <div class="fstep"><span class="k">STEP 2</span><b>選最適當的主訴</b><p>此次來院最主要、最急迫的症狀；選症狀，不選診斷。</p>
        <div class="tagrow"><span class="tag lvbg5">非外傷 13 類</span><span class="tag lvbg5">外傷 14 類</span><span class="tag lvbg5">環境 11 類</span></div></div>
      <div class="fstep"><span class="k">STEP 3</span><b>套用調節變數</b><p>首要：呼吸、循環、意識、體溫、疼痛、機轉。次要：主訴專屬依據。</p>
        <div class="tagrow">${T(2,"多項成立取最高級")}</div></div></div>`;
  },
  spo2(){
    const lo = 85, hi = 100;
    const segs = [[85,90,1,"< 90%","重度：單字、發紺"],[90,92,2,"< 92%","中度：片語、輔助肌"],[92,95,3,"92–94%","輕度：可說句子"],[95,100,0,"≥ 95%","依其他變數"]];
    return `<div class="scale"><div class="bar">${segs.map(s => `<div class="seg ${s[2]?"lvbg"+s[2]:"ok"}" style="width:${pct(s[1],lo,0)};flex:${s[1]-s[0]}"><b>${s[3]}${s[2]?"｜"+s[2]+" 級":""}</b><span>${s[4]}</span></div>`).join("")}</div>
      <div class="cap">SpO₂ 與表現不一致時取較高級：SpO₂ 94% 但說話斷續、呼吸費力，仍是中度（2 級）。</div></div>`;
  },
  gcs(){
    const segs = [[3,8,1,"GCS 3–8｜1 級","無意識、無法保護呼吸道、持續抽搐"],[9,13,2,"GCS 9–13｜2 級","混亂、近期記憶喪失、躁動"],[14,15,0,"14–15","改用其他變數定級"]];
    return `<div class="scale"><div class="bar">${segs.map(s => `<div class="seg ${s[2]?"lvbg"+s[2]:"ok"}" style="flex:${s[1]-s[0]+1}"><b>${s[3]}</b><span>${s[4]}</span></div>`).join("")}</div>
      <div class="cap">只看急性改變（7 天內）；平日即昏迷者不以基礎 GCS 定級。</div></div>`;
  },
  pain(){
    const cell = (l, s) => `<div class="c lvbg${l}"><div><b>${l}</b><br><small>${s}</small></div></div>`;
    return `<div class="pgrid"><div></div><div class="h">重度 8–10</div><div class="h">中度 4–7</div><div class="h">輕度 0–3</div>
      <div class="h">中樞<br><small>頭胸腹、深部</small></div>${cell(2,"級")}${cell(3,"級")}${cell(4,"級")}
      <div class="h">周邊<br><small>四肢、表淺</small></div>${cell(3,"級")}${cell(4,"級")}${cell(5,"級")}</div>
      <div class="cap">兒童不分中樞周邊：重度 2 級、中度 3 級、輕度 4 級（見單元四）。</div>`;
  },
  reassess(){
    const pts = [[0,1,"立即","持續照護"],[10,2,"10 分","2 級"],[30,3,"30 分","3 級"],[60,4,"60 分","4 級"],[120,5,"120 分","5 級"]];
    const x = t => (Math.sqrt(t) / Math.sqrt(120) * 100) + "%";
    return `<div class="tl"><div class="axis"></div>${pts.map(p => `<div class="mk" style="left:${x(p[0])}"><span>${p[3]}</span><div class="dot lvbg${p[1]}"></div><b>${p[2]}</b></div>`).join("")}</div>
      <div class="cap">候診中依級數時限主動再評估；初始級數保留，另記錄新級數與時間。時間軸為示意比例。</div>`;
  },
  abcd(){
    const S = [["A / B","呼吸道與呼吸",[[1,"SpO₂ < 90%"],[2,"< 92%"]]],["C","循環",[[1,"休克"],[2,"循環不足、無法控制出血"]]],
      ["D","意識",[[1,"GCS 3–8"],[2,"GCS 9–13"]]],["P","疼痛",[[2,"中樞重度"],[3,"周邊重度"]]],["M","受傷機轉",[[2,"高危險機轉"]]]];
    return `<div class="stepper">${S.map(s => `<div class="chipcard"><span class="k">${s[0]}</span><b>${s[1]}</b><div class="tagrow">${s[2].map(t => T(t[0], t[1])).join("")}</div></div>`).join("")}</div>
      <div class="cap">依序檢查，任一項達某級即取該級，多項成立取最高級。</div>`;
  },
  moi(){
    const G = [["一般創傷",[["> 30 km/h","機車或行人、腳踏車被汽車撞","尤其人車分離"],["> 40 / > 60 km/h","汽車撞擊","未繫 / 已繫安全帶；拋出、翻覆、受困 > 20 分、同車死亡亦屬之"],["> 6 公尺","高處墜落",""],["近端穿刺","頭、頸、軀幹或手肘膝蓋以上","槍傷亦屬之"]]],
      ["頭部創傷",[["> 1 公尺","或 5 階樓梯跌落",""],["鈍器攻擊","拳腳除外",""],["彈出車外","未繫安全帶撞擋風玻璃；行人被車撞",""]]],
      ["頸部創傷",[["> 1 公尺","或 5 階樓梯跌落",""],["垂直撞擊","頭部受軸向力",""],["> 30 km/h","機車被汽車撞擊；汽車翻覆、高速",""]]]];
    return G.map(g => `<div class="moi-h">${g[0]}</div><div class="moi">${g[1].map(m => `<div class="m"><span class="big">${m[0]}</span><b>${m[1]}</b>${m[2]?`<p>${m[2]}</p>`:""}</div>`).join("")}</div>`).join("") +
      `<div class="cap">符合任一項直接判 ${T(2)}　孕婦外傷可再上調一級；單純機車自摔不屬高危險機轉。依衛福部首要調節變數表（表三）。</div>`;
  },
  fever(){
    const C = [[2,"免疫功能缺陷","化療（結束三週內）、放療、長期類固醇、移植、HIV、白血病"],[2,"疑似敗血症","中度窘迫、循環不足或意識改變任一項，且 SIRS ≥ 3"],[3,"看起來有病容","潮紅、疲倦、焦躁不安"],[4,"看起來無病容","只有發燒，心跳與意識正常"]];
    return `<div class="stepper">${C.map(c => `<div class="chipcard"><div class="tagrow">${T(c[0])}</div><b>${c[1]}</b><p>${c[2]}</p></div>`).join("")}</div>

const PAT_STATES = {"000":["三者正常","外觀、呼吸、循環皆正常，再依主訴與生命徵象判定。",0],"100":["腦功能障礙／代謝問題","腦傷、敗血症、低血糖、中毒、嬰兒搖晃症候群",2],"010":["呼吸窘迫","輕微氣喘、細支氣管炎、哮吼、肺炎、異物",2],"110":["呼吸衰竭","嚴重氣喘、肺挫傷",1],"001":["代償性休克","腹瀉、失血",2],"101":["非代償性休克","嚴重腸胃炎、嚴重燒傷或外傷",1],"011":["呼吸窘迫＋循環異常","同時處理呼吸與循環，至少 2 級",2],"111":["心肺衰竭","心肺停止，立即急救",1]};
function bindPat(root){
  const st = [0,0,0];
  const upd = () => {
    const k = st.join(""), s = PAT_STATES[k];
    root.querySelectorAll(".side").forEach(l => l.setAttribute("stroke", st[+l.dataset.s] ? "var(--lv1)" : "var(--line)"));
    root.querySelectorAll("#patBtns button").forEach(b => b.setAttribute("aria-pressed", !!st[+b.dataset.s]));
    root.querySelector("#patState").innerHTML = s[0] + (s[2] ? "　" + T(s[2], "至少 " + s[2] + " 級") : "");
    root.querySelector("#patWhy").textContent = s[1];
    root.querySelector("#patMid").textContent = k === "000" ? "點選異常的面向" : s[0];
  };
  root.addEventListener("click", e => { const t = e.target.closest("[data-s]"); if (!t || !t.closest(".pat")) return; st[+t.dataset.s] ^= 1; upd(); });
  upd();
}

  [/呼吸|SpO|喘|氧/, "lungs"], [/胸痛|心因|心跳|心律|EKG|心電/, "heart"], [/休克|血壓|循環|MAP/, "bp"],
  [/出血|血便|吐血|止血/, "drop"], [/意識|GCS|中風|抽搐|神經|腦/, "neuro"], [/頭部|頭痛/, "head"],
  [/發燒|體溫|低體溫/, "thermo"], [/疼痛|痛/, "pain"], [/骨折|肢體|關節|固定|石膏/, "cast"],
  [/紀錄|病史|記錄/, "record"], [/時間|分鐘|時限|再評估/, "clock"], [/藥|抗凝|化療|類固醇/, "pill"],
  [/外傷|傷口|撕裂|機轉/, "trauma"], [/家屬|溝通|說明|抱怨|申訴/, "talk"], [/視診|外觀|看/, "eye"],

const pickIcon = t => { for (const [re, k] of ICON_RULES) if (re.test(t) && ASSETS.icons[k]) return k; return "er"; };
const ico = (k, cls = "") => `<span class="ico ${cls}">${ASSETS.icons[k] || ASSETS.icons.er}</span>`;
const art = (k, alt = "") => ASSETS.illus[k] ? `<img class="art" src="${ASSETS.illus[k]}" alt="${alt}" decoding="async">` : "";
const lvOf = t => { const m = t.match(/(?:→|為|判|列|即)\s*([1-5])\s*級/); return m ? +m[1] : 0; };

function heroHTML(u, i) {

    <div class="hero-txt"><div class="eyebrow">${u.unit}</div><h1>${u.title}</h1>
      <div class="chips"><span>${u.when}</span><span>授課：${u.speaker}</span></div>
      <div class="lvstrip" aria-hidden="true">${[1,2,3,4,5].map(n => `<i class="lvbg${n}">${n}</i>`).join("")}</div></div>
    ${art(UNIT_ART[i - 1], "")}</header>`;
}

function enhance(doc, unitNo) {
  // 1. learning objectives → tiles; info table → key/value tiles
  doc.querySelectorAll("p").forEach(p => {
    if (/^學習目標/.test(p.textContent.trim()) && p.nextElementSibling?.tagName === "OL") {
      const ol = p.nextElementSibling, g = document.createElement("div"); g.className = "goals";
      g.innerHTML = [...ol.children].map((li, i) => `<div class="goal"><b>${i + 1}</b><span>${li.innerHTML}</span></div>`).join("");
      ol.replaceWith(g); p.className = "kicker";
    }
  });
  doc.querySelectorAll(".tbl").forEach(box => {
    const t = box.querySelector("table"); if (!t) return;
    const hd = [...t.querySelectorAll("thead th")].map(th => th.textContent.trim());
    if (hd[0] === "項目" && hd[1] === "內容") {
      const g = document.createElement("div"); g.className = "info";
      g.innerHTML = [...t.querySelectorAll("tbody tr")].map(tr => `<div><small>${tr.children[0].textContent}</small><b>${tr.children[1].innerHTML}</b></div>`).join("");
      box.replaceWith(g);
    }
  });
  // 1b. level columns in tables → coloured headers and tinted cells
  doc.querySelectorAll(".tbl table").forEach(t => {
    const ths = [...t.querySelectorAll("thead th")];
    ths.forEach((th, ci) => {
      const m = th.textContent.trim().match(/^([1-5])\s*級/); if (!m) return;
      th.classList.add("lvh", "lvbg" + m[1]);
      t.querySelectorAll("tbody tr").forEach(tr => tr.children[ci] && tr.children[ci].classList.add("tint" + m[1]));
    });
  });
  // 2. discussion cases: **案例 X：title** + scenario p + ol questions
  doc.querySelectorAll("p > strong:only-child").forEach(st => {
    const p = st.parentElement; if (p.textContent.trim() !== st.textContent.trim()) return;
    const t = st.textContent.trim();
    if (/^案例 [A-Z]：/.test(t) && p.nextElementSibling?.tagName === "P" && p.nextElementSibling.nextElementSibling?.tagName === "OL") {
      const sc = p.nextElementSibling, ol = sc.nextElementSibling, box = document.createElement("div");
      box.className = "dcase anim";
      box.innerHTML = `<div class="dc-head">${art("discuss")}<b>${t}</b></div><p class="dc-scene">${sc.innerHTML}</p>
        <ol class="dc-q">${[...ol.children].map(li => `<li>${li.innerHTML}</li>`).join("")}</ol>`;
      ol.remove(); sc.remove(); p.replaceWith(box);
    } else if (!/^案例 [A-Z]$|解析|案例/.test(t)) {
      // bold-only line → sub heading with icon
      const h = document.createElement("h3"); h.className = "sub";
      h.innerHTML = ico(pickIcon(t)) + `<span>${st.innerHTML}</span>`; p.replaceWith(h);
    }
  });
  // 3. bullet lists → point cards (skip task lists, nested, answers, cases)
  doc.querySelectorAll("ul").forEach(ul => {
    if (ul.classList.contains("tasks") || ul.closest("li") || ul.closest(".answer") || ul.closest(".case")) return;
    const g = document.createElement("div"); g.className = "pts";
    g.innerHTML = [...ul.children].map(li => {
      const nested = li.querySelector("ul,ol"); if (nested) nested.remove();
      let html = li.innerHTML.trim(), title = "", body = html;
      const m = html.match(/^<strong>(.+?)<\/strong>\s*[：:]?\s*(.*)$/s);
      if (m) { title = m[1]; body = m[2]; }
      else { const k = html.indexOf("："); if (k > 0 && k < 18 && !/<|→/.test(html.slice(0, k))) { title = html.slice(0, k); body = html.slice(k + 1); } }
      const txt = li.textContent, lv = lvOf(txt);
      const sub = nested ? `<ul>${[...nested.children].map(x => `<li>${x.innerHTML}</li>`).join("")}</ul>` : "";
      return `<div class="pt ${lv ? "has-lv" : ""}">${ico(pickIcon(txt), lv ? "lvbg" + lv : "")}<div class="pt-b">${title ? `<b>${title}</b>` : ""}<p>${body}</p>${sub}</div>${lv ? `<span class="lvtag lvbg${lv}">${lv} 級</span>` : ""}</div>`;
    }).join("");
    ul.replaceWith(g);
  });
  // 4. ordered procedure lists → step blocks (not in answers / cases / goals)
  doc.querySelectorAll("ol").forEach(ol => {
    if (ol.closest(".answer") || ol.closest(".dcase") || ol.closest("li") || ol.closest(".case")) return;
    const g = document.createElement("div"); g.className = "steps";
    g.innerHTML = [...ol.children].map((li, i) => {
      const nested = li.querySelector("ul,ol"); let sub = "";
      if (nested) { sub = `<ul>${[...nested.children].map(x => `<li>${x.innerHTML}</li>`).join("")}</ul>`; nested.remove(); }
      return `<div class="step"><i>${i + 1}</i><div class="st-b">${ico(pickIcon(li.textContent), "sm")}<div><p>${li.innerHTML}</p>${sub}</div></div></div>`;
    }).join("");
    ol.replaceWith(g);
  });
  // 5. callouts
  doc.querySelectorAll("p").forEach(p => {
    const t = p.textContent.trim();
    if (/^(常見錯誤|注意|提醒|強調|直覺也是資料)/.test(t)) { p.className = "callout warn"; p.insertAdjacentHTML("afterbegin", ico("alert")); }
    else if (/^(教育原則|服務禮儀要點|問診可用口訣|紀錄必備要素|再評估原則)/.test(t)) p.className = "kicker";
  });
  // 6. wrap each h2 into a coloured chapter
  const kids = [...doc.children];
  let sec = null, n = 0;
  kids.forEach(el => {
    if (el.tagName === "HEADER") return;
    if (el.classList.contains("answer") || el.classList.contains("answer-lock")) {
      sec = null;
      el.querySelectorAll(":scope > h2").forEach(h => h.classList.add("ans-h"));
      return;
    }
    if (el.tagName === "H2") {
      n++; sec = document.createElement("section"); sec.className = "ch";
      const key = (SEC_ART.find(([re]) => re.test(el.textContent)) || [0, "nurse"])[1];
      const band = document.createElement("div"); band.className = "band anim";
      band.innerHTML = `<div><span class="secno">第 ${n} 節</span></div>${art(key)}`;
      band.firstElementChild.appendChild(el.cloneNode(true));
      sec.appendChild(band); el.replaceWith(sec);
      sec._lead = true; return;
    }
    if (sec) {
      if (sec._lead && el.tagName === "P" && !el.className) { el.classList.add("lead"); sec._lead = false; }
      sec.appendChild(el);
      if (!el.classList.contains("dcase")) el.classList.add("anim");
    }
  });
  // 7. stepper for visuals
  doc.querySelectorAll(".viz").forEach(v => {
    const items = stepItems(v); if (items.length < 3) return;
    const bar = document.createElement("div"); bar.className = "vizbar";
    bar.innerHTML = `<button type="button" class="vb next">▶ 逐步看</button><button type="button" class="vb all" hidden>全部顯示</button><span class="vb-n" aria-live="polite"></span>`;
    v.prepend(bar); v._items = items; v._i = -1;
  });
  observe(doc);
}
function stepItems(v) {
  const sel = [".ladder > .rung", ".flow > .fstep", ".stepper > .chipcard", ".moi > .m", ".start > .q", ".pgrid > .c", ".tl > .mk", ".hr > .hrrow", ".bar > .seg", ".say > .yes"];
  for (const s of sel) { const f = [...v.querySelectorAll(s)]; if (f.length >= 3) return s === ".bar > .seg" && v.querySelector(".hr") ? [...v.querySelectorAll(".hrrow")] : f; }
  return [];
}
function vizStep(v, mode) {
  const it = v._items, bar = v.querySelector(".vizbar");
  if (mode === "all") { it.forEach(x => x.classList.remove("veil", "pop")); v._i = -1; bar.querySelector(".next").textContent = "▶ 逐步看"; bar.querySelector(".all").hidden = true; bar.querySelector(".vb-n").textContent = ""; return; }
  if (v._i < 0) { it.forEach(x => x.classList.add("veil")); v._i = 0; }
  const x = it[v._i]; if (x) { x.classList.remove("veil"); x.classList.add("pop"); }
  v._i++;
  bar.querySelector(".all").hidden = false;
  bar.querySelector(".vb-n").textContent = `${Math.min(v._i, it.length)} / ${it.length}`;
  bar.querySelector(".next").textContent = v._i >= it.length ? "↺ 重來" : "▶ 下一個";
  if (v._i > it.length) { it.forEach(y => y.classList.add("veil")); it[0].classList.remove("veil"); v._i = 1; bar.querySelector(".vb-n").textContent = `1 / ${it.length}`; bar.querySelector(".next").textContent = "▶ 下一個"; }
}
let IO = null;
function observe(root) {
  if (!("IntersectionObserver" in window) || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  IO && IO.disconnect();
  IO = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); IO.unobserve(e.target); } }), { rootMargin: "0px 0px -8% 0px" });
  root.querySelectorAll(".anim, .viz").forEach(el => IO.observe(el));
}
function progress() {
  if (typeof MODE !== "undefined" && MODE === "page") return;
  const h = document.documentElement, p = h.scrollTop / Math.max(1, h.scrollHeight - h.clientHeight);
  const b = document.getElementById("prog"); if (b) b.style.transform = `scaleX(${p})`;
}

const UNITS = [{"unit": "單元一", "title": "TTAS 檢傷分類", "speaker": "佳娟", "when": "2026/10/20（二）09:00–10:00", "md": "## 課程資訊與學習目標\n\n本單元建立整套訓練的共同語言：學員結業時，須能依 TTAS 流程獨立完成病人的級數判定、紀錄與再評估。\n\n| 項目 | 內容 |\n| --- | --- |\n| 日期時間 | 2026/10/20（二）09:00–10:00 |\n| 地點 | 急診討論室 |\n| 授課者 | 佳娟 |\n| 對象 | 急診年資 2 年以上、具 N1 資格之護理人員 |\n| 課前作業 | 完成本講義「課前練習題」，課堂討論 |\n\n學習目標：\n\n1. 說出 TTAS 五級的定義、顏色與目標候診時間。\n2. 依「第一眼印象 → 主訴 → 第一/第二調節變數」流程判定級數。\n3. 正確判讀生命徵象、意識、疼痛等調節變數。\n4. 完成完整的檢傷紀錄，並依級數執行重新評估。\n\n## TTAS 沿革與五級定義\n\nTTAS 自 2010 年 1 月 1 日全國實施，由台灣急診醫學會與中華民國急重症護理學會參考加拿大 CTAS 架構制定；以生命徵象為基礎、主訴為導向，用首要/次要調節變數決定級數。\n\n\n[[viz:levels]]\n\n教育原則：\n\n- 級數決定看診順序與再評估時間，不等於「保證」的候診時間。\n- 初始檢傷級數不可更改；病況變化時做再評估，紀錄新級數。\n- 主訴分三大系統：非外傷 13 大類、外傷 14 大類、環境 11 大類；環境類由各院自行歸入非外傷或外傷。\n\n## 檢傷判定流程\n\n判定分三步，順序不可顛倒：先看危不危險，再選主訴，最後用調節變數定級。\n\n[[viz:flow]]\n\n1. **快速視診（Critical Look）＋生命徵象**\n    - 心肺停止、嚴重呼吸窘迫、休克或無意識 → 立即送急救室，檢傷紀錄事後補登。\n    - 明顯不穩定（中度呼吸窘迫、血行動力不佳、意識改變）→ 送治療區，床邊完成檢傷。\n    - 明顯穩定 → 在檢傷區完成檢傷。\n    - 同步評估感染管制需求（發燒、旅遊史、群聚史）。\n2. **選擇最適當的主訴**：以病人此次來院「最主要、最急迫」的問題為準，選症狀而非診斷。\n3. **套用調節變數**\n    - 首要調節變數：呼吸窘迫、血行動力、意識程度、體溫、疼痛、受傷機轉。\n    - 次要調節變數：該主訴特有的判定依據（如「冰冷無脈搏的肢體」）。\n    - 多項成立時取**最高級**；綜合判定，不以單一數值決定。\n\n常見錯誤：對病人的負面印象影響判斷；把「我不能呼吸」「我快死了」當成單純焦慮；肢體受傷未評估末梢神經血管；急性怪異行為未想到內科急症。\n\n## 快速視診與問診技巧\n\n病人抵達的最初 60 秒先看整體外觀；檢傷處理的是「事件」不是「疾病」，要的是能等多久，不是診斷。\n\n| 面向 | 檢傷時看什麼 |\n| --- | --- |\n| A 呼吸道 | 喜好姿勢（三腳架 tripod、嗅吸 sniffing）、吞嚥困難、流口水、嘴唇或舌頭腫脹、異常呼吸音（stridor、wheezing、grunting） |\n| B 呼吸 | 呼吸過快或過慢併呼吸暫停、肋間凹陷、使用輔助肌、吐氣異音、呼吸聲變小 |\n| C 循環 | 心跳過快或過慢、膚色改變、低血壓、無法控制的出血、灌流不足徵象 |\n| D 意識與外觀 | 清醒程度、認不出照顧者、焦慮或淡漠、坐立不安、混亂、無法被安撫 |\n\n問診可用口訣，快速而不遺漏：\n\n- **OPQRST**：Onset 發作、Provocation 誘發與緩解、Quality 性質、Radiation 放射、Severity 嚴重度、Time 時間。\n- **OLD CARTS**：Onset、Location、Duration、Character、Associated/Aggravating、Relieving/Radiation、Treatment、Severity。\n\n直覺也是資料：經驗豐富的檢傷人員面對模糊的病史與生命徵象，常能察覺嚴重性與即將惡化；有「不對勁」的感覺時，寧可再評估、提高級數或告知醫師。\n\n整理自方宏榮《檢傷概念》（ICU 訓練教材，2026-09-30）。\n\n## 首要調節變數判讀\n\n首要調節變數適用所有主訴；先查生命徵象絕對值：體溫 > 41°C 或 < 32°C、脈搏 < 50 或 > 140 次/分併休克症狀、SBP < 70 mmHg，直接列第 1 級。\n\n**呼吸窘迫**\n\n[[viz:spo2]]\n\n| 程度 | 病人表現 | SpO₂ | 級數 |\n| --- | --- | --- | --- |\n| 重度 | 疲憊、發紺、只能說單字或無法說話、上呼吸道阻塞、嗜睡或混亂 | < 90% | 1 |\n| 中度 | 使用呼吸輔助肌、只能說片語或短句、喘鳴加劇 | < 92% | 2 |\n| 輕度 | 走動時喘、可說完整句子、無呼吸道阻塞 | 92–94% | 3 |\n\n**血行動力**\n\n| 狀態 | 表現 | 級數 |\n| --- | --- | --- |\n| 休克 | 蒼白濕冷、脈搏微弱、低血壓、明顯心搏過速或過緩、意識下降（敗血性休克可呈潮紅發熱）；SBP < 70，或 SBP < 90 伴典型休克徵象，或 HR < 50 / > 140 合併休克徵象 | 1 |\n| 循環不足 | 未達休克但灌流邊緣：蒼白冒汗、無法解釋的心跳過速、姿勢性低血壓、低於病人平常血壓；SBP < 90 或 HR < 50 / > 140 但無休克徵象，或 MAP < 65 | 2 |\n| 異於平常但穩定 | 生命徵象正常邊緣，與病人平常值不同 | 3 |\n\n**意識程度**\n\n[[viz:gcs]]\n\n| 狀態 | GCS | 級數 |\n| --- | --- | --- |\n| 無意識：無法保護呼吸道、持續抽搐、漸進惡化 | 3–8 | 1 |\n| 意識改變：定向感混亂、近期記憶喪失、躁動不安 | 9–13 | 2 |\n| 正常（再用其他變數定級） | 14–15 | 3–5 |\n\n平時即為昏迷的病人，判斷「急性改變」，不以基礎 GCS 定級。\n\n**體溫（成人 ≥ 16 歲，> 38.0°C；低體溫：< 32°C 為 1 級，環境暴露 32–35°C 為 2 級）**\n\n| 情況 | 級數 |\n| --- | --- |\n| 免疫功能缺陷（化療、放療、長期類固醇、器官移植、HIV、白血病） | 2 |\n| 疑似敗血性休克（灌流不足） | 2 |\n| 看起來有病容 | 3 |\n| 看起來無病容 | 4 |\n\n**疼痛（十分量表，分中樞與周邊）**\n\n\n[[viz:pain]]\n\n疼痛分數以病人自評為準，但須同時記錄觀察到的行為；外傷病人另依高危險受傷機轉判定（見單元二）。\n\n## 檢傷紀錄書寫與再評估\n\n一份完整的檢傷紀錄，要讓沒看過病人的人也能還原「為什麼是這一級」。\n\n紀錄必備要素：\n\n- [ ] 到院時間、檢傷時間、到院方式（自行、119、轉診）\n- [ ] 主訴：用病人的話描述症狀、發生時間、持續時間\n- [ ] 生命徵象：T、P、R、BP、SpO₂，必要時 GCS、血糖\n- [ ] 疼痛分數與部位（中樞/周邊）\n- [ ] 判定依據：所選 TTAS 主訴 ＋ 調節變數\n- [ ] 相關病史、過敏史、用藥（抗凝血劑、化療、類固醇）\n- [ ] 外傷：受傷機轉、時間、地點\n- [ ] 檢傷處置：EKG、止血、固定、給氧、隔離等\n- [ ] 衛教與告知：候診期間症狀加劇應立即告知檢傷護理師\n\n再評估原則：\n\n[[viz:reassess]]\n\n- 依級數時限再評估：2 級 10 分鐘、3 級 30 分鐘、4 級 60 分鐘、5 級 120 分鐘。\n- 病況變化時重新評估並紀錄新級數與時間，**初始級數保留不改**。\n- 病人或家屬反映不適加劇，視同再評估觸發點。\n\n## 定級前自問與常見 Q&A\n\n急迫度不是嚴重度：檢傷判的是「能等多久」，不是「病有多重」。定級前先問自己：\n\n1. 病人會不會馬上死？生命是否受威脅、需要立即處置？\n2. 以目前病況，合宜的等候時間是多久？表徵有沒有潛在危險？\n3. 主訴背後的疾病有多急？年齡是否改變急迫性？\n4. 是否以描述性定義綜合判斷，而不是只看單一數值？例：SpO₂ 94% 看似 3 級，但呼吸費力、說話斷續已是中度窘迫（2 級）。\n5. 疼痛分數可信嗎？疼痛主觀，且與心跳、血壓、呼吸沒有相關；分數的變化比初始分數更重要。\n\n| 問題 | 答案 |\n| --- | --- |\n| 化療結束多久仍算免疫功能缺陷？ | 化療結束三週內仍屬；三週以上或未化療者依實際狀況 |\n| 酒醉意識不清怎麼檢傷？ | 選「物質誤用/中毒」主訴；無意識（GCS 3–8）仍為 1 級 |\n| 牙齒部分缺損算「牙齒斷裂」嗎？ | 不算；牙齒斷裂指完整脫落或牙根外露 |\n| 「急性」視覺改變指多久？ | 一週內新出現的症狀 |\n| 檢傷級數可以更改嗎？ | 不可以，有法律上的考量；以再評估紀錄新級數 |\n| STEMI 為何不是 1 級？ | 為與國際接軌、維持資料可比較性；有休克等仍依調節變數升級 |\n\n自問題目整理自林口長庚陳麗琴《檢傷案例設計與教學技巧》；疼痛觀點與 Q&A 整理自顏瑞昇醫師《急診檢傷沿革與國際趨勢》（2021）。\n\n## 課前練習題\n\n請於 10/20 上課前自行作答，每題寫出「TTAS 主訴」「判定依據」「級數」，課堂討論。\n\n| 題號 | 案例 | TTAS 主訴 | 判定依據 | 級數 |\n| --- | --- | --- | --- | --- |\n| 1 | 58 歲男性，胸悶 30 分鐘、冒冷汗，疼痛 6/10。BP 150/90、HR 98、SpO₂ 97% |  |  |  |\n| 2 | 45 歲男性，氣喘病史，只能說片語、使用呼吸輔助肌。SpO₂ 91%、R 28 |  |  |  |\n| 3 | 60 歲女性，化療中，發燒 38.3°C 2 小時，無其他不適，生命徵象穩定 |  |  |  |\n| 4 | 72 歲女性，發燒 38.6°C、精神差、看起來有病容。BP 128/70、HR 104、SpO₂ 95% |  |  |  |\n| 5 | 66 歲男性，平日意識清楚，今晨家屬發現叫不太醒，E3V4M6 |  |  |  |\n| 6 | 35 歲女性，右腳踝扭傷可跛行，疼痛 5/10，末梢循環與感覺正常 |  |  |  |\n| 7 | 80 歲男性，長期臥床，鼻胃管滑脫，生命徵象穩定，無其他不適 |  |  |  |\n| 8 | 30 歲男性，前日門診縫合傷口，今日來換藥，生命徵象正常，無發燒 |  |  |  |\n\n## 案例討論題\n\n**案例 A：候診中變化**\n\n52 歲男性，上腹痛 3 小時，疼痛 7/10，自行步入。T 36.9°C、HR 92、BP 138/84、R 18、SpO₂ 98%。檢傷判 3 級候診。25 分鐘後太太到檢傷台說「他在流冷汗、臉很白」，複測 HR 118、BP 92/60。\n\n1. 初始檢傷的主訴與判定依據為何？3 級是否合理？\n2. 複測後應如何再評估？新級數為何？\n3. 初始級數要不要改？紀錄應如何書寫？\n4. 檢傷時是否應先做任何檢查？為什麼？\n\n**案例 B：家屬抱怨候診太久**\n\n25 歲女性，喉嚨痛 2 天，判 4 級。候診 70 分鐘後男友到檢傷台大聲質問「為什麼後來的人先看」，此時救護車送入一位胸痛病人。\n\n1. 如何向家屬說明「依急迫度而非到院順序看診」？\n2. 此時是否需要再評估病人？依據為何？\n3. 哪些話容易引發申訴？可用什麼話替代？\n\n## 複雜案例（學會案例）\n\n以下案例取自台灣急診醫學會、中華民國急重症護理學會檢傷工作小組《複雜案例討論與分析》，每題寫出主訴、判定依據與級數。\n\n| 案例 | 情境 | 生命徵象 | 主訴 | 判定依據 | 級數 |\n| --- | --- | --- | --- | --- | --- |\n| 1 | 42 歲男性，沒有反應，皮膚蒼白濕冷，受傷機轉不明。看起來像中度呼吸窘迫。 | GCS 6、SpO₂ 測不到、T 36°C、P 微弱、R 10、BP 測不到 |  |  |  |\n| 14 | 66 歲女性，右下肢痠痛、腳踝紅腫，沒有受傷，也無其他症狀，疼痛 6/10。 | T 37.4°C、P 92、R 21、BP 222/130 |  |  |  |\n| 17 | 40 歲女性，上腹悶痛約一天，疼痛 3/10，腹脹、胃口差、輕微噁心無嘔吐。無糖尿病、高血壓，未開過刀。 | GCS 15、SpO₂ 97%、T 36.3°C、P 80、R 20、BP 124/80 |  |  |  |\n| 20 | 64 歲男性，昨天因左下肢疼痛來過急診，今天由門診轉入安排腰椎 CT。無病容，疼痛已緩解，無噁心嘔吐或腹痛。 | T 36.8°C、P 90、R 18、BP 130/78 |  |  |  |\n\n學會案例 18（鼻胃管滑脫）即課前練習第 7 題。\n\n## 參考答案與判讀要點（輔導員用）\n\n答案依 TTAS 成人非外傷/外傷基準，討論時以本院電腦判讀系統所列主訴名稱為準。\n\n| 題號 | TTAS 主訴 | 判定依據 | 級數 | 討論重點 |\n| --- | --- | --- | --- | --- |\n| 1 | 心血管－胸痛/胸悶 | 疑似心因性胸痛/胸悶（次要調節變數） | 2 | 冒冷汗＋胸悶，檢傷即做 EKG |\n| 2 | 呼吸系統－呼吸短促 | 中度呼吸窘迫（SpO₂ < 92%、只能說片語） | 2 | 表現與 SpO₂ 不一致時取較高級 |\n| 3 | 一般－發燒/畏寒 | 發燒＋免疫功能缺陷 | 2 | 生命徵象穩定仍為 2 級 |\n| 4 | 一般－發燒/畏寒 | 發燒＋有病容；HR 異於平常但穩定 | 3 | 若出現灌流不足徵象升為 2 級 |\n| 5 | 神經系統－意識程度改變 | GCS 9–13 | 2 | 檢傷測血糖，排除低血糖 |\n| 6 | 肢體外傷－下肢關節扭傷 | 周邊中度疼痛（4–7） | 4 | 記錄末梢循環、感覺、運動 |\n| 7 | 一般－醫療裝置問題 | 裝置問題，無其他症狀或窘迫 | 4 | 平日昏迷者不以基礎 GCS 定級 |\n| 8 | 一般－換藥 | 生命徵象正常，無發燒無不適 | 5 | 可轉介門診 |\n\n**案例 A**\n\n1. 腸胃系統－腹痛，中樞中度疼痛（7/10）→ 3 級，初判合理。\n2. 冒冷汗、蒼白、HR 118、BP 92/60 符合「休克」→ 再評估為 1 級，立即送急救室並通知醫師。\n3. 初始 3 級保留；另記錄再評估時間、生命徵象與新級數。\n4. 52 歲男性上腹痛需考慮心因性，檢傷即做 EKG；討論「上腹痛不等於腸胃問題」。\n\n**案例 B**\n\n1. 說明看診依急迫度排序，並告知目前有危急病人正在處置。\n2. 需要。4 級再評估時限為 60 分鐘，已候診 70 分鐘，應立即複評並紀錄。\n3. 避免「急診本來就要等」「看不下去可以去別家」；改說「我先幫她再量一次，如果有變化會馬上調整」。\n\n**複雜案例解析**\n\n| 案例 | 主訴 | 判定依據 | 級數 | 判讀重點 |\n| --- | --- | --- | --- | --- |\n| 1 | 神經－意識程度改變 | 無意識；休克；重度呼吸窘迫 | 1 | 看似中度窘迫，但不能說話、無法保護呼吸道，已符合重度 |\n| 14 | 心血管－高血壓急症 | SBP ≥ 220 或 DBP ≥ 130，無症狀（周邊中度疼痛為 4 級） | 3 | 客觀評估發現比原主訴更需處理的問題時優先選它，避免低估 |\n| 17 | 腸胃－腹痛 | 急性中樞輕度疼痛 | 4 | 生命徵象穩定時，疼痛分數與中樞/周邊決定級數 |\n| 20 | 一般－影像檢查（或轉診） | 影像檢查，生命徵象正常，無發燒無不適 | 5 | 前提是評估後沒有其他生命徵象異常 |\n"}, {"unit": "單元二", "title": "創傷分類重點", "speaker": "婷瑋", "when": "2026/10/20（二）10:00–11:00", "md": "## 課程資訊與學習目標\n\n外傷檢傷的關鍵是「機轉先於傷口」：看起來不嚴重的傷，若機轉屬高危險，至少為 2 級。\n\n| 項目 | 內容 |\n| --- | --- |\n| 日期時間 | 2026/10/20（二）10:00–11:00 |\n| 地點 | 急診討論室 |\n| 授課者 | 婷瑋 |\n| 先備單元 | 單元一 TTAS 檢傷分類 |\n\n學習目標：\n\n1. 以 ABCD 順序快速辨識需立即急救的外傷病人。\n2. 說出一般、頭部、頸部創傷的高危險受傷機轉。\n3. 依部位與傷型選擇正確 TTAS 外傷主訴與次要調節變數。\n4. 在檢傷區執行止血、固定、頸椎保護等初步處置並正確紀錄。\n\n## 外傷判定架構與受傷機轉\n\n外傷病人依序檢查 ABCD → 疼痛 → 受傷機轉；任一項達某級即取該級，多項成立取最高級。\n\n[[viz:abcd]]\n\n1. **A/B 呼吸道與呼吸**：重度呼吸窘迫（SpO₂ < 90%）1 級、中度（< 92%）2 級。\n2. **C 循環**：心跳/呼吸停止或休克 1 級；循環不足、無法控制的出血 2 級。\n3. **D 意識**：GCS 3–8 為 1 級；GCS 9–13 為 2 級。\n4. **疼痛**：中樞重度（8–10）2 級；周邊重度 3 級（同單元一表格）。\n5. **受傷機轉**：屬高危險性 → 直接判 2 級；低危險機轉須與其他條件合併評估。\n\n**高危險性受傷機轉（判 2 級）**\n\n\n[[viz:moi]]\n\n機轉依衛福部首要調節變數表（表三）；單純機車自摔不在高危險機轉內，要與其他條件合併評估。特殊族群：孕婦外傷可依原判定級數再上調一級；服用抗凝血劑者依「凝血異常」判定依據評估出血程度。\n\n## 各部位外傷的次要調節變數\n\nTTAS 外傷依部位分大類，每類再分鈍傷、穿刺傷、撕裂傷/擦傷；以下為各部位最常用、最易判錯的判定依據。\n\n| 部位 | 2 級 | 3 級 | 4 級 | 5 級 |\n| --- | --- | --- | --- | --- |\n| 多重外傷 | 頭頸軀幹多重部位鈍傷/穿刺傷；神經受損或肢體循環不佳 | 脊椎被長時間固定 | — | — |\n| 頭部鈍傷 | 新出現的神經功能缺損 | 傷後有意識喪失或失憶 | 傷後無意識喪失或失憶 | 軟組織挫傷/血腫 |\n| 胸部 | 穿刺傷、槍傷 | 胸壁周邊重度疼痛；腫脹變形疑似骨折 | 胸壁周邊中度疼痛 | 軟組織挫傷/血腫 |\n| 腹部（含骨盆） | 穿刺傷、槍傷 | 中樞中度疼痛（4–7） | 中樞輕度疼痛 | 軟組織挫傷/血腫 |\n| 上/下肢 | 開放性骨折；神經受損或循環不佳；石膏過緊併循環不佳；手肘/膝蓋以上穿刺傷；大腿腫脹變形疑似股骨幹骨折；手指/腳趾截肢（手掌/腳掌以上截肢為 1 級） | 腫脹變形疑似骨折/脫臼；周邊重度疼痛 | 周邊中度疼痛；石膏過緊但循環正常 | 周邊輕度疼痛；挫傷 |\n| 出血（各部位） | 無法控制的出血；凝血異常危及生命或肢體 | 加壓後已止血；凝血異常中輕度出血 | 表淺撕裂/出血已停止 | 擦傷 |\n\n判讀提醒：\n\n- 頭部外傷務必問「有沒有昏過去」「記不記得發生經過」——這兩個問題決定 3 級或 4 級。\n- 肢體外傷一律評估遠端脈搏、膚色、溫度、感覺、運動，紀錄於檢傷單。\n- 抗凝血劑使用者頭部外傷，即使外觀輕微也要提高警覺並告知醫師。\n\n## 檢傷區即時處置\n\n檢傷護理師在醫師看診前可先做的處置，目的是止住惡化、減輕疼痛、保護病人，做完必須紀錄。\n\n| 狀況 | 檢傷區處置 | 紀錄重點 |\n| --- | --- | --- |\n| 活動性出血 | 直接加壓止血、抬高患肢；無法控制即送急救區 | 出血部位、加壓後是否止血 |\n| 疑似骨折/脫臼 | 夾板固定（含上下關節）、冰敷、抬高；移除戒指手錶 | 固定前後末梢循環、感覺、運動 |\n| 高危險機轉或頸部疼痛 | 頸圈固定、維持脊椎中立、以長背板或推床移動 | 機轉、頸部疼痛、四肢感覺運動 |\n| 呼吸窘迫 | 給氧、半坐臥（脊椎疑慮者除外），立即送治療區 | SpO₂ 給氧前後數值 |\n| 斷肢/斷指 | 斷肢以濕紗布包覆、裝袋後置冰水中，勿直接接觸冰 | 離斷時間、保存方式 |\n| 燙傷/化學傷 | 冷水沖洗；化學傷持續沖洗並問清物質 | 物質名稱、面積估計 |\n\n處置不能延誤分級：1、2 級病人先送入診區，處置在床邊進行。\n\n## 課前練習題\n\n每題寫出 TTAS 外傷主訴、判定依據與級數，10/20 課堂討論。\n\n| 題號 | 案例 | TTAS 主訴 | 判定依據 | 級數 |\n| --- | --- | --- | --- | --- |\n| 1 | 28 歲男性，騎機車被時速約 50 公里的汽車撞倒，左前臂擦傷，疼痛 3/10，生命徵象穩定 |  |  |  |\n| 2 | 40 歲男性，從約 9 公尺鷹架墜落，意識清楚，背痛 6/10。BP 130/80、HR 88 |  |  |  |\n| 3 | 45 歲男性，左胸被刀刺傷，傷口約 2 公分，生命徵象穩定 |  |  |  |\n| 4 | 70 歲女性，在家滑倒撞到頭，自述想不起跌倒經過，頭痛 3/10，GCS 15 |  |  |  |\n| 5 | 22 歲男性，菜刀切到左前臂，傷口 3 公分，加壓 10 分鐘後已止血 |  |  |  |\n| 6 | 55 歲男性，滑倒後右小腿明顯腫脹變形，疼痛 8/10，足背脈搏可觸及 |  |  |  |\n| 7 | 35 歲女性，右腳踝打石膏 2 天，腳趾發紫冰冷、麻木 |  |  |  |\n| 8 | 30 歲男性，打籃球右手無名指挫傷，可彎曲，疼痛 2/10 |  |  |  |\n\n## 案例討論題\n\n**案例 A：車禍孕婦**\n\n119 送入 26 歲女性，懷孕 28 週，機車與汽車對撞（汽車車速約 50 公里/小時）。意識清楚，下腹痛 5/10，有少量陰道出血。T 36.8°C、HR 108、BP 108/68、R 20、SpO₂ 98%。\n\n1. 主訴應選外傷系統還是婦產相關主訴？為什麼？\n2. 有哪些調節變數成立？最後級數為何？\n3. 檢傷區應立即通知哪些單位、做哪些處置？\n\n**案例 B：服抗凝血劑的頭部外傷**\n\n78 歲男性，服用抗凝血劑，在家跌倒撞到額頭，無意識喪失，額頭 2 公分血腫，GCS 15，生命徵象穩定，初判 4 級候診。50 分鐘後家屬表示他吐了兩次、一直想睡，複測 GCS 13（E3V4M6）。\n\n1. 初判 4 級的依據是否充分？還有哪些資訊應在檢傷時問到？\n2. 再評估的新級數與依據為何？\n3. 這個案例反映了哪些檢傷陷阱？\n\n## 複雜案例（學會案例）\n\n以下案例取自台灣急診醫學會、中華民國急重症護理學會檢傷工作小組《複雜案例討論與分析》，每題寫出主訴、判定依據與級數。\n\n| 案例 | 情境 | 生命徵象 | 主訴 | 判定依據 | 級數 |\n| --- | --- | --- | --- | --- | --- |\n| 2 | EMT 送入嚴重汽車車禍傷患，懷孕 5 個月，意識清楚，嚴重腹痛 9/10，呼吸淺快、冒冷汗、腹部僵硬。 | T 36.1°C、P 130、R 28、BP 90/60 |  |  |  |\n| 5 | 23 歲化學工人，爆炸的化學液體噴濺到臉部，臉和左眼灼熱，沒有呼吸困難或口咽不適。 | SpO₂ 96%、T 37°C、P 96、R 18、BP 140/88 |  |  |  |\n| 16 | 77 歲女性，昨天跌倒右手臂受傷，意識清楚，沒有抱怨疼痛。右手腕明顯變形，用雜誌固定，手部循環與功能正常。 | T 36.7°C、P 62、R 18、BP 132/86 |  |  |  |\n| 19 | 26 歲女性在海灘踩到玻璃，足踝 3 公分撕裂傷，到院時未加壓已自行止血，無玻璃殘留。 | T 36.2°C、P 82、R 20、BP 118/84 |  |  |  |\n\n## 參考答案與判讀要點（輔導員用）\n\n主訴名稱以本院電腦判讀系統為準。\n\n| 題號 | TTAS 主訴 | 判定依據 | 級數 | 討論重點 |\n| --- | --- | --- | --- | --- |\n| 1 | 肢體外傷－上肢撕裂傷、擦傷 | 高危險性受傷機轉（機車被 > 30 公里/小時汽車撞擊） | 2 | 傷口小不等於低級數，先問機轉 |\n| 2 | 重大外傷－多重鈍傷 | 高危險性受傷機轉（> 6 公尺墜落） | 2 | 頸椎/脊椎保護後再移動 |\n| 3 | 胸部外傷－胸部穿刺傷 | 胸部穿刺傷 | 2 | 生命徵象穩定仍為 2 級 |\n| 4 | 頭部外傷－頭部鈍傷 | 外傷後有失憶現象 | 3 | 追問抗凝血劑使用 |\n| 5 | 肢體外傷－上肢撕裂傷 | 加壓後已止血 | 3 | 若出血已自行停止為 4 級 |\n| 6 | 肢體外傷－下肢鈍傷 | 腫脹變形疑似骨折；周邊重度疼痛 | 3 | 檢傷區先固定、冰敷、抬高 |\n| 7 | 肢體外傷－下肢鈍傷 | 石膏緊密伴隨肢體循環不佳 | 2 | 循環正常的石膏過緊為 4 級 |\n| 8 | 肢體外傷－上肢鈍傷 | 急性周邊輕度疼痛 | 5 | 可轉介門診 |\n\n**案例 A**\n\n1. 選外傷系統（腹部含骨盆鈍傷）：來院主因是車禍，懷孕為加重因素。\n2. 機車被 > 30 公里/小時汽車撞擊屬高危險機轉 → 2 級；孕婦外傷再上調一級 → 1 級。HR 108 也須留意循環不足。\n3. 依本院流程通知婦產科，準備胎心音監測；左側臥位或子宮左推，避免仰臥低血壓。\n\n**案例 B**\n\n1. 不充分。服用抗凝血劑應依「凝血異常」判定依據評估，並問清藥名、最後服藥時間；高齡加抗凝血劑的頭部外傷應提高警覺。\n2. 嘔吐＋嗜睡、GCS 13 → 意識程度改變（GCS 9–13）→ 2 級，立即通知醫師；初始 4 級保留，另記錄再評估。\n3. 陷阱：只看外觀傷口、未把用藥史納入判定、未衛教家屬「嘔吐、嗜睡、頭痛加劇要立刻告知」，等到家屬自己發現。\n\n**複雜案例解析**\n\n| 案例 | 主訴 | 判定依據 | 級數 | 判讀重點 |\n| --- | --- | --- | --- | --- |\n| 2 | 腹部（含骨盆）外傷－鈍傷 | 休克；中樞重度疼痛；高危險機轉＋孕婦上調一級 | 1 | 只看血壓或疼痛會判 2 級；冒冷汗、呼吸淺快屬休克 |\n| 5 | 環境－化學物質暴露 | 顏面部灼傷；化學物質濺入眼睛造成傷害 | 2 | 生命徵象穩定仍為 2 級；檢傷即開始沖洗、問清物質 |\n| 16 | 肢體外傷－上肢鈍傷 | 腫脹變形，疑似骨折/脫臼 | 3 | 不痛不等於沒事；循環正常所以不到 2 級 |\n| 19 | 肢體外傷－下肢撕裂傷、擦傷 | 表淺撕裂/出血已停止 | 4 | 對照：加壓後才止血為 3 級 |\n"}, {"unit": "單元三", "title": "非創傷分類重點", "speaker": "沛鄉", "when": "2026/10/20（二）11:00–12:00", "md": "## 課程資訊與學習目標\n\n非外傷檢傷最常見的失誤是被「看起來還好」騙過：胸痛、暈厥、中風症狀等高風險主訴，生命徵象穩定時仍多為 2 級。\n\n| 項目 | 內容 |\n| --- | --- |\n| 日期時間 | 2026/10/20（二）11:00–12:00 |\n| 地點 | 急診討論室 |\n| 授課者 | 沛鄉 |\n| 先備單元 | 單元一 TTAS 檢傷分類 |\n\n學習目標：\n\n1. 辨識生命徵象穩定仍屬 2 級的高風險主訴。\n2. 依系統選擇最適當的成人非外傷主訴與次要調節變數。\n3. 判定發燒、疑似敗血症病人的級數。\n4. 在檢傷時依主訴優先安排 EKG、血糖等檢查，縮短看診時間。\n\n## 判定架構與發燒判讀\n\n成人非外傷主訴共 13 大類；先用首要調節變數（呼吸、循環、意識、體溫、疼痛），再查該主訴的次要調節變數，取最高級。\n\n**發燒（成人 > 38°C）的判讀**是非外傷各主訴共用的首要調節變數：\n\n\n[[viz:fever]]\n\n化療結束三週內仍屬免疫功能缺陷；三週以上或未化療者，依實際狀況判斷。\n\n選主訴的原則：\n\n- 選「最主要、最急迫」的症狀；同時有胸痛與喘，以較可能危及生命者為主。\n- 懷疑中風時，選「中風症狀」而非「全身虛弱/無力」。\n- 平時已有的慢性狀況（長期臥床、慢性虛弱），只評估此次的急性改變。\n\n## 系統別高風險主訴\n\n下表列出各系統最需要記住的次要調節變數；表中 2 級項目即使生命徵象穩定也成立。\n\n[[viz:stroke]]\n\n| 系統 | 主訴 | 2 級 | 3 級 | 4 級 |\n| --- | --- | --- | --- | --- |\n| 心血管 | 胸痛/胸悶 | 疑似心因性胸痛/胸悶；急性撕裂性疼痛 | 中樞中度疼痛（4–7）；肋膜性/胸壁周邊重度疼痛 | — |\n| 心血管 | 高血壓 | SBP ≥ 220 或 DBP ≥ 130，伴任一症狀（喘、胸痛、頭痛、噁心嘔吐、眩暈） | SBP ≥ 220 或 DBP ≥ 130 無症狀；SBP 200–220 或 DBP 110–130 伴症狀 | SBP 200–220 或 DBP 110–130 無症狀 |\n| 心血管 | 暈厥 | 新發心律不整；無先兆症狀；運動中發生 | 有先兆或姿勢改變引起 | — |\n| 神經 | 中風症狀 | 發作 < 6 小時（「肢體無力」主訴為 < 4.5 小時） | 發作 > 6 小時或已緩解 | — |\n| 神經 | 抽搐 | （持續抽搐為 1 級） | 抽搐後意識已恢復 | — |\n| 腸胃 | 吐血 | 急性或明顯吐血；少量或咖啡色但合併肝硬化/食道靜脈曲張出血 | 少量或咖啡色嘔吐物，生命徵象正常 | — |\n| 腸胃 | 血便/黑便 | 大量 | 中量 | 少量 |\n| 一般 | 全身虛弱/無力 | 發燒伴免疫缺陷或疑似敗血症 | 急性虛弱/無法走動；腎病末期有高或低血鉀病史 | 慢性虛弱、無急性改變 |\n\n容易低估的族群：老人、糖尿病、腎病末期病人的心肌梗塞常以喘、上腹痛、虛弱表現；精神科主訴也可能是內科急症（低血糖、中毒、感染）。\n\n## 檢傷優先檢查與啟動\n\n檢傷護理師可依主訴在醫師看診前先安排檢查或啟動流程，縮短關鍵處置時間；實際項目依本院常規醫囑與團隊啟動規範。\n\n| 主訴或表現 | 檢傷時優先做 | 目的 |\n| --- | --- | --- |\n| 胸痛、胸悶、上腹痛（高風險族群）、心悸、暈厥 | 12 導程 EKG，交醫師判讀 | 及早辨識 STEMI 與心律不整 |\n| 意識改變、抽搐、虛弱、冒冷汗、糖尿病病人 | 指尖血糖 | 排除低血糖 |\n| 單側無力、口齒不清、臉歪 | 記錄最後正常時間（LKW），依流程啟動中風團隊 | 爭取血栓溶解/取栓時效 |\n| 發燒合併意識改變或低血壓 | 通知醫師，評估敗血症流程 | 及早抗生素與輸液 |\n| 發燒、咳嗽、皮疹、旅遊/群聚史 | TOCC 詢問、戴口罩、分流隔離 | 感染管制 |\n\n最後正常時間要問「最後一次看到他正常是幾點」，不是「什麼時候發現的」。\n\n## 課前練習題\n\n每題寫出 TTAS 主訴、判定依據與級數，10/20 課堂討論。\n\n| 題號 | 案例 | TTAS 主訴 | 判定依據 | 級數 |\n| --- | --- | --- | --- | --- |\n| 1 | 62 歲男性，慢跑時突然昏倒約 1 分鐘，現已清醒，生命徵象穩定 |  |  |  |\n| 2 | 55 歲女性，頭痛、噁心。BP 226/124、HR 88，意識清楚 |  |  |  |\n| 3 | 50 歲男性，社區量血壓 210/115，無任何不適，來急診確認 |  |  |  |\n| 4 | 68 歲男性，2 小時前突然左手左腳無力、講話不清楚 |  |  |  |\n| 5 | 40 歲男性，肝硬化病史，吐少量咖啡色液體，生命徵象正常 |  |  |  |\n| 6 | 35 歲女性，今天解一次少量黑便，生命徵象正常，無腹痛 |  |  |  |\n| 7 | 28 歲男性，癲癇病史，在家抽搐約 2 分鐘，現在意識清楚 |  |  |  |\n| 8 | 75 歲女性，發燒 38.9°C、R 24、HR 116，BP 100/58（家屬說平常約 140/80），意識清楚 |  |  |  |\n\n## 案例討論題\n\n**案例 A：不典型表現**\n\n72 歲女性，糖尿病與高血壓病史，女兒陪同。主訴「整天沒力氣、胃不太舒服」，否認胸痛。T 36.6°C、HR 96、BP 108/70（平常約 150/90）、R 20、SpO₂ 95%，皮膚微濕。\n\n1. 你會選哪個主訴？有沒有第二個可能的選擇？\n2. 哪些線索讓你懷疑心因性問題？檢傷時應先做什麼？\n3. 若 EKG 顯示 ST 段上升，下一步為何？級數如何處理？\n\n**案例 B：「他只是喝醉」**\n\n48 歲男性，朋友送來，滿身酒味，躺在推床上叫得醒但講話含糊。朋友說「他每次都這樣，睡一下就好」。HR 92、BP 132/80、SpO₂ 96%，GCS E3V4M6。\n\n1. 依 GCS，級數為何？朋友的說法應如何影響你的判斷？\n2. 檢傷時還應評估或排除哪些狀況？\n3. 本案例反映哪一種檢傷陷阱？\n\n## 複雜案例（學會案例）\n\n以下案例取自台灣急診醫學會、中華民國急重症護理學會檢傷工作小組《複雜案例討論與分析》，每題寫出主訴、判定依據與級數。\n\n| 案例 | 情境 | 生命徵象 | 主訴 | 判定依據 | 級數 |\n| --- | --- | --- | --- | --- | --- |\n| 3 | 60 歲女性，發燒 2 小時，2 天前做過化療。無呼吸困難，皮膚潮紅乾暖，看起來有病容，無疼痛或外傷。 | GCS 15、SpO₂ 96%、T 39°C、P 102、R 19、BP 110/80 |  |  |  |\n| 4 | 68 歲女性，嚴重胸骨下疼痛放射到頸部，呼吸短促費力，說話斷斷續續，疼痛 9/10。 | SpO₂ 91%、T 36.8°C、P 86、R 24、BP 112/78 |  |  |  |\n| 8 | 22 歲男性，運動時暈厥，現已清醒；一週前也發生過一次相同症狀。 | GCS 15、SpO₂ 99%、T 36.9°C、P 62、R 22、BP 114/52 |  |  |  |\n| 9 | 42 歲女性，吃完海鮮麵後全身起紅疹、搔癢，以前有過敏史。 | T 36.8°C、P 77、R 17、BP 140/89 |  |  |  |\n| 10 | 72 歲男性，今早咳出兩口血塊，最近感冒、咳嗽有痰，意識清楚，有支氣管擴張病史，是急診常客。 | GCS 15、SpO₂ 93%、T 36.0°C、P 74、R 26、BP 136/84 |  |  |  |\n| 11 | 75 歲男性，全身虛弱、頭痛、發燒 3 天，輕微呼吸費力與咳嗽。 | GCS 14、SpO₂ 94%、T 38.5°C、P 98、R 20、BP 140/80 |  |  |  |\n| 15 | 76 歲男性，6 小時前右手突然無力、口齒不清，現在慢慢恢復，無胸痛或其他病史。 | GCS 15、SpO₂ 94%、T 37°C、P 107、R 19、BP 146/92 |  |  |  |\n\n**林口長庚示範案例**（陳麗琴《檢傷案例設計與教學技巧》）\n\n| 案例 | 情境 | 生命徵象 | 主訴 | 判定依據 | 級數 |\n| --- | --- | --- | --- | --- | --- |\n| 示範1 | 64 歲男性，COPD，因喘被推入急診，呼吸費力、有喘鳴，噘嘴斷斷續續說從昨天開始咳嗽、呼吸困難。 | SpO₂ 94%、T 38.3°C、P 96、R 23、BP 154/82 |  |  |  |\n| 示範2 | 76 歲男性，30 分鐘前開始劇烈腹痛，說「好像有人把我扯斷」，疼痛 10/10，有高血壓病史。臉色蒼白、呻吟，皮膚冰冷冒汗。 | SpO₂ 94%、T 36°C、P 122、R 24、BP 88/68 |  |  |  |\n\n## 參考答案與判讀要點（輔導員用）\n\n主訴名稱以本院電腦判讀系統為準。\n\n| 題號 | TTAS 主訴 | 判定依據 | 級數 | 討論重點 |\n| --- | --- | --- | --- | --- |\n| 1 | 心血管－暈厥 | 發生在運動期間 | 2 | 檢傷即做 EKG |\n| 2 | 心血管－高血壓急症 | SBP ≥ 220 伴頭痛、噁心 | 2 | SBP 或 DBP 任一達標即成立 |\n| 3 | 心血管－高血壓急症 | SBP 200–220 或 DBP 110–130，無症狀 | 4 | 衛教候診中出現症狀要告知 |\n| 4 | 神經－中風症狀 | 發作 < 6 小時 | 2 | 問最後正常時間，依流程啟動 |\n| 5 | 腸胃－吐血 | 咖啡色嘔吐物合併肝硬化 | 2 | 無肝硬化史則為 3 級 |\n| 6 | 腸胃－血便/黑便 | 少量 | 4 | 問抗凝血劑、NSAID 用藥 |\n| 7 | 神經－抽搐 | 抽搐後意識已恢復 | 3 | 若持續抽搐為 1 級 |\n| 8 | 一般－發燒/畏寒 | 發燒疑似敗血症伴循環不足（SIRS：T、HR、R 三項） | 2 | BP 須與病人平常值比較 |\n\n**案例 A**\n\n1. 可選「全身虛弱/無力」或「腹痛」；BP 低於平常且皮膚濕冷，屬血行動力循環不足 → 2 級，兩種主訴都會得到 2 級。\n2. 高齡、女性、糖尿病是不典型心肌梗塞的高風險族群；虛弱＋上腹不適＋冒汗 → 檢傷即做 EKG。\n3. 立即交醫師判讀，依本院 STEMI 流程啟動；若出現休克徵象再評估為 1 級，送急救區。\n\n**案例 B**\n\n1. 依 TTAS 常見 Q&A，酒醉意識不清選「物質誤用/中毒」主訴；GCS 13 → 意識程度改變 → 2 級（GCS 3–8 仍為 1 級）。朋友的說法是參考病史，不能取代客觀評估。\n2. 測血糖；檢查頭皮、瞳孔與肢體活動，排除頭部外傷與中風；詢問是否合併其他藥物。\n3. 負面印象影響判斷；酒精會掩蓋低血糖、頭部外傷等急症。\n\n**複雜案例解析**\n\n| 案例 | 主訴 | 判定依據 | 級數 | 判讀重點 |\n| --- | --- | --- | --- | --- |\n| 3 | 一般－發燒/畏寒 | 發燒＋免疫功能缺陷 | 2 | 化療中發燒，生命徵象穩定仍為 2 級 |\n| 4 | 心血管－胸痛/胸悶 | 疑似心因性胸痛；中度呼吸窘迫；中樞重度疼痛 | 2 | 選呼吸短促主訴也得 2 級；若有休克或重度窘迫則為 1 級 |\n| 8 | 心血管－暈厥 | 發生在運動期間 | 2 | 年輕、已清醒仍為 2 級，檢傷即做 EKG |\n| 9 | 皮膚－紅疹 | 廣泛性紅疹 | 3 | 有過敏史但無嚴重過敏反應的描述；仍須評估呼吸道與循環 |\n| 10 | 呼吸－咳血 | 輕度呼吸窘迫；咳血塊 | 3 | 慢性病急性惡化要小心評估；做發燒篩檢與感控 |\n| 11 | 全身虛弱（或發燒、呼吸短促） | 輕度呼吸窘迫；發燒有病容 | 3 | 符合 2 項 SIRS；做發燒篩檢與感控 |\n| 15 | 神經－中風症狀 | 發作 > 6 小時或已緩解 | 3 | 108.6.11 修正為 6 小時（原教材 4.5 小時為舊版）；< 6 小時為 2 級，問清最後正常時間 |\n| 示範1 | 呼吸－呼吸短促 | 中度呼吸窘迫（呼吸費力、說話斷續） | 2 | 只看 SpO₂ 94% 會判 3 級；描述性定義優先於單一數值 |\n| 示範2 | 腸胃－腹痛 | 休克（蒼白、冰冷冒汗、低血壓） | 1 | 疼痛只能給到 2 級，休克徵象決定 1 級 |\n"}, {"unit": "單元四", "title": "婦兒科檢傷分類重點", "speaker": "逸靚", "when": "2026/10/20（二）13:00–14:00", "md": "## 課程資訊與學習目標\n\n兒童與孕產婦的檢傷流程和成人相同，但評估工具與調節變數不同：兒童用小兒評估三角，孕婦以 20 週為界分兩套主訴。\n\n| 項目 | 內容 |\n| --- | --- |\n| 日期時間 | 2026/10/20（二）13:00–14:00 |\n| 地點 | 急診討論室 |\n| 授課者 | 逸靚 |\n| 先備單元 | 單元一 TTAS 檢傷分類 |\n\n學習目標：\n\n1. 運用小兒評估三角（PAT）在接觸病童前快速形成關鍵印象。\n2. 依年齡判定兒童發燒的級數。\n3. 說出兒童呼吸窘迫的分級表現。\n4. 正確選擇懷孕 > 20 週與 < 20 週的主訴，辨識 1、2 級產科急症。\n\n## 兒童檢傷：小兒評估三角與呼吸窘迫\n\n兒童的快速視診不用 ABCD，而用小兒評估三角（PAT）：不必碰觸孩子，從門口看就能判斷生理狀態。\n\n| 面向 | 觀察重點 |\n| --- | --- |\n| 整體外觀（Appearance） | 警覺性、哭聲是否有力、眼神接觸、肌肉張力、能否被安撫 |\n| 呼吸功能（Work of Breathing） | 呼吸速率、呼吸輔助肌使用、鼻翼搧動、呻吟聲（grunting）、異常呼吸聲 |\n| 皮膚循環（Circulation） | 膚色與黏膜顏色（蒼白、花斑、發紺）、脈搏、微血管充填時間 |\n\n**PAT 異常組合對應的生理狀態**\n\n\n[[viz:pat]]\n\n**兒童呼吸窘迫分級**\n\n| 項目 | 1 級（重度） | 2 級（中度） | 3 級（輕度） |\n| --- | --- | --- | --- |\n| 說話 | 單字或無法言語 | 片語、不成句 | 可說句子 |\n| 呼吸道/呼吸聲 | 上呼吸道阻塞、流口水 | 喘鳴，呼吸道仍暢通 | 喘息聲，呼吸道暢通 |\n| 姿勢 | 嗅吸姿勢、三點支撐、拒絕躺下 | — | — |\n| 輔助肌 | — | 鼻翼搧動併肋間、肋下、胸骨上凹陷 | 僅鼻翼搧動或胸骨上輕微凹陷 |\n| SpO₂ | < 90% | < 92% | 92–94% |\n\n心跳快是兒童休克的早期表現，心跳慢是晚期徵象；生命徵象請對照兒童 TTAS 年齡別正常值判讀，血壓正常不代表沒有休克。\n\n## 兒童血行動力、疼痛與評估提醒\n\n兒童心跳易受哭鬧、發燒、活動影響，數值只是參考：心跳達 1 級標準但沒有休克表徵，只列 2 級。\n\n\n[[viz:pedshr]]\n\n- **量生命徵象的時機**：1、2 級先送診療區，治療中補量；3–5 級在檢傷區量完（含血壓），無法配合者可延到再評估時限內完成。\n- **疼痛不分中樞周邊**：重度 8–10 為 2 級、中度 4–7 為 3 級、輕度 < 4 為 4 級。\n- **行為改變至少 2 級**：拒食、對事物無興趣、嗜睡、無法解釋的哭鬧、失去張力。\n- **睡著視同無意識**：把孩子叫醒再評估外觀。\n- **先訪談再碰觸**：侵入性檢查最後做；注意聽到的與看到的是否一致。\n- **CIAMPEDS 問病史**：主訴、預防接種/接觸史、過敏、用藥、過去病史與照護者認知、相關事件、進食/尿布、症狀。\n- **兒童外傷**：高危險受傷機轉與判定依據沿用成人標準。\n\n整理自兒童 TTAS 首要調節變數表（107.05 修訂）與 TTAS 工作小組《兒童檢傷分類基準與案例分析》。\n\n## 兒童發燒與常見主訴重點\n\n兒童發燒的級數由「年齡＋活動力」決定：3 個月以下發燒（或低體溫）一律 2 級。\n\n\n[[viz:pedsfever]]\n\n兒童檢傷的其他重點：\n\n- **紫斑或瘀斑合併明顯病容** → 2 級，立即隔離並通知醫師。\n- **活動力**是最好的指標：會玩、會笑、會找媽媽 vs. 躺著不動、哭聲微弱、叫不太醒。\n- **脫水**：問尿量（尿布片數）、進食量、有無眼淚、囟門是否凹陷。\n- **疼痛評估**：依年齡選用合適量表（如臉譜量表、FLACC），參考照顧者的描述。\n- **主訴可能不等於病情**：家長描述須與觀察到的表現核對。\n- **警覺兒虐**：傷勢與病史不符、就醫延遲、不同部位新舊傷並存，依法通報。\n\n## 婦產科檢傷重點與注意事項\n\n孕婦先問週數：> 20 週選「懷孕問題大於 20 週」，< 20 週選「懷孕問題小於 20 週」；以外傷為主因者走外傷系統（見單元二）。\n\n**懷孕問題大於 20 週**\n\n\n[[viz:ob]]\n\n**懷孕問題小於 20 週**：大量陰道出血 → 2 級；其餘依生命徵象、疼痛與出血量判定。\n\n注意事項：\n\n- 育齡女性腹痛、暈厥、陰道出血，都要問最後一次月經，考慮子宮外孕。\n- 頭痛、視力模糊、水腫、上腹痛的孕婦要量血壓，警覺子癲前症。\n- 孕婦正常生命徵象與非孕時不同（心跳略快、血壓略低），休克時代償好、表現晚。\n- 第三孕期避免平躺，採左側臥或子宮左推，避免仰臥低血壓。\n- 疑似性侵害選婦產科「確定或疑似性侵害」，安排隱密空間並依本院流程處理證物與通報。\n- 依本院流程通知產房或婦產科，勿讓急產孕婦在候診區等待。\n\n## 課前練習題\n\n每題寫出 TTAS 主訴、判定依據與級數，10/20 課堂討論。\n\n| 題號 | 案例 | TTAS 主訴 | 判定依據 | 級數 |\n| --- | --- | --- | --- | --- |\n| 1 | 2 個月大男嬰，發燒 38.2°C，吃奶正常，活動力佳 |  |  |  |\n| 2 | 1 歲半女童，發燒 39°C 一天，在候診區玩玩具、會笑 |  |  |  |\n| 3 | 5 歲男童，發燒 38.6°C，活動力佳，無其他不適 |  |  |  |\n| 4 | 4 歲女童，發燒半天，下肢出現紫斑，精神差、一直想睡 |  |  |  |\n| 5 | 3 歲男童，犬吠樣咳嗽，安靜時也有喘鳴聲，鼻翼搧動併胸骨上與肋間凹陷，SpO₂ 93% |  |  |  |\n| 6 | 32 歲孕婦，懷孕 34 週，陰道出血，無腹痛 |  |  |  |\n| 7 | 27 歲孕婦，懷孕 38 週，宮縮每 2 分鐘一次 |  |  |  |\n| 8 | 35 歲孕婦，懷孕 30 週，頭痛、雙腳水腫，BP 162/104 |  |  |  |\n\n## 案例討論題\n\n**案例 A：腹瀉的嬰兒**\n\n9 個月大女嬰，腹瀉 3 天、今天吐了 4 次。媽媽說「她今天都在睡，尿布 12 小時沒濕」。嬰兒躺在媽媽懷裡不太哭，眼神不追物；皮膚花斑、四肢冰涼，微血管充填時間 4 秒，心跳很快，血壓在年齡正常範圍。\n\n1. 用 PAT 逐項判讀，三個面向各是正常或異常？\n2. 這是哪一種生理狀態？級數為何？\n3. 血壓正常能不能排除休克？為什麼？\n\n**案例 B：育齡女性下腹痛**\n\n28 歲女性，右下腹痛 3 小時，疼痛 6/10，起身會頭暈。最後一次月經約 7 週前，不確定是否懷孕。T 36.7°C、HR 112、BP 96/60、R 20、SpO₂ 98%。\n\n1. 你會選哪個主訴？若驗孕陽性，主訴要怎麼選？\n2. 哪些調節變數成立？級數為何？\n3. 檢傷時應優先排除什麼？要告知醫師哪些資訊？\n\n## 複雜案例（學會案例）\n\n以下案例取自台灣急診醫學會、中華民國急重症護理學會檢傷工作小組《複雜案例討論與分析》，每題寫出主訴、判定依據與級數。\n\n| 案例 | 情境 | 生命徵象 | 主訴 | 判定依據 | 級數 |\n| --- | --- | --- | --- | --- | --- |\n| 7 | 3 歲兒童 1 小時前吞了奶奶的心臟藥，數量不明，毒物中心建議就醫。意識清楚、噁心，在檢傷吐了一次。 | SpO₂ 97%、T 36.2°C、P 70、R 24、BP 未量 |  |  |  |\n| 12 | 20 歲女性，陰道出血，輕微腹部絞痛像平常經痛。近一年月經不規則，沒有性生活。 | SpO₂ 99%、T 36.7°C、P 90、R 12、BP 110/74 |  |  |  |\n| 13 | 4 歲兒童睡覺時發燒，接著抽搐近 1 分鐘，過去已發生 3 次、型態相同。檢傷時無病容、跑來跑去。 | T 39°C、P 100、R 22、BP 102/60 |  |  |  |\n\n**其他教材的兒童案例**（TTAS 工作小組《兒童檢傷分類基準與案例分析》、林口長庚陳麗琴示範案例）\n\n| 案例 | 情境 | 生命徵象 | 主訴 | 判定依據 | 級數 |\n| --- | --- | --- | --- | --- | --- |\n| 兒1 | 6 歲兒童氣喘發作，呈重度呼吸窘迫、發紺。 | RR 28、HR 140、SpO₂ 84% |  |  |  |\n| 兒2 | 5 歲兒童被花生嗆到，呼吸費力。 | RR 26、HR 120、SpO₂ 96% |  |  |  |\n| 兒3 | 7 個月大，嘔吐、腹瀉含血便，已兩天拒食。摸起來熱熱的，活動力差。 | BT 38°C、RR 30、HR 170、SpO₂ 96%、CRT 3 秒 |  |  |  |\n| 兒4 | 1 歲 6 個月，發燒兩天，在家抽搐 3 分鐘，到院時已停止，但眼神呆滯、反應遲鈍；曾有熱痙攣。 | RR 22、HR 130、BT 38°C |  |  |  |\n| 兒5 | 2 歲 7 個月，感冒多日、嘔吐，哭鬧無法安撫，眼神呆滯，膚色紅潤。 | RR 30、HR 120 |  |  |  |\n| 兒6 | 3 歲兒童，腹部輕度疼痛，膽汁性嘔吐，膚色紅潤、呼吸不費力。 | RR 30、HR 150、SpO₂ 98% |  |  |  |\n| 兒7 | 6 歲女孩腹痛、嘔吐，無發燒，活動力正常。 | T 36.7°C、P 140、R 22、BP 90/50 |  |  |  |\n| 兒8 | 8 歲鐮刀型貧血兒童，發燒 38.6°C，看起來無病容，脈搏呼吸正常。 | BT 38.6°C |  |  |  |\n\n## 參考答案與判讀要點（輔導員用）\n\n主訴名稱以本院電腦判讀系統為準。\n\n| 題號 | TTAS 主訴 | 判定依據 | 級數 | 討論重點 |\n| --- | --- | --- | --- | --- |\n| 1 | 一般－發燒/畏寒 | 年齡 < 3 個月，體溫 > 38°C | 2 | 活動力佳也不降級 |\n| 2 | 一般－發燒/畏寒 | 3 個月–3 歲，> 38°C，無病容 | 3 | 觀察活動力，不只看體溫 |\n| 3 | 一般－發燒/畏寒 | > 3 歲，> 38°C，無病容 | 4 | 衛教退燒與回診時機 |\n| 4 | 一般－發燒/畏寒 | 紫斑或瘀斑，病容明顯 | 2 | 立即隔離、通知醫師 |\n| 5 | 呼吸－喘鳴 | 中度呼吸窘迫（輔助肌與凹陷） | 2 | 表現與 SpO₂ 不一致時取較高級 |\n| 6 | 婦產－懷孕問題大於 20 週 | 第三孕期陰道出血 | 1 | 不做內診，立即通知產科 |\n| 7 | 婦產－懷孕問題大於 20 週 | 急產（宮縮 ≤ 2 分鐘） | 2 | 依流程送產房 |\n| 8 | 婦產－懷孕問題大於 20 週 | 頭痛 ± 水腫 ± 高血壓 | 2 | 警覺子癲前症 |\n\n**案例 A**\n\n1. 外觀異常（嗜睡、不追物、哭聲弱）；呼吸正常；循環異常（花斑、冰涼、CRT 延長、心跳快）。\n2. 外觀＋循環異常 → 非代償性休克 → 1 級，立即送急救區。\n3. 不能。兒童代償力強，低血壓是晚期徵象；心跳快、CRT 延長、意識改變更早出現。\n\n**案例 B**\n\n1. 未確認懷孕前選腸胃系統「腹痛」；確認懷孕且 < 20 週，改選「懷孕問題小於 20 週」。\n2. HR 112、BP 96/60、姿勢性頭暈 → 血行動力循環不足 → 2 級；中樞中度疼痛為 3 級，取較高的 2 級。\n3. 優先懷疑子宮外孕破裂：依流程驗孕；告知醫師最後月經、姿勢性頭暈與生命徵象，必要時送治療區監測。\n\n**複雜案例解析**\n\n| 案例 | 主訴 | 判定依據 | 級數 | 判讀重點 |\n| --- | --- | --- | --- | --- |\n| 7 | 物質誤用－中毒/藥物過量 | 高危險性物質/不明物質 | 2 | 3 歲兒童心跳 70 偏慢，留意心臟藥毒性 |\n| 12 | 婦產－陰道出血 | 少量出血、生命徵象正常；中樞輕度疼痛 | 4 | 出血量未描述為中、大量；若可能懷孕則為 3 級 |\n| 13 | 神經－抽搐 | 抽搐已停止，意識清醒 | 3 | 到院主因是抽搐，從抽搐的判定依據選，最低 3 級，不用發燒判定 |\n| 兒1 | 呼吸－氣喘聲 | 重度呼吸窘迫 | 1 | RR 28 看似不快，發紺與 SpO₂ 84% 才是重點 |\n| 兒2 | 呼吸－呼吸道內異物 | 中度呼吸窘迫（呼吸費力） | 2 | SpO₂ 正常不代表沒有窘迫，要看呼吸功 |\n| 兒3 | 腸胃－腹瀉 | 血行動力循環不足；腹瀉含血便 | 2 | HR 170、CRT 延長、活動力差：循環不足 |\n| 兒4 | 神經－抽搐 | 意識程度改變；抽搐剛結束 | 2 | 對照學會案例 13：意識已恢復則為 3 級 |\n| 兒5 | 一般－哭鬧不安 | 意識程度改變；持續哭鬧無法安撫 | 2 | 無法安撫的哭鬧可能是意識改變的警訊 |\n| 兒6 | 腸胃－腹痛 | 合併膽汁性嘔吐（次要調節變數） | 3 | 輕度疼痛只有 4 級，次要調節變數把級數拉高 |\n| 兒7 | 腸胃－腹痛 | 心跳異於平常，但血行動力穩定 | 3 | HR 已達 2 級數值，但不符循環不足的綜合描述 |\n| 兒8 | 一般－發燒/畏寒 | > 3 歲，發燒＋免疫功能缺陷 | 2 | 看起來無病容仍為 2 級 |\n"}, {"unit": "單元五", "title": "檢傷危機處理", "speaker": "宏榮", "when": "2026/10/20（二）14:00–14:30", "md": "## 課程資訊與學習目標\n\n檢傷台是急診衝突最集中的地方：候診抱怨、病況突變、暴力與疫情都先到這裡。本單元目標是讓檢傷護理師能先保護病人與自己，再穩住場面。\n\n| 項目 | 內容 |\n| --- | --- |\n| 日期時間 | 2026/10/20（二）14:00–14:30 |\n| 地點 | 急診討論室 |\n| 授課者 | 宏榮 |\n| 對應訓練目的 | 結合服務禮儀，降低申訴案件，提升專業形象 |\n\n學習目標：\n\n1. 辨識檢傷區常見的危機類型與早期警訊。\n2. 運用降溫溝通技巧處理抱怨與情緒激動的病人家屬。\n3. 說出暴力事件、大量傷患、疑似傳染病的檢傷應變步驟。\n4. 完整紀錄危機事件並依院內流程通報。\n\n## 檢傷區常見危機類型\n\n多數危機可提早發現：候診時間超過再評估時限、家屬反覆詢問、音量升高，都是介入的時機。\n\n| 類型 | 典型情境 | 早期警訊 | 首要動作 |\n| --- | --- | --- | --- |\n| 候診中病況惡化 | 3–5 級病人在候診區出現休克、意識改變 | 家屬來說「他怪怪的」；超過再評估時限 | 立即再評估，必要時直接送入診區 |\n| 抱怨與申訴 | 不滿候診時間、不滿級數、要求插隊 | 反覆詢問、語氣變差、拍照錄影 | 主動說明與再評估，避免爭辯 |\n| 言語或肢體暴力 | 酒醉、藥物影響、情緒失控的病人或家屬 | 握拳、逼近、辱罵、丟擲物品 | 保持距離，呼叫支援，啟動院內暴力應變 |\n| 大量傷患 | 車禍、火災、工安事故多名傷患同時到院 | 119 預告、救護車連續抵達 | 通報主管，依院內大量傷患計畫啟動 |\n| 疑似傳染病 | 發燒合併呼吸道症狀、皮疹，有旅遊或群聚史 | TOCC 陽性、群聚發燒 | 戴口罩、分流隔離、通報感控 |\n| 病人自行離開或拒絕 | 候診太久要離開、拒絕檢查 | 表達要走、收拾東西 | 再評估並說明風險，紀錄並通知醫師 |\n\n## 降溫溝通與服務禮儀\n\n抱怨多半源自「不知道還要等多久、不知道有沒有人在管」；先處理情緒，再說明制度。\n\n[[viz:deesc]]\n\n\n[[viz:say]]\n\n服務禮儀要點：主動自我介紹、目光平視、保護隱私（不在候診區大聲問病史）、離開前告知預期下一步；所有說明與再評估都要紀錄。\n\n## 暴力、大量傷患與感染管制應變\n\n三種狀況的共同原則：先確保人員安全，立即通報，再依院內計畫分工；檢傷護理師不單獨處理。\n\n**言語或肢體暴力**\n\n1. 保持至少一臂以上距離，站在靠出口側，不背對對方。\n2. 語氣平穩、音量放低；不爭辯、不碰觸對方。\n3. 呼叫支援：依本院代碼或通報方式通知保全、主管，必要時報警。\n4. 有肢體攻擊時先撤離到安全處，保護其他病人。\n5. 事後完成異常事件通報，紀錄時間、言行、在場證人；受害同仁依院內流程就醫與關懷。\n\n**大量傷患**\n\n[[viz:start]]\n\n1. 接獲 119 預告或多名傷患同時抵達 → 立即通報當班主管，依院內大量傷患計畫啟動。\n2. 現場檢傷可用 START 快速分類：能走 → 綠；不能走則看呼吸、循環、意識，分紅（立即）、黃（延遲）、黑（死亡或無法救活）。\n3. 傷患進入院內後，再依 TTAS 補做正式檢傷與紀錄。\n4. 指定檢傷出入口與動線，避免家屬與媒體阻塞檢傷區。\n\n**疑似傳染病**\n\n1. 每位病人詢問 TOCC：旅遊史（Travel）、職業史（Occupation）、接觸史（Contact）、群聚史（Cluster）。\n2. 有發燒或呼吸道症狀者，先給口罩、手部衛生，引導至隔離候診區。\n3. 符合法定或院內通報條件者，通知醫師與感控，依防護等級著裝。\n4. 檢傷台定時清消，人員落實標準防護。\n\n## 課前練習題\n\n每題寫出「第一句話怎麼說」與「接下來要做的事」，10/20 課堂討論。\n\n| 題號 | 情境 | 第一句話 | 接下來要做的事 |\n| --- | --- | --- | --- |\n| 1 | 4 級病人候診 80 分鐘，太太到檢傷台：「我們到底還要等多久？」 |  |  |\n| 2 | 家屬要求把父親從 3 級改成 2 級：「他 80 歲了，不能先看嗎？」 |  |  |\n| 3 | 酒醉男性在候診區大聲辱罵護理師，逐步靠近檢傷台 |  |  |\n| 4 | 候診區一位 5 級病人說要自行離開，不想再等 |  |  |\n| 5 | 病人發燒、咳嗽，兩週前從國外旅遊返國，同行友人也發燒 |  |  |\n| 6 | 119 預告：遊覽車翻覆，預計 15 分鐘內送來 8 名傷患 |  |  |\n\n## 案例討論題\n\n**案例 A：被錄影的檢傷台**\n\n週六晚間候診區滿座。一位腹痛 4 級的 30 歲女性已等 90 分鐘，男友拿手機對著檢傷護理師錄影：「我要上網讓大家看看你們怎麼對待病人！」此時救護車送入一位 OHCA 病人，另一位護理師離開檢傷台去支援。\n\n1. 面對錄影，你的第一句話與第一個動作是什麼？\n2. 這位病人此時需要再評估嗎？依據為何？\n3. 人力被抽走時，檢傷台應如何求援與排序工作？\n4. 事後要紀錄與通報哪些內容？\n\n**案例 B：情緒失控的家屬**\n\n凌晨 2 點，一名男子扶著頭部流血的朋友到檢傷台，滿身酒味，大喊「快點給我看！」並拍打檢傷台。傷者意識清楚、能對答，頭皮撕裂傷約 3 公分，加壓後仍持續滲血。\n\n1. 傷者的主訴、判定依據與級數為何？\n2. 如何同時處理傷者與失控的家屬？\n3. 若男子動手推人，應變步驟為何？\n\n## 複雜案例（學會案例）\n\n以下案例取自台灣急診醫學會、中華民國急重症護理學會檢傷工作小組《複雜案例討論與分析》。請寫出主訴、判定依據與級數，並說明除了級數之外，檢傷時還要注意什麼。\n\n| 案例 | 情境 | 生命徵象 | 主訴 | 判定依據 | 級數 |\n| --- | --- | --- | --- | --- | --- |\n| 6 | 26 歲女性，從密閉車庫中被救出，當時汽車引擎仍發動。意識清楚，不願眼神接觸、不回答問題，但配合檢傷處置。 | T 36.6°C、P 102、R 22、BP 118/76 |  |  |  |\n\n## 參考答案與處理要點（輔導員用）\n\n以下為參考說法，實際通報代碼與流程依本院規定。\n\n| 題號 | 參考第一句話 | 接下來要做的事 |\n| --- | --- | --- |\n| 1 | 「讓您久等了，我馬上幫他再看一次。」 | 已超過 4 級 60 分鐘再評估時限，立即複評並紀錄；說明目前候診狀況與下一步 |\n| 2 | 「我了解您很擔心爸爸，我先幫他再評估一次。」 | 依再評估結果決定是否調整；說明級數依病情判定，年齡本身不是升級條件 |\n| 3 | 「先生，我聽到了，我們好好談，請先站在那裡。」 | 保持距離、站在出口側，呼叫保全與主管；保護其他候診病人 |\n| 4 | 「我先幫您量一下，看看現在的狀況。」 | 再評估並說明離院風險與回診時機；通知醫師，依院內規定紀錄自動離院 |\n| 5 | 「先幫您戴上口罩，我們到這邊來。」 | 完整 TOCC 詢問、分流隔離，通知醫師與感控，同行者一併評估 |\n| 6 | （對同仁）「大量傷患預告，我先通報主管。」 | 依院內大量傷患計畫啟動；清空檢傷區動線、備物，準備 START 現場分類 |\n\n**案例 A**\n\n1. 不搶手機、不對鏡頭爭辯：「我了解您很急，我先幫她再評估。」語氣平穩，把注意力放回病人。\n2. 需要。4 級再評估時限 60 分鐘，已等 90 分鐘，應立即複評、紀錄，依結果調整。\n3. 通報當班組長請求人力；排序為：新到院病人的快速視診 → 逾時再評估 → 回覆詢問。\n4. 異常事件通報：時間、對話內容、在場人員；被錄影事件依院內流程告知主管與公關單位。\n\n**案例 B**\n\n1. 頭部外傷－頭部撕裂傷。加壓後仍持續出血 → 無法控制的出血 → 2 級；若加壓後止血則為 3 級。另須問受傷機轉：若遭鈍器攻擊屬高危險機轉 → 2 級。\n2. 先處理傷者（加壓止血、送治療區），以傷者為對話焦點：「我們現在就幫他處理，請您幫我扶著他。」同時請同仁或保全陪同家屬。\n3. 撤離到安全距離、呼叫保全與主管，必要時報警；保護傷者與其他病人；事後完成暴力事件通報與同仁關懷。\n\n**複雜案例解析**\n\n| 案例 | 主訴 | 判定依據 | 級數 | 判讀重點 |\n| --- | --- | --- | --- | --- |\n| 6 | 心理健康－憂鬱/自殺 | 企圖自殺或有明確計畫 | 2 | 方式顯示有計畫，不選「有想法無計畫」；同時評估一氧化碳暴露，安置在可持續觀察處、不讓病人獨處，依院內流程照會 |\n"}];

  [...wrap.querySelectorAll("table")].forEach(t => {
    const box = document.createElement("div"); box.className = "tbl"; t.replaceWith(box); box.appendChild(t);
    t.querySelectorAll("td").forEach(td => { const s = td.textContent; if (!s.trim()) td.className = "blank"; else if (/^\s*[1-5]\s*(?:／\s*[1-5]\s*)*$/.test(s)) td.innerHTML = lvHTML(s); });
  });
  // task lists
  wrap.querySelectorAll("li > input[type=checkbox]").forEach(c => { c.disabled = false; c.className = "ck"; c.closest("ul").classList.add("tasks"); });
  // split answer section
  const hs = [...wrap.children];
  const ai = hs.findIndex(el => el.tagName === "H2" && /參考答案/.test(el.textContent));
  let ansNodes = [];
  if (ai >= 0) ansNodes = hs.slice(ai);
  const doc = $("doc");
  doc.className = "doc u" + cur;
  doc.innerHTML = heroHTML(u, cur);
  hs.slice(0, ai >= 0 ? ai : hs.length).forEach(n => doc.appendChild(n));
  if (ansNodes.length){
    if (showAns){ const box = document.createElement("section"); box.className = "answer"; ansNodes.forEach(n => box.appendChild(n)); doc.appendChild(box); }
    else { const lock = document.createElement("div"); lock.className = "answer-lock";
      lock.innerHTML = `<div><b>參考答案與解析</b><span class="meta">給輔導員與課後複習用。先自己作答，再打開對照。</span></div><button class="btn" id="openAns">顯示答案</button>`;
      doc.appendChild(lock); $("openAns").onclick = () => { showAns = true; store.set("ans", true); $("showAns").checked = true; render(); }; }
  }
  if (doc.querySelector(".pat")) bindPat(doc);
  enhance(doc, cur);
  // ---- 線上教材：每個 ## 一節，一節一頁 ----
  const secs = []; let box = null;
  [...doc.children].forEach(n => {
    if (n.classList.contains("hero")) return;
    if (!box || n.tagName === "H2" || n.classList.contains("ch") || n.classList.contains("answer") || n.classList.contains("answer-lock")) { box = document.createElement("section"); box.className = "sec"; doc.appendChild(box); secs.push(box); }
    box.appendChild(n);
  });
  const titles = secs.map(x => { const h = x.querySelector("h2"); return h ? h.textContent : "參考答案與解析"; });
  const N = secs.length, SI = Math.min(Math.max(store.get("sec-" + cur, 0), 0), N - 1);
  const RD = store.get("read", {}), key = "u" + cur; RD[key] = RD[key] || [];
  const SC = store.get("secs", {}); SC[key] = N; store.set("secs", SC);
  const prev = UNITS[cur-2], next = UNITS[cur];
  if (MODE === "page") {
    if (!RD[key].includes(SI)) RD[key].push(SI); store.set("read", RD);
    secs.forEach((x, i) => x.hidden = i !== SI);
    const hero = doc.querySelector(".hero"); if (hero) hero.hidden = SI > 0;
    if (SI > 0) secs[SI].insertAdjacentHTML("afterbegin", `<div class="secbar"><span>${u.unit}・${u.title}</span><b>第 ${SI + 1} / ${N} 節</b></div>`);
    $("toc").innerHTML = `<div class="tochd">本單元 ${N} 節・已讀 ${RD[key].length}</div>` + titles.map((t, i) => `<button data-sec="${i}" aria-current="${i === SI}" class="${RD[key].includes(i) ? "read" : ""}"><i>${RD[key].includes(i) ? "✓" : i + 1}</i>${t}</button>`).join("");
    $("pager").innerHTML = `<div class="pgbar"><i style="width:${(SI + 1) / N * 100}%"></i></div>` +
      (SI > 0 ? `<button data-sec="${SI - 1}"><span>‹ 上一節</span>${titles[SI - 1]}</button>` : prev ? `<button data-i="${cur - 1}" data-last="1"><span>‹ 上一單元</span>${prev.unit} ${prev.title}</button>` : "<span></span>") +
      (SI < N - 1 ? `<button class="pnext" data-sec="${SI + 1}"><span>下一節 ›</span>${titles[SI + 1]}</button>` : next ? `<button class="pnext" data-i="${cur + 1}"><span>完成本單元 ✓ 前往</span>${next.unit} ${next.title}</button>` : `<button class="pnext" data-done="1"><span>恭喜</span>五個單元都讀完了 ✓</button>`);
    const b = $("prog"); if (b) b.style.transform = `scaleX(${(SI + 1) / N})`;
  } else {
    secs.forEach(x => x.hidden = false);
    $("toc").innerHTML = titles.map((t, i) => `<a href="#" data-jump="${i}">${t}</a>`).join("");
    $("pager").innerHTML = (prev ? `<button data-i="${cur-1}"><span>上一單元</span>${prev.unit} ${prev.title}</button>` : "<span></span>") +
                           (next ? `<button data-i="${cur+1}" style="text-align:right"><span>下一單元</span>${next.unit} ${next.title}</button>` : "");
  }
  $("units").innerHTML = UNITS.map((x,i) => { const r = (RD["u" + (i + 1)] || []).length, n = SC["u" + (i + 1)]; return `<button data-i="${i+1}" aria-current="${i+1===cur}"><span>${x.unit}${n ? `・${Math.min(r, n)}/${n}` : ""}</span>${x.title}</button>`; }).join("");
  $("showAns").checked = showAns; $("pageMode").checked = MODE === "page";
}
function go(i, last){ cur = i; if (last) store.set("sec-" + i, 999); else if (MODE === "page") store.set("sec-" + i, 0); try{ history.replaceState(null, "", "#u"+i); }catch(e){} render(); window.scrollTo({ top: 0 }); }
function goSec(k){ store.set("sec-" + cur, k); try{ history.replaceState(null, "", `#u${cur}-s${k}`); }catch(e){} render(); window.scrollTo({ top: 0 }); }
document.addEventListener("click", e => { const vb = e.target.closest(".vb"); if (vb){ vizStep(vb.closest(".viz"), vb.classList.contains("all") ? "all" : "next"); return; } const r = e.target.closest(".rv"); if (r){ const v = r.nextElementSibling; v.hidden = !v.hidden; r.setAttribute("aria-expanded", !v.hidden); r.textContent = v.hidden ? "看答案" : "收起答案"; return; } const sb = e.target.closest("[data-sec]"); if (sb){ goSec(+sb.dataset.sec); return; }
  const j = e.target.closest("[data-jump]"); if (j){ e.preventDefault(); const t = document.querySelectorAll("#doc .sec")[+j.dataset.jump]; if (t) t.scrollIntoView({ behavior: "smooth" }); return; }
  if (e.target.closest("[data-done]")) { goSec(0); return; }
  const b = e.target.closest("[data-i]"); if (b) go(+b.dataset.i, b.dataset.last); });
$("pageMode").onchange = e => { MODE = e.target.checked ? "page" : "all"; store.set("mode", MODE); render(); window.scrollTo({ top: 0 }); };
$("showAns").onchange = e => { showAns = e.target.checked; store.set("ans", showAns); render(); };
addEventListener("scroll", progress, { passive: true });
/* 滿版投影：收起左側導覽、字放大；鍵盤左右鍵（或簡報筆）翻上一節、下一節 */
function setFull(on){ document.body.classList.toggle("full", on); store.set("full", on);
  try { if (on && document.documentElement.requestFullscreen && !document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {}); else if (!on && document.fullscreenElement) document.exitFullscreen(); } catch (e) {}
  if (on && MODE !== "page") { MODE = "page"; store.set("mode", MODE); render(); } window.scrollTo({ top: 0 }); }
$("fullBtn").onclick = () => setFull(true); $("fullExit").onclick = () => setFull(false);
document.addEventListener("keydown", e => { if (MODE !== "page" || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  const pg = $("pager"); if (!pg) return; const bs = pg.querySelectorAll("button");
  if (e.key === "ArrowRight" || e.key === "PageDown") { const n = pg.querySelector(".pnext"); if (n) { e.preventDefault(); n.click(); } }
  if (e.key === "ArrowLeft" || e.key === "PageUp") { const f = bs[0]; if (f && !f.classList.contains("pnext")) { e.preventDefault(); f.click(); } } });
if (store.get("full", false)) document.body.classList.add("full");
render();
</script>
