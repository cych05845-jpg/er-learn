<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>115年度檢傷訓練筆試</title>
<style>
/* VOICE: clinical, calm exam paper — one column, nothing decorative
   IDEA: the triage desk's 五級 colour strip, used as the page's only ornament
   PICTURE: the exam itself; a 5-colour TTAS bar under the title, score ring on results
   COLOUR and TYPE: white paper, deep ink, TTAS red/orange/yellow/green/blue; 微軟正黑體 / Noto Sans TC
   LAYOUT: header band, sticky progress, question cards in one 760px column */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#15181c);--card:light-dark(#f6f7f8,#1e2227);--ink:light-dark(#16191d,#eef0f2);--mute:light-dark(#5b636c,#a3acb5);--line:light-dark(#dde1e5,#323840);--acc:light-dark(#b3261e,#ff8a80);--ok:light-dark(#1b7a3d,#7ddc9b);--bad:light-dark(#b3261e,#ff8a80);--sel:light-dark(#fdecea,#3a2220)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 "Microsoft JhengHei","微軟正黑體","Noto Sans TC","PingFang TC",sans-serif;overflow-x:clip}
.wrap{max-width:760px;margin:0 auto;padding:0 max(4vw,16px)}
header{padding:36px 0 20px}
h1{font-size:clamp(28px,5vw,40px);line-height:1.1;margin:0 0 6px;text-wrap:balance}
.sub{color:var(--mute);margin:0}
.ttas{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:18px 0 0}
.ttas span{height:8px;border-radius:2px}
.meta{display:flex;flex-wrap:wrap;gap:8px 20px;margin:14px 0 0;color:var(--mute);font-size:15px}
.meta b{color:var(--ink)}
.panel{background:var(--card);border-radius:12px;padding:22px;margin:16px 0}
label.f{display:block;font-size:15px;color:var(--mute);margin:0 0 4px}
input[type=text]{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-height:44px}
.row{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:12px;margin-bottom:16px}
button{font:inherit;font-weight:700;border:0;border-radius:8px;padding:10px 22px;min-height:44px;cursor:pointer;background:var(--acc);color:#fff}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:focus-visible,input:focus-visible,.opt:focus-within{outline:3px solid #f2a33a;outline-offset:2px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0}
.bar .wrap{display:flex;align-items:center;gap:14px}
.prog{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
.cnt,.tm{font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
.tm.late{color:var(--bad);font-weight:700}
.q{border-top:1px solid var(--line);padding:24px 0}
.qh{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.no{font-weight:800;font-size:20px}
.tag{font-size:13px;color:var(--mute);border:1px solid var(--line);border-radius:99px;padding:1px 10px}
.kind{font-size:13px;color:var(--acc);font-weight:700}
.qt{margin:0 0 12px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin:8px 0;cursor:pointer;min-height:44px}
.opt input{margin-top:6px;width:18px;height:18px;flex:none;accent-color:var(--acc)}
.opt:has(input:checked){background:var(--sel);border-color:var(--acc)}
.done .opt{cursor:default}
.opt.right{border-color:var(--ok);border-width:2px}
.opt.wrong{border-color:var(--bad);border-style:dashed}
.opt>span:not(.mark){flex:1}
.mark{flex:none;margin-left:auto;font-size:14px;font-weight:700;white-space:nowrap}
.right .mark{color:var(--ok)}.wrong .mark{color:var(--bad)}
.exp{background:var(--card);border-radius:8px;padding:12px 14px;margin-top:10px;font-size:16px}
.res{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center}
.ring{width:140px;height:140px}
.big{font-size:clamp(40px,8vw,56px);font-weight:800;line-height:1}
.pass{font-weight:800;font-size:20px}
.sum{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.sum a{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:6px;font-size:14px;font-weight:700;text-decoration:none;color:#fff}
.foot{color:var(--mute);font-size:14px;padding:28px 0 48px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;place-items:center;z-index:9;padding:16px}
.modal.on{display:grid}
.modal .panel{max-width:420px;margin:0}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.send{margin-top:14px;font-size:15px;padding:10px 12px;border-radius:8px;background:var(--bg);border:1px solid var(--line)}
.send.ok{border-color:var(--ok);color:var(--ok)}.send.bad{border-color:var(--bad);color:var(--bad)}
.err{color:var(--bad);font-size:15px;margin:0 0 12px}
[hidden]{display:none!important}
@media(max-width:600px){.row{grid-template-columns:1fr}.res{grid-template-columns:1fr;justify-items:start}}
@media print{.bar,.btns,.noprint{display:none!important}.q{break-inside:avoid}}
@media(prefers-reduced-motion:reduce){.prog i{transition:none}}
</style>
<script src="../config.js" onerror="void 0"></script>
</head>
<body>
<div class="wrap">
<header>
  <h1>115 年度 檢傷訓練筆試</h1>
  <p class="sub">嘉基急診 檢傷人員訓練・依台灣急診檢傷與急迫度分級量表（TTAS）現行修正版</p>
  <div class="ttas" aria-hidden="true"><span style="background:#c62828"></span><span style="background:#ef6c00"></span><span style="background:#f9c80e"></span><span style="background:#2e7d32"></span><span style="background:#1565c0"></span></div>
  <div class="meta"><span>題數 <b>20 題</b></span><span>配分 <b>每題 5 分，共 100 分</b></span><span>及格 <b>80 分</b></span><span>時間 <b>30 分鐘</b></span></div>
</header>

<section id="start" class="panel">
  <div class="row">
    <div><label class="f" for="nm">姓名</label><input id="nm" type="text" autocomplete="off"></div>
    <div><label class="f" for="id">員工編號</label><input id="id" type="text" inputmode="numeric" autocomplete="off"></div>
  </div>
  <p style="margin:0 0 14px">題目與選項順序每次隨機排列。複選題須全部選對才給分。全部作答後按「交卷」，系統會立即顯示分數、正確答案與解析。</p>
  <p class="err" id="startErr" hidden></p>
  <button id="go">開始作答</button>
</section>
</div>

<div class="bar" id="bar" hidden><div class="wrap">
  <span class="cnt" id="cnt">0 / 20</span><div class="prog"><i id="pg"></i></div><span class="tm" id="tm">30:00</span>
</div></div>

<div class="wrap">
<section id="result" class="panel" hidden></section>
<form id="exam" hidden></form>
<div class="btns noprint" id="act" hidden>
  <button id="submit" type="button">交卷</button>
</div>
<p class="foot">依據：衛福部急診五級檢傷分類基準修正版（成人非外傷 108.6.11 修正、外傷、環境、兒童第二次修正）。</p>
</div>

<div class="modal" id="modal"><div class="panel">
  <p id="mtxt" style="margin:0"></p>
  <div class="btns"><button id="mok">確定交卷</button><button class="ghost" id="mno">繼續作答</button></div>
</div></div>

const BANK=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(RAW),c=>c.charCodeAt(0))));
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let paper=[],t0=0,timer=null,finished=false,lastSend=null;
const EXAM_ID="115檢傷筆試";
const API=()=>String((window.ER_CONFIG&&window.ER_CONFIG.EXAM_API)||"").trim();
async function send(){
  const box=document.getElementById('sendBox');if(!box||!lastSend)return;
  box.className='send';box.textContent='成績送出中…';
  for(let k=0;k<2;k++){
    try{
      const r=await fetch(API(),{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(lastSend)});
      const j=await r.json();
      if(j&&j.ok){box.className='send ok';box.textContent='成績已送出，護理長那邊已收到。';return}
      throw new Error((j&&j.error)||'伺服器沒有回應');
    }catch(e){if(k){box.className='send bad';box.innerHTML='成績送出失敗（'+esc(e.message||e)+'）。請不要關閉頁面，按 <button type="button" id="resend" class="ghost" style="min-height:36px;padding:4px 12px">重新送出</button>，或截圖給輔導員。';const b=document.getElementById('resend');if(b)b.onclick=send;return}
    await new Promise(r=>setTimeout(r,800))}
  }
}
const LIMIT=30*60;

function build(){
  paper=shuf(BANK).map(q=>({...q,o:shuf(q.o)}));
  $('#exam').innerHTML=paper.map((q,i)=>`<div class="q" id="q${i}">
    <div class="qh"><span class="no">${i+1}.</span><span class="tag">${esc(q.k)}</span><span class="kind">${q.t==='m'?'複選':'單選'}・5 分</span></div>
    <p class="qt">${esc(q.q)}</p>
    ${q.o.map((o,j)=>`<label class="opt" data-q="${i}" data-o="${j}"><input type="${q.t==='m'?'checkbox':'radio'}" name="a${i}" value="${j}"><span>${String.fromCharCode(65+j)}. ${esc(o[0])}</span></label>`).join('')}
  </div>`).join('');
  $('#exam').hidden=false;$('#act').hidden=false;$('#bar').hidden=false;
  $('#result').hidden=true;$('#submit').hidden=false;$('#exam').classList.remove('done');
  finished=false;t0=Date.now();clearInterval(timer);timer=setInterval(tick,1000);tick();count();
}
function picked(i){return [...document.querySelectorAll(`input[name=a${i}]:checked`)].map(x=>+x.value)}
function count(){
  const n=paper.filter((_,i)=>picked(i).length).length;
  $('#cnt').textContent=`${n} / ${paper.length}`;$('#pg').style.width=(n/paper.length*100)+'%';
  return n;
}
function tick(){
  const s=Math.floor((Date.now()-t0)/1000),left=LIMIT-s,a=Math.abs(left);
  const mm=String(Math.floor(a/60)).padStart(2,'0'),ss=String(a%60).padStart(2,'0');
  $('#tm').textContent=left>=0?`剩 ${mm}:${ss}`:`超時 ${mm}:${ss}`;
  $('#tm').classList.toggle('late',left<300);
}
function grade(){
  finished=true;clearInterval(timer);
  const used=Math.floor((Date.now()-t0)/1000);
  let score=0;
  const rows=paper.map((q,i)=>{
    const p=picked(i),key=q.o.map((o,j)=>o[1]?j:-1).filter(j=>j>=0);
    const ok=q.any?(p.length===1&&key.includes(p[0])):(p.length===key.length&&key.every(k=>p.includes(k)));
    if(ok)score+=5;
    document.querySelectorAll(`#q${i} .opt`).forEach(l=>{
      const j=+l.dataset.o,inp=l.querySelector('input');inp.disabled=true;
      if(q.o[j][1]){l.classList.add('right');l.insertAdjacentHTML('beforeend','<span class="mark">正解</span>')}
      else if(p.includes(j)){l.classList.add('wrong');l.insertAdjacentHTML('beforeend','<span class="mark">誤選</span>')}
    });
    const ans=key.map(k=>String.fromCharCode(65+k)).join(q.any?' 或 ':'、');
    $(`#q${i}`).insertAdjacentHTML('beforeend',`<div class="exp"><b style="color:var(${ok?'--ok':'--bad'})">${ok?'答對 +5':'答錯 0'}</b>　正確答案：${ans}<br>${esc(q.e)}</div>`);
    return {ok,id:q.id,k:q.k};
  });
  $('#exam').classList.add('done');
  const pass=score>=80,nm=$('#nm').value.trim(),id=$('#id').value.trim();
  const r=54,c=2*Math.PI*r,col=pass?'var(--ok)':'var(--bad)';
  const when=new Date().toLocaleString('zh-TW',{hour12:false});
  $('#result').innerHTML=`<div class="res">
    <svg class="ring" viewBox="0 0 140 140" aria-hidden="true"><circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--line)" stroke-width="12"/><circle cx="70" cy="70" r="${r}" fill="none" stroke="${col}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c*score/100} ${c}" transform="rotate(-90 70 70)"/></svg>
    <div><div class="big">${score}<span style="font-size:22px"> 分</span></div>
    <div class="pass" style="color:${col}">${pass?'及格':'未達 80 分'}</div>
    <div style="color:var(--mute);font-size:15px">${esc(nm||'（未填姓名）')}${id?'・'+esc(id):''}　答對 ${score/5} / 20 題　用時 ${Math.floor(used/60)} 分 ${used%60} 秒　${esc(when)}</div></div></div>
    <div class="sum">${rows.map(({ok},i)=>`<a href="#q${i}" style="background:${ok?'#1b7a3d':'#b3261e'}" aria-label="第${i+1}題${ok?'答對':'答錯'}">${i+1}</a>`).join('')}</div>
    ${API()?'<div class="send" id="sendBox"></div>':''}
    <div class="btns noprint"><button id="pr" type="button">列印 / 存 PDF</button><button class="ghost" id="again" type="button">重新作答（重新隨機）</button></div>`;
  $('#result').hidden=false;$('#submit').hidden=true;$('#bar').hidden=true;
  $('#pr').onclick=()=>{try{window.print()}catch(e){}};
  $('#again').onclick=()=>{lastSend=null;build();window.scrollTo(0,0)};
  if(API()){
    const res={};rows.forEach(r=>res[r.id]=r.ok?1:0);
    lastSend={action:'examSubmit',exam:EXAM_ID,name:nm,empId:id,score,correct:score/5,total:paper.length,seconds:used,pass,
      wrong:rows.filter(r=>!r.ok).map(r=>r.id+' '+r.k).join('、'),res,ua:navigator.userAgent.slice(0,120)};
    send();
  }
  $('#result').scrollIntoView({behavior:'smooth'});
}
$('#go').onclick=()=>{
  if(API()&&(!$('#nm').value.trim()||!$('#id').value.trim())){const e=$('#startErr');e.textContent='請先填寫姓名與員工編號，成績才會正確送出。';e.hidden=false;return}
  $('#start').hidden=true;build();window.scrollTo(0,0)};
$('#exam').addEventListener('change',count);
$('#exam').addEventListener('submit',e=>e.preventDefault());
$('#submit').onclick=()=>{
  const n=count(),miss=paper.length-n;
  $('#mtxt').textContent=miss?`還有 ${miss} 題未作答，未答以 0 分計。確定要交卷嗎？`:'已全部作答，確定要交卷嗎？交卷後無法修改。';
  $('#modal').classList.add('on');
};
$('#mok').onclick=()=>{$('#modal').classList.remove('on');grade()};
$('#mno').onclick=()=>$('#modal').classList.remove('on');
window.addEventListener('beforeunload',e=>{if(paper.length&&!finished){e.preventDefault();e.returnValue=''}});
}
</script>
</body>
</html>
