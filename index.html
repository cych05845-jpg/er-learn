const CASES = [{"id": 1, "unit": 1, "src": "課前練習", "text": "58 歲男性，胸悶 30 分鐘、冒冷汗，疼痛 6/10。", "vitals": "BP 150/90、HR 98、SpO₂ 97%", "attr": "M", "cpls": ["A0202"], "key": "A020210", "keyText": "疑似心因性胸痛/胸悶", "lv": 2, "why": "冒冷汗＋胸悶，選疑似心因性胸痛即為 2 級；檢傷即做 EKG。"}, {"id": 2, "unit": 1, "src": "課前練習", "text": "45 歲男性，氣喘病史，只能說片語、使用呼吸輔助肌。", "vitals": "SpO₂ 91%、R 28", "attr": "M", "cpls": ["A0101"], "key": "A010104", "keyText": "中度呼吸窘迫(<92%)", "lv": 2, "why": "只能說片語、用輔助肌、SpO₂ < 92%：中度呼吸窘迫。"}, {"id": 3, "unit": 1, "src": "課前練習", "text": "60 歲女性，化療中，發燒 38.3°C 2 小時，無其他不適。", "vitals": "生命徵象穩定", "attr": "M", "cpls": ["A1302"], "key": "A130208", "keyText": "發燒(免疫功能缺陷)", "lv": 2, "why": "化療中（結束三週內仍算）發燒即為免疫功能缺陷，2 級。"}, {"id": 4, "unit": 1, "src": "課前練習", "text": "72 歲女性，發燒 38.6°C、精神差、看起來有病容。", "vitals": "BP 128/70、HR 104、SpO₂ 95%", "attr": "M", "cpls": ["A1302"], "key": "A130213", "keyText": "發燒(看起來有病容)", "lv": 3, "why": "有病容 3 級；HR 異於平常但穩定也是 3 級。出現灌流不足才升 2 級。"}, {"id": 5, "unit": 1, "src": "課前練習", "text": "66 歲男性，平日意識清楚，今晨家屬發現叫不太醒。", "vitals": "E3V4M6（GCS 13）", "attr": "M", "cpls": ["A0401"], "key": "A040106", "keyText": "意識程度改變(GCS9-13)", "lv": 2, "why": "GCS 9–13 為 2 級；檢傷時測血糖排除低血糖。"}, {"id": 6, "unit": 1, "src": "課前練習", "text": "35 歲女性，右腳踝扭傷可跛行，疼痛 5/10，末梢循環與感覺正常。", "vitals": "生命徵象穩定", "attr": "T", "cpls": ["T1209"], "key": "T120903", "keyText": "急性周邊中度疼痛(4-7)", "lv": 4, "why": "周邊中度疼痛 4 級；記錄末梢循環、感覺、運動。"}, {"id": 7, "unit": 1, "src": "學會案例 18", "text": "63 歲男性，長期臥床昏迷，從護理之家送來，鼻胃管滑脫。", "vitals": "GCS 5、SpO₂ 95%、HR 74、BP 138/90", "attr": "M", "cpls": ["A1309"], "key": "A130918", "keyText": "醫療裝置問題(無其他症狀或窘迫徵象)，生命徵象正常，無發燒，無疼痛不適", "lv": 4, "why": "平日即昏迷，檢傷只看急性問題；鼻胃管滑脫無其他症狀為 4 級。"}, {"id": 8, "unit": 1, "src": "課前練習", "text": "30 歲男性，昨日縫合傷口，今日來換藥。", "vitals": "生命徵象正常，無發燒", "attr": "M", "cpls": ["A1306"], "key": "A130608", "keyText": "單純換藥，生命徵象正常，無發燒，無疼痛不適", "lv": 5, "why": "生命徵象正常、無不適的換藥為 5 級，可轉介門診。"}, {"id": 9, "unit": 1, "src": "學會案例 1", "text": "42 歲男性，沒有反應，皮膚蒼白濕冷，受傷機轉不明。看起來像中度呼吸窘迫。", "vitals": "GCS 6、SpO₂ 測不到、P 微弱、R 10、BP 測不到", "attr": "M", "cpls": ["A0401"], "key": "A040103", "keyText": "無意識(GCS3-8)", "lv": 1, "why": "不能說話、無法保護呼吸道，已符合重度；GCS 6 無意識、休克，皆為 1 級。"}, {"id": 10, "unit": 1, "src": "學會案例 14", "text": "66 歲女性，右下肢痠痛、腳踝紅腫，沒有受傷，無其他症狀，疼痛 6/10。", "vitals": "T 37.4°C、P 92、R 21、BP 222/130", "attr": "M", "cpls": ["A0204", "A0503"], "key": "A020409", "keyText": "SBP≥220mmHg或DBP≥130mmHg，無症狀", "lv": 3, "why": "下肢痛與血壓無因果，視為無症狀的重度高血壓（3 級）；發現比原主訴更需處理的問題要優先選，避免低估。"}, {"id": 11, "unit": 1, "src": "學會案例 17", "text": "40 歲女性，上腹悶痛約一天，疼痛 3/10，腹脹、胃口差、輕微噁心無嘔吐。", "vitals": "GCS 15、SpO₂ 97%、生命徵象正常", "attr": "M", "cpls": ["A0301"], "key": "A030117", "keyText": "急性中樞輕度疼痛(<4)", "lv": 4, "why": "生命徵象穩定，中樞輕度疼痛為 4 級。"}, {"id": 12, "unit": 1, "src": "學會案例 20", "text": "64 歲男性，昨天因左下肢疼痛來過急診，今天由門診轉入安排腰椎 CT。無病容，疼痛已緩解。", "vitals": "T 36.8°C、P 90、R 18、BP 130/78", "attr": "M", "cpls": ["A1308", "A1305"], "key": "A130801", "keyText": "影像檢查，生命徵象正常，無發燒，無疼痛不適", "lv": 5, "why": "影像檢查且生命徵象正常無不適為 5 級（選轉診亦可）。"}, {"id": 13, "unit": 2, "src": "課前練習", "text": "28 歲男性，騎機車被時速約 50 公里的汽車撞倒，左前臂擦傷，疼痛 3/10。", "vitals": "生命徵象穩定", "attr": "T", "cpls": ["T1203"], "key": "T120304", "keyText": "高危險性受傷機轉", "lv": 2, "why": "機車被車速 > 30 公里/小時的汽車撞擊屬高危險機轉，傷口再小也是 2 級；單純機車自摔則不算。"}, {"id": 14, "unit": 2, "src": "課前練習", "text": "40 歲男性，從約 9 公尺鷹架墜落，意識清楚，背痛 6/10。", "vitals": "BP 130/80、HR 88", "attr": "T", "cpls": ["T0101", "T1001"], "key": "T010109", "keyText": "高危險性受傷機轉", "lv": 2, "why": "> 6 公尺墜落為高危險機轉，2 級；先做頸椎與脊椎保護。"}, {"id": 15, "unit": 2, "src": "課前練習", "text": "45 歲男性，左胸被刀刺傷，傷口約 2 公分。", "vitals": "生命徵象穩定", "attr": "T", "cpls": ["T0802"], "key": "T080209", "keyText": "胸部穿刺傷", "lv": 2, "why": "胸部穿刺傷本身即 2 級，生命徵象穩定也不降級。"}, {"id": 16, "unit": 2, "src": "課前練習", "text": "70 歲女性，在家滑倒撞到頭，想不起跌倒經過，頭痛 3/10。", "vitals": "GCS 15", "attr": "T", "cpls": ["T0201"], "key": "T020116", "keyText": "外傷後有意識喪失或失憶之現象", "lv": 3, "why": "傷後失憶為 3 級；記得追問抗凝血劑。"}, {"id": 17, "unit": 2, "src": "課前練習", "text": "22 歲男性，菜刀切到左前臂，傷口 3 公分，加壓 10 分鐘後已止血。", "vitals": "生命徵象穩定", "attr": "T", "cpls": ["T1203"], "key": "T120311", "keyText": "加壓後已止血", "lv": 3, "why": "加壓後才止血為 3 級；自行停止出血為 4 級。"}, {"id": 18, "unit": 2, "src": "課前練習", "text": "55 歲男性，滑倒後右小腿明顯腫脹變形，疼痛 8/10，足背脈搏可觸及。", "vitals": "生命徵象穩定", "attr": "T", "cpls": ["T1206"], "key": "T120617", "keyText": "下肢其他部位腫脹變形，疑似骨折/脫臼", "lv": 3, "why": "小腿疑似骨折為 3 級（大腿股骨幹才是 2 級）；先固定、冰敷、抬高。"}, {"id": 19, "unit": 2, "src": "課前練習", "text": "35 歲女性，右腳踝打石膏 2 天，腳趾發紫冰冷、麻木。", "vitals": "生命徵象穩定", "attr": "T", "cpls": ["T1206"], "key": "T120611", "keyText": "石膏緊密，伴隨神經受損或肢體血管循環不佳徵象", "lv": 2, "why": "石膏過緊合併循環或神經受損為 2 級；循環正常則 4 級。"}, {"id": 20, "unit": 2, "src": "課前練習", "text": "30 歲男性，打籃球右手無名指挫傷，可彎曲，疼痛 2/10。", "vitals": "生命徵象穩定", "attr": "T", "cpls": ["T1201"], "key": "T120119", "keyText": "急性周邊輕度疼痛(<4)", "lv": 5, "why": "周邊輕度疼痛 5 級，可轉介門診。"}, {"id": 21, "unit": 2, "src": "學會案例 2", "text": "EMT 送入嚴重汽車車禍傷患，懷孕 5 個月，意識清楚，嚴重腹痛 9/10，呼吸淺快、冒冷汗、腹部僵硬。", "vitals": "T 36.1°C、P 130、R 28、BP 90/60", "attr": "T", "cpls": ["T0901"], "key": "T090103", "keyText": "休克", "lv": 1, "why": "冒冷汗、呼吸淺快屬休克 → 1 級；只看血壓或疼痛會誤判為 2 級。孕婦外傷亦可再上調一級。"}, {"id": 22, "unit": 2, "src": "學會案例 5", "text": "23 歲化學工人，化學液體噴濺到臉部，臉和左眼灼熱，無呼吸困難或口咽不適。", "vitals": "SpO₂ 96%、P 96、BP 140/88", "attr": "E", "cpls": ["E0105", "A0810"], "key": "E010509", "keyText": "化學物質濺入眼睛，造成傷害", "lv": 2, "why": "化學物質濺入眼睛造成傷害、顏面灼傷皆為 2 級；檢傷即開始沖洗。"}, {"id": 23, "unit": 2, "src": "學會案例 16", "text": "77 歲女性，昨天跌倒右手臂受傷，沒有抱怨疼痛。右手腕明顯變形，用雜誌固定，手部循環與功能正常。", "vitals": "P 62、BP 132/86", "attr": "T", "cpls": ["T1201"], "key": "T120116", "keyText": "腫脹變形，疑似骨折/脫臼", "lv": 3, "why": "不痛不等於沒事：變形疑似骨折為 3 級；循環正常所以不到 2 級。"}, {"id": 24, "unit": 2, "src": "學會案例 19", "text": "26 歲女性在海灘踩到玻璃，足踝 3 公分撕裂傷，到院時未加壓已自行止血。", "vitals": "生命徵象正常", "attr": "T", "cpls": ["T1208"], "key": "T120813", "keyText": "表淺撕裂性/出血已停止", "lv": 4, "why": "出血已自行停止為 4 級；加壓後才止血則為 3 級。"}, {"id": 25, "unit": 2, "src": "案例討論", "text": "凌晨酒醉男子扶著頭部流血的朋友到檢傷台。傷者意識清楚，頭皮撕裂 3 公分，加壓後仍持續滲血。", "vitals": "生命徵象穩定", "attr": "T", "cpls": ["T0203"], "key": "T020310", "keyText": "無法控制的出血", "lv": 2, "why": "加壓後仍出血屬無法控制的出血，2 級；也要問機轉，鈍器攻擊屬高危險。"}, {"id": 26, "unit": 3, "src": "課前練習", "text": "62 歲男性，慢跑時突然昏倒約 1 分鐘，現已清醒。", "vitals": "生命徵象穩定", "attr": "M", "cpls": ["A0206"], "key": "A020611", "keyText": "發生在運動期間", "lv": 2, "why": "運動中暈厥為 2 級；檢傷即做 EKG。"}, {"id": 27, "unit": 3, "src": "課前練習", "text": "55 歲女性，頭痛、噁心。", "vitals": "BP 226/124、HR 88", "attr": "M", "cpls": ["A0204"], "key": "A020407", "keyText": "SBP≥220mmHg或DBP≥130mmHg，伴隨任一症狀(呼吸短促、胸痛、頭痛、噁心嘔吐、眩暈)", "lv": 2, "why": "SBP ≥ 220 伴任一症狀為 2 級；SBP 或 DBP 任一達標即可。"}, {"id": 28, "unit": 3, "src": "課前練習", "text": "50 歲男性，社區量血壓 210/115，無任何不適，來急診確認。", "vitals": "BP 210/115", "attr": "M", "cpls": ["A0204"], "key": "A020411", "keyText": "SBP200-220mmHg或DBP110-130mmHg，無症狀", "lv": 4, "why": "SBP 200–220 或 DBP 110–130 且無症狀為 4 級。"}, {"id": 29, "unit": 3, "src": "課前練習", "text": "68 歲男性，2 小時前突然左手左腳無力、講話不清楚。", "vitals": "生命徵象穩定", "attr": "M", "cpls": ["A0410"], "key": "A041011", "keyText": "症狀發作時間<6小時", "lv": 2, "why": "中風症狀發作 < 6 小時為 2 級（108.6.11 修正；「肢體無力」主訴才用 4.5 小時）；問清最後正常時間並依流程啟動。"}, {"id": 30, "unit": 3, "src": "課前練習", "text": "40 歲男性，肝硬化病史，吐少量咖啡色液體。", "vitals": "生命徵象正常", "attr": "M", "cpls": ["A0309"], "key": "A030911", "keyText": "小量的嘔吐，生命徵象正常/咖啡色嘔吐物，但合併有肝硬化或食道靜脈曲張出血", "lv": 2, "why": "咖啡色嘔吐物合併肝硬化或靜脈曲張為 2 級；無此病史為 3 級。"}, {"id": 31, "unit": 3, "src": "課前練習", "text": "35 歲女性，今天解一次少量黑便，無腹痛。", "vitals": "生命徵象正常", "attr": "M", "cpls": ["A0310"], "key": "A031017", "keyText": "小量血便/黑便", "lv": 4, "why": "小量 4 級、中量 3 級、大量 2 級；記得問抗凝血劑、NSAID。"}, {"id": 32, "unit": 3, "src": "課前練習", "text": "28 歲男性，癲癇病史，在家抽搐約 2 分鐘，現在意識清楚。", "vitals": "生命徵象穩定", "attr": "M", "cpls": ["A0405"], "key": "A040516", "keyText": "抽搐已停止，意識清醒", "lv": 3, "why": "抽搐已停止且意識清醒為 3 級；持續抽搐為 1 級。"}, {"id": 33, "unit": 3, "src": "課前練習", "text": "75 歲女性，發燒 38.9°C。家屬說她平常血壓約 140/80。", "vitals": "R 24、HR 116、BP 100/58", "attr": "M", "cpls": ["A1302"], "key": "A130206", "keyText": "血行動力循環不足", "lv": 2, "why": "血壓低於平常＋心跳快：循環不足，2 級；也符合疑似敗血症。"}, {"id": 34, "unit": 3, "src": "學會案例 3", "text": "60 歲女性，發燒 2 小時，2 天前做過化療。皮膚潮紅乾暖，看起來有病容。", "vitals": "GCS 15、SpO₂ 96%、T 39°C、P 102、BP 110/80", "attr": "M", "cpls": ["A1302"], "key": "A130208", "keyText": "發燒(免疫功能缺陷)", "lv": 2, "why": "化療中發燒，生命徵象穩定仍為 2 級。"}, {"id": 35, "unit": 3, "src": "學會案例 4", "text": "68 歲女性，嚴重胸骨下疼痛放射到頸部，呼吸短促費力，說話斷斷續續，疼痛 9/10。", "vitals": "SpO₂ 91%、P 86、R 24、BP 112/78", "attr": "M", "cpls": ["A0202", "A0101"], "key": "A020210", "keyText": "疑似心因性胸痛/胸悶", "lv": 2, "why": "疑似心因性胸痛、中度呼吸窘迫、中樞重度疼痛都是 2 級；有休克或重度窘迫才是 1 級。"}, {"id": 36, "unit": 3, "src": "學會案例 8", "text": "22 歲男性，運動時暈厥，現已清醒；一週前也發生過一次。", "vitals": "GCS 15、SpO₂ 99%、P 62、BP 114/52", "attr": "M", "cpls": ["A0206"], "key": "A020611", "keyText": "發生在運動期間", "lv": 2, "why": "年輕、已清醒仍為 2 級，檢傷即做 EKG。"}, {"id": 37, "unit": 3, "src": "學會案例 9", "text": "42 歲女性，吃完海鮮麵後全身起紅疹、搔癢，以前有過敏史。", "vitals": "P 77、R 17、BP 140/89", "attr": "M", "cpls": ["A0903"], "key": "A090308", "keyText": "廣泛性紅疹", "lv": 3, "why": "廣泛性紅疹 3 級；無嚴重過敏反應描述，但仍要評估呼吸道與循環。"}, {"id": 38, "unit": 3, "src": "學會案例 10", "text": "72 歲男性，今早咳出兩口血塊，最近感冒咳嗽有痰，有支氣管擴張病史，是急診常客。", "vitals": "SpO₂ 93%、P 74、R 26、BP 136/84", "attr": "M", "cpls": ["A0105"], "key": "A010514", "keyText": "咳血塊", "lv": 3, "why": "咳血塊與輕度呼吸窘迫皆為 3 級；急診常客的急性惡化更要小心。"}, {"id": 39, "unit": 3, "src": "學會案例 11", "text": "75 歲男性，全身虛弱、頭痛、發燒 3 天，輕微呼吸費力與咳嗽。", "vitals": "GCS 14、SpO₂ 94%、T 38.5°C、P 98、R 20", "attr": "M", "cpls": ["A0205", "A1302", "A0101"], "key": "A020509", "keyText": "輕度呼吸窘迫(92-94%)", "lv": 3, "why": "輕度呼吸窘迫、發燒有病容皆為 3 級；做發燒篩檢與感控。"}, {"id": 40, "unit": 3, "src": "學會案例 15", "text": "76 歲男性，6 小時前右手突然無力、口齒不清，現在慢慢恢復。", "vitals": "GCS 15、SpO₂ 94%、P 107、BP 146/92", "attr": "M", "cpls": ["A0410"], "key": "A041017", "keyText": "症狀發作時間>6小時或已緩解", "lv": 3, "why": "發作 > 6 小時或已緩解為 3 級（108.6.11 修正，舊版為 4.5 小時）。"}, {"id": 41, "unit": 3, "src": "林口長庚示範", "text": "64 歲男性，COPD，因喘被推入急診，呼吸費力、有喘鳴，噘嘴斷斷續續說從昨天開始咳嗽、呼吸困難。", "vitals": "SpO₂ 94%、T 38.3°C、P 96、R 23", "attr": "M", "cpls": ["A0101"], "key": "A010104", "keyText": "中度呼吸窘迫(<92%)", "lv": 2, "why": "只看 SpO₂ 94% 會判 3 級；呼吸費力、說話斷續是中度窘迫，描述優先於數值。"}, {"id": 42, "unit": 3, "src": "林口長庚示範", "text": "76 歲男性，30 分鐘前開始劇烈腹痛，說「好像被扯斷」，疼痛 10/10，有高血壓。臉色蒼白、皮膚冰冷冒汗。", "vitals": "SpO₂ 94%、P 122、R 24、BP 88/68", "attr": "M", "cpls": ["A0301"], "key": "A030102", "keyText": "休克", "lv": 1, "why": "疼痛最多給到 2 級，休克徵象決定 1 級。"}, {"id": 43, "unit": 3, "src": "案例討論", "text": "72 歲女性，糖尿病與高血壓。主訴整天沒力氣、胃不太舒服，否認胸痛，皮膚微濕。", "vitals": "HR 96、BP 108/70（平常約 150/90）、SpO₂ 95%", "attr": "M", "cpls": ["A0205", "A0301"], "key": "A020505", "keyText": "血行動力循環不足", "lv": 2, "why": "血壓低於平常＋皮膚濕：循環不足 2 級；高齡女性糖尿病要警覺不典型心梗，檢傷即做 EKG。"}, {"id": 44, "unit": 3, "src": "案例討論", "text": "48 歲男性，滿身酒味，叫得醒但講話含糊。朋友說他每次都這樣。", "vitals": "HR 92、BP 132/80、SpO₂ 96%、E3V4M6", "attr": "M", "cpls": ["A1201"], "key": "A120106", "keyText": "意識程度改變(GCS9-13)", "lv": 2, "why": "依 TTAS Q&A，酒醉意識不清選物質誤用/中毒；GCS 13 為 2 級。測血糖、排除頭部外傷。"}, {"id": 45, "unit": 4, "src": "課前練習", "text": "2 個月大男嬰，發燒 38.2°C，吃奶正常，活動力佳。", "vitals": "T 38.2°C", "attr": "P", "cpls": ["P1301"], "key": "P130108", "keyText": "年齡<3M，體溫>38℃或<36℃", "lv": 2, "why": "未滿 3 個月發燒一律 2 級，活動力佳也不降級。"}, {"id": 46, "unit": 4, "src": "課前練習", "text": "1 歲半女童，發燒 39°C 一天，在候診區玩玩具、會笑。", "vitals": "T 39°C", "attr": "P", "cpls": ["P1301"], "key": "P130114", "keyText": "年齡3M~3Y，體溫>38℃，看起來無病容(活動力佳)", "lv": 3, "why": "3 個月–3 歲發燒、無病容為 3 級。"}, {"id": 47, "unit": 4, "src": "課前練習", "text": "5 歲男童，發燒 38.6°C，活動力佳，無其他不適。", "vitals": "T 38.6°C", "attr": "P", "cpls": ["P1301"], "key": "P130116", "keyText": "年齡>3Y，體溫>38℃，看起來無病容(活動力佳)", "lv": 4, "why": "3 歲以上發燒、無病容為 4 級。"}, {"id": 48, "unit": 4, "src": "課前練習", "text": "4 歲女童，發燒半天，下肢出現紫斑，精神差、一直想睡。", "vitals": "發燒", "attr": "P", "cpls": ["P1301"], "key": "P130111", "keyText": "紫斑或瘀斑，病容明顯", "lv": 2, "why": "紫斑或瘀斑合併明顯病容為 2 級，立即隔離並通知醫師。"}, {"id": 49, "unit": 4, "src": "課前練習", "text": "3 歲男童，犬吠樣咳嗽，安靜時也有喘鳴聲，鼻翼搧動併胸骨上與肋間凹陷。", "vitals": "SpO₂ 93%", "attr": "P", "cpls": ["P0109"], "key": "P010905", "keyText": "中度呼吸窘迫(<92%)", "lv": 2, "why": "凹陷與鼻翼搧動是中度窘迫；表現與 SpO₂ 不一致時取較高級。"}, {"id": 50, "unit": 4, "src": "課前練習", "text": "32 歲孕婦，懷孕 34 週，陰道出血，無腹痛。", "vitals": "生命徵象穩定", "attr": "M", "cpls": ["A1008"], "key": "A100805", "keyText": "第三孕期陰道出血", "lv": 1, "why": "第三孕期陰道出血為 1 級；不做內診，立即通知產科。"}, {"id": 51, "unit": 4, "src": "課前練習", "text": "27 歲孕婦，懷孕 38 週，宮縮每 2 分鐘一次。", "vitals": "生命徵象穩定", "attr": "M", "cpls": ["A1008"], "key": "A100813", "keyText": "急產(宮縮≤2分鐘)/已破水", "lv": 2, "why": "宮縮間隔 ≤ 2 分鐘為急產，2 級。"}, {"id": 52, "unit": 4, "src": "課前練習", "text": "35 歲孕婦，懷孕 30 週，頭痛、雙腳水腫。", "vitals": "BP 162/104", "attr": "M", "cpls": ["A1008"], "key": "A100815", "keyText": "頭痛+/-水腫+/-腹痛+/-高血壓", "lv": 2, "why": "頭痛 ± 水腫 ± 高血壓為 2 級，警覺子癲前症。"}, {"id": 53, "unit": 4, "src": "學會案例 7", "text": "3 歲兒童 1 小時前吞了奶奶的心臟藥，數量不明。意識清楚、噁心，在檢傷吐了一次。", "vitals": "SpO₂ 97%、P 70、R 24", "attr": "P", "cpls": ["P1201"], "key": "P120110", "keyText": "高危險性物質/不明物質", "lv": 2, "why": "高危險或不明物質為 2 級；3 歲心跳 70 偏慢，留意心臟藥毒性。"}, {"id": 54, "unit": 4, "src": "學會案例 12", "text": "20 歲女性，陰道出血，輕微腹部絞痛像平常經痛。近一年月經不規則，沒有性生活。", "vitals": "SpO₂ 99%、P 90、BP 110/74", "attr": "M", "cpls": ["A1005"], "key": "A100521", "keyText": "陰道出血-少量/點狀，生命徵象正常，無發燒，無疼痛不適", "lv": 4, "why": "少量出血、生命徵象正常為 4 級；若可能懷孕則為 3 級。"}, {"id": 55, "unit": 4, "src": "學會案例 13", "text": "4 歲兒童睡覺時發燒後抽搐近 1 分鐘，過去已發生 3 次、型態相同。檢傷時無病容、跑來跑去。", "vitals": "T 39°C、P 100、R 22", "attr": "P", "cpls": ["P0405"], "key": "P040519", "keyText": "抽搐已停止，意識清醒", "lv": 3, "why": "到院主因是抽搐，從抽搐判定依據選：已停止且意識清醒為 3 級，不用發燒判定。"}, {"id": 56, "unit": 4, "src": "TTAS 兒童案例", "text": "6 歲兒童氣喘發作，呈重度呼吸窘迫、發紺。", "vitals": "RR 28、HR 140、SpO₂ 84%", "attr": "P", "cpls": ["P0108", "P0101"], "key": "P010801", "keyText": "重度呼吸窘迫(<90%)", "lv": 1, "why": "發紺與 SpO₂ 84% 為重度呼吸窘迫，1 級。"}, {"id": 57, "unit": 4, "src": "TTAS 兒童案例", "text": "5 歲兒童被花生嗆到，呼吸費力。", "vitals": "RR 26、HR 120、SpO₂ 96%", "attr": "P", "cpls": ["P0106"], "key": "P010604", "keyText": "中度呼吸窘迫(<92%)", "lv": 2, "why": "SpO₂ 正常不代表沒有窘迫，呼吸費力即為中度，2 級。"}, {"id": 58, "unit": 4, "src": "TTAS 兒童案例", "text": "7 個月大，嘔吐、腹瀉含血便，已兩天拒食，活動力差。", "vitals": "BT 38°C、RR 30、HR 170、SpO₂ 96%、CRT 3 秒", "attr": "P", "cpls": ["P0305"], "key": "P030505", "keyText": "血行動力循環不足/中度脫水*", "lv": 2, "why": "HR 170、CRT 延長、活動力差為循環不足，2 級。"}, {"id": 59, "unit": 4, "src": "TTAS 兒童案例", "text": "1 歲 6 個月，發燒兩天，在家抽搐 3 分鐘，到院時已停止，但眼神呆滯、反應遲鈍。", "vitals": "RR 22、HR 130、BT 38°C", "attr": "P", "cpls": ["P0405"], "key": "P040513", "keyText": "抽搐已停止，意識仍未恢復", "lv": 2, "why": "抽搐已停止但意識未恢復為 2 級；對照學會案例 13。"}, {"id": 60, "unit": 4, "src": "TTAS 兒童案例", "text": "2 歲 7 個月，感冒多日、嘔吐，哭鬧無法安撫，眼神呆滯。", "vitals": "RR 30、HR 120", "attr": "P", "cpls": ["P1305"], "key": "P130506", "keyText": "意識程度改變(GCS9-13)", "lv": 2, "why": "無法安撫的哭鬧可能是意識改變的警訊，2 級。"}, {"id": 61, "unit": 4, "src": "TTAS 兒童案例", "text": "3 歲兒童，腹部輕度疼痛，膽汁性嘔吐，膚色紅潤、呼吸不費力。", "vitals": "RR 30、HR 150、SpO₂ 98%", "attr": "P", "cpls": ["P0301"], "key": "P030116", "keyText": "合併膽汁性嘔吐", "lv": 3, "why": "輕度疼痛只有 4 級，膽汁性嘔吐把級數拉到 3 級。"}, {"id": 62, "unit": 4, "src": "林口長庚示範", "text": "6 歲女孩腹痛、嘔吐，無發燒，活動力正常。", "vitals": "T 36.7°C、P 140、R 22、BP 90/50", "attr": "P", "cpls": ["P0301"], "key": "P030112", "keyText": "血壓或心跳有異於病人之平常數值，但血行動力穩定", "lv": 3, "why": "HR 已達 2 級數值，但不符循環不足的綜合描述，判 3 級。"}, {"id": 63, "unit": 4, "src": "TTAS 兒童案例", "text": "8 歲鐮刀型貧血兒童，發燒 38.6°C，看起來無病容。", "vitals": "脈搏呼吸正常", "attr": "P", "cpls": ["P1301"], "key": "P130110", "keyText": "年齡>3Y，體溫>38℃，免疫功能缺陷", "lv": 2, "why": "免疫功能缺陷的發燒為 2 級，看起來無病容也一樣。"}, {"id": 64, "unit": 4, "src": "案例討論", "text": "9 個月大女嬰，腹瀉 3 天、今天吐 4 次，尿布 12 小時沒濕。不太哭、眼神不追物；皮膚花斑、四肢冰涼，CRT 4 秒。", "vitals": "心跳很快、血壓正常", "attr": "P", "cpls": ["P0305"], "key": "P030502", "keyText": "休克/重度脫水*", "lv": 1, "why": "外觀＋循環異常：非代償性休克，1 級。血壓正常不能排除兒童休克。"}, {"id": 65, "unit": 4, "src": "案例討論", "text": "28 歲女性，右下腹痛 3 小時，疼痛 6/10，起身會頭暈。最後月經約 7 週前。", "vitals": "HR 112、BP 96/60、SpO₂ 98%", "attr": "M", "cpls": ["A0301", "A1009"], "key": "A030105", "keyText": "血行動力循環不足", "lv": 2, "why": "循環不足 2 級（中樞中度疼痛 3 級，取高）；優先懷疑子宮外孕。"}, {"id": 66, "unit": 5, "src": "學會案例 6", "text": "26 歲女性，從密閉車庫中被救出，當時汽車引擎仍發動。意識清楚，不願眼神接觸、不回答問題，但配合檢傷。", "vitals": "P 102、R 22、BP 118/76", "attr": "M", "cpls": ["A1101"], "key": "A110101", "keyText": "企圖自殺或者有明確的計畫", "lv": 2, "why": "有明確計畫的自殺企圖為 2 級；同時評估一氧化碳暴露，不讓病人獨處。"}];

async function bmCall(action, body, okMsg){
  BM.busy = true; BM.err = ""; BM.msg = ""; bmDraw();
  try {
    const r = await ACC.api(action, body); if (!r.ok) throw new Error(r.error);
    const l = await ACC.api("boardList"); if (l.ok) bmSync(l.items);
    BM.msg = typeof okMsg === "function" ? okMsg(r) : okMsg; return true;
  } catch (e) { BM.err = e.message || "沒有成功，請稍後再試"; return false; }
  finally { BM.busy = false; if (route === "bmanage") bmDraw(); }
}
async function bmClick(e){
  const b = e.target.closest("[data-act]"); if (!b || BM.busy) return;
  const act = b.dataset.act, id = b.dataset.id, o = id && BM.items.find(x => x.id === id);
  const form = () => ({ id: BM.edit || "", d: $("bD").value, tag: $("bTag").value.trim() || "公告", t: $("bT").value.trim(), b: $("bB").value, link: $("bL").value.trim(), hide: !$("bShow").checked });
  if (act === "edit") { BM.edit = id; BM.draft = null; BM.msg = BM.err = ""; bmDraw(); window.scrollTo(0, 0); return; }
  if (act === "cancel") { BM.edit = null; BM.draft = null; BM.msg = BM.err = ""; bmDraw(); return; }
  const f = form(); if (f.t || f.b || f.link || BM.edit) BM.draft = f;   // 重畫時保留還沒存的內容
  if (act === "del") { BM.del = id; bmDraw(); }
  else if (act === "delno") { BM.del = null; bmDraw(); }
  else if (act === "delyes") { BM.del = null; if (BM.edit === id) { BM.edit = null; BM.draft = null; } await bmCall("boardDelete", { id }, "已刪除"); }
  else if (act === "toggle" && o) await bmCall("boardSave", { item: { ...o, link: o.u || o.go || "", hide: !o.hide } }, o.hide ? "已顯示在學習站" : "已隱藏");
  else if (act === "import") await bmCall("boardImport", { items: BOARD_STATIC.map(x => ({ ...x, link: x.u || x.go || "" })) }, r => `搬入 ${r.added} 則` + (r.skipped ? `，略過 ${r.skipped} 則重複或缺資料的` : ""));
  else if (act === "save") {
    const item = f; BM.draft = f;
    if (!item.d) { BM.err = "請選日期"; return bmDraw(); }
    if (!item.t) { BM.err = "請填標題"; return bmDraw(); }
    const wasEdit = !!BM.edit;
    if (await bmCall("boardSave", { item }, wasEdit ? "已儲存修改" : "已發佈，首頁馬上看得到")) { BM.edit = null; BM.draft = null; bmDraw(); }
  }
}

const lvButtons = () => `<div class="lvbtns" id="lvb">${[1,2,3,4,5].map(l => `<button class="lvbg${l}" data-l="${l}">${l}<small>${LVN[l]}</small></button>`).join("")}</div>`;

function rush(){
  setBar("檢傷快打", "60 秒，判越多越好", "games", "--z-resus");
  const G = { t: 60, score: 0, combo: 0, n: 0, ok: 0, miss: [], q: shuffle(CASES), i: 0 };
  $("view").innerHTML = `<div class="gamebox">
    <div class="ghead"><span class="timer" id="gT">60</span><span><span class="score" id="gS">0</span> 分 <span class="combo" id="gC"></span></span></div>
    <div class="gcase" id="gQ"></div>${lvButtons()}<div id="gF"></div></div>`;
  const show = () => { const c = G.q[G.i % G.q.length]; $("gQ").innerHTML = `<p>${esc(c.text)}</p><div class="vitals">${esc(c.vitals)}</div>`; };
  show();
  stopGame();
  GT = setInterval(() => { G.t--; $("gT").textContent = G.t; $("gT").classList.toggle("low", G.t <= 10); if (G.t <= 0) end(); }, 1000);
  $("lvb").onclick = e => {
    const b = e.target.closest("[data-l]"); if (!b || G.t <= 0) return;
    const c = G.q[G.i % G.q.length], l = +b.dataset.l; G.n++;
    if (l === c.lv) { G.ok++; G.combo++; G.score += 10 + (G.combo >= 3 ? 5 : 0); $("gF").innerHTML = `<div class="flashmsg ok">✓ 第 ${c.lv} 級｜${esc(c.keyText)}</div>`; }
    else { G.combo = 0; G.miss.push({ c, l }); $("gF").innerHTML = `<div class="flashmsg bad">✗ 你按 ${l}，答案是第 ${c.lv} 級｜${esc(c.keyText)}</div>`; }
    $("gS").textContent = G.score; $("gC").textContent = G.combo >= 3 ? `連對 ${G.combo}，每題 +5` : "";
    G.i++; show();
  };
  function end(){
    stopGame();
    const best = Math.max(store.get("best-rush", 0), G.score); store.set("best-rush", best);
    if (G.score >= 100) { const s = store.get("pgy", []); s[7] = true; store.set("pgy", s); }

      <span class="label">時間到</span><span class="bigscore">${G.score}</span><span>分｜答 ${G.n} 題，對 ${G.ok} 題｜最佳 ${best} 分</span>

  }

function flash(){
  setBar("這是幾級？", "看判定依據猜級數", "games", "--z-resus");
  const pool = [];
  for (const k in CPL) for (const it of CPL[k].p.items) if (it.s) pool.push({ it, p: CPL[k].p, cat: CPL[k].cat });
  const Q = shuffle(pool).slice(0, 10); let i = 0, ok = 0;
  const show = () => {
    const q = Q[i];
    $("view").innerHTML = `<div class="gamebox"><div class="ghead"><span class="label">第 ${i + 1} / 10 題</span><span class="score">${ok} 對</span></div>
      <div class="gcase"><span class="hint">${esc(q.cat.name)}－${esc(q.p.name)}</span><p style="font-size:19px;font-weight:700">${esc(q.it.t)}</p></div>${lvButtons()}<div id="gF"></div></div>`;
    $("lvb").onclick = e => {
      const b = e.target.closest("[data-l]"); if (!b) return; const l = +b.dataset.l;
      if (l === q.it.l) ok++;
      $("lvb").onclick = null;
      $("gF").innerHTML = `<div class="flashmsg ${l === q.it.l ? "ok" : "bad"}">${l === q.it.l ? "✓ 答對" : `✗ 你按 ${l}`}，這是第 ${q.it.l} 級（${LVN[q.it.l]}）</div>
        <div class="row" style="margin-top:10px"><button class="btn" id="nx">${i < 9 ? "下一題" : "看結果"}</button></div>`;
      $("nx").onclick = () => { i++; i < 10 ? show() : end(); };
    };
  };
  const end = () => {
    const best = Math.max(store.get("best-flash", 0), ok); store.set("best-flash", best);
    $("view").innerHTML = `<section class="panel stack" style="text-align:center;justify-items:center"><span class="label">結果</span><span class="bigscore">${ok}/10</span><span>最佳 ${best} / 10</span>
      <div class="row" style="justify-content:center"><button class="btn" id="again">再玩一次</button><a class="btn ghost" href="#games" style="text-decoration:none">回遊戲區</a></div></section>`;
    $("again").onclick = flash;
  };
  show();
}

      ["「等第一批到院，看嚴重度再決定。」", "4 分鐘後就到、半數可能插管，這正是預測式準備的時間。", 0]] }, tip: "可接著用「急診調派戰情板」的氣爆情境推第二、三波。" },
    { m: 2, k: "講述", ic: "talk", icons: ["woozy", "look", "home2"], h: "333 醫療糾紛：病人為什麼不滿", cards: [["不被尊重、被忽視", "缺乏基本禮儀、不重視陳述、不耐煩、未說明下一步、表情冷漠"], ["焦慮、不安全感", "不知道下一步、無法預期的等待、醫師說法不同、短時間內要做困難決定"], ["被拋棄", "病情不樂觀卻沒有下一步計劃、病情變化沒有處置、轉介未先知會"]] },
    { m: 4, k: "討論", ic: "talk", h: "情境：家屬堅持要護理師道歉", branch: { q: "病人堅持要某位護理師親自道歉。你查證後，她並沒有不當的態度。", o: [
      ["請同仁先道歉，息事寧人", "同仁沒有錯卻被要求道歉，會傷團隊信任，也可能讓對方認定真的有過失。", 0],
      ["Leader 出面：先聽對方在意的是什麼、對他感受不好表達理解（不承認過失）、說明查證與後續；同時支持同仁；無法解決就依班別呈報", "給處理的承諾、不給結果的承諾；當事人避免與對方不適當接觸；主管支持同仁。", 1],
      ["請保全請家屬離開", "還沒升高到安全威脅時，先調解；有威脅才走暴力事件流程。", 0]] } },
    { m: 2, k: "講述", ic: "levels", fig: "r333", h: "333 呈報流程：Leader 先出面調解，無法解決再向上呈報", table: { head: ["班別", "呈報順序"], rows: [["白班", "Leader（或副護理長）→ 護理長 → 督導 → 主任"], ["小夜", "Leader（或副護理長）→ 夜護 → 行政主管"], ["大夜", "Leader → 夜護 → 行政主管"]] } },
    { m: 1, k: "互動", mcq: { q: "小夜發生醫療糾紛，Leader 調解不下來，下一個呈報對象是？", o: ["護理長", "夜護", "督導", "主任"], a: 1, why: "小夜：Leader → 夜護 → 行政主管。白班才是護理長 → 督導 → 主任。" } },
    { m: 2, k: "講述", ic: "record", icons: ["record", "shield", "talk"], h: "新聞事件", cards: [["什麼是新聞", "災難意外、政治人物、警政訊息、新奇怪事"], ["注意事項", "保護病人隱私；引導媒體並給予適當空間；提醒夜班護理長填寫新聞事件通報單"], ["通報", "白天：總機 → 企劃室、護理部。夜間：總機 → 夜班護理長、行政值班主管、企劃室"]] },
    { m: 2, k: "講述", ic: "house", icons: ["wave", "fire", "house", "drop", "biohaz", "siren"], h: "環境災害：Leader 先做什麼", cards: [["藍色警報（大雨）", "巡視檢傷、一觀逃生門、二觀出入口、化災區；查看防水閘門與雨勢、有無漏水淹水。淹水時：通報總機、通報滿載、聯絡資訊室移設備、聯絡工務、疏散病人、訂新看診動線"], ["000 火警", "通報班（總機）、滅火班、疏散班；確認起火點與滅火器、逃生包、逃生動線；通知主管／夜護"], ["地震", "趴下、掩護、穩住；巡視天花板與牆壁有無損壞，同時查看病人"], ["停電", "巡視環境與病人；查看使用電器的病人（BiPAP、呼吸器）；聯絡工務"]] },
    { m: 2, k: "講述", ic: "police", fig: "safe", h: "暴力事件處理原則", steps: ["安全第一：優先考慮工作人員安全，不逞英雄", "評估高危險群：三字經、怒罵、聲調提高；曾被約束；酒精藥物濫用；疾病導致行為偏差", "建立無威脅環境：維持至少一個手臂距離，預留可快速離開的出口", "控制場面：一組疏散圍觀者並求援，一組專心處理病人，一組處理暴力事件", "尋求支援：先請警衛在周遭現身，但不要讓對方感到威脅", "隔離與會談：引導到安全安靜處，允許適度發洩，必要時約束；確定自身安全後再了解原因", "事後：原因分析，關心當事同仁的心理"] },
  ]},
  { id: "c4", time: "13:00–14:00", t: "危機事件處理技巧及應變措施（跨單位異常）", who: "宏榮", draft: "本堂依《小組長訓練手冊》、討論題第二組（交班品質、床位協調）與單位真實事件推測整理，待宏榮確認後修正。", blocks: [
    { m: 3, k: "暖身", ic: "hospital", h: "暖身：這些跨單位卡關，你遇過幾個？", check: ["病房說急診交班與實際不符", "ICU 不同意加床", "病房醫師不接病人", "接班醫師沒來", "檢驗報告發錯病人", "傳送一直沒來", "轉院時對方拒收"], tip: "請勾最多項的學員分享一件，講師點出「卡在交界」的共通點。" },
    { m: 4, k: "講述", ic: "hospital", icons: ["hospital", "look", "timer", "talk"], fig: "gap", h: "跨單位異常為什麼難", cards: [["責任在交界", "兩邊都覺得不是自己的事，最容易沒人接"], ["資訊不對稱", "急診看到的病人和病房看到的病人不一樣"], ["時間壓力", "爭論的時候，病人還在等床、等檢查、等醫師"], ["情緒先到", "第一通電話往往是抱怨，不是問題"]] },
    { m: 5, k: "講述", ic: "shield", h: "危機處理五步", steps: ["病人先穩住：現在誰在照顧？會不會惡化？", "收集事實：時間、人、紀錄、誰看到；先聽完再回應", "對事不對人：用 SBAR 講清楚現況與需要", "依權責升級：Leader → 護理長／夜護 → 督導或行政值班；醫師之間請主治對主治", "記錄與檢討：交班本、異常通報、當班或事後檢討"], tip: "強調第 1 步：爭論再激烈，病人安全先確認。" },
    { m: 5, k: "講述", ic: "talk", icons: ["clip", "siren", "talk", "shield"], fig: "two", h: "四個溝通工具", cards: [["SBAR", "狀況、背景、評估、建議。把一件事說清楚"], ["CUS", "我擔心（Concerned）、我不安（Uncomfortable）、這是安全問題（Safety）。用來把關切升高"], ["兩次挑戰", "同一個安全疑慮講兩次仍沒被回應，就往上升級"], ["DESC", "描述事實、表達感受、建議做法、說明後果。用來處理衝突"]], note: "以上工具出自 TeamSTEPPS 團隊合作課程。" },
    { m: 6, k: "演練", ic: "bed", h: "情境：病房說急診交班不對", branch: { q: "病房護理師來電：急診交班寫 GCS E4V5M6、不需抽痰，但病人上去後 GCS E3V4M6、痰很多。她質疑急診沒做身體評估，要你們派人上去 double check。你是當班 Leader，你會？", o: [
      ["「我們評估沒錯，應該是上去後才變化的。」結束通話", "防衛回應。病人可能真的變化，也可能交班有落差，兩者都需要確認，而且病人現在需要被處理。", 0],
      ["先謝謝告知、確認病人已有人處理；查紀錄並問當事護理師評估的時間與內容；回電說明結果；若有落差，評估通報並做單位教育，需要時請護理長與病房護理長溝通", "病人安全先，再查事實；由 Leader 回應，不讓當事人在電話或現場被對質；有落差就變成單位學習。", 1],
      ["馬上派當事護理師上樓 double check", "急診區域立刻少一人，而且還沒查證就上去，很容易變成對質。先查證、由 Leader 回應。", 0]] }, tip: "追問：如果查證後真的是急診漏評估，你回電的第一句話怎麼講？" },
    { m: 5, k: "討論", ic: "bed", h: "情境：ICU 不同意加床", branch: { q: "病人不適合轉院，需要加護照護，但 ICU 醫師不同意加床。家屬在旁邊等答案。", o: [
      ["跟家屬說「ICU 不收，你們要不要轉院」", "把跨單位的僵局丟給家屬，容易引發醫療糾紛；而且病人不適合轉院。", 0],
      ["請急診主治與 ICU 主治直接溝通；Leader 同步告知護理長／夜護與行政值班協調床位；病人留在急診期間，依重症病人配置人力並持續再評估", "醫師之間的收治決定由主治對主治；Leader 負責往上通報、協調資源，並確保病人在等待中是安全的。", 1],
      ["自己打給 ICU 護理長，請她說服醫師", "可以是協調的一環，但收治決定不在護理端；更重要的是讓主治對主治溝通，並往上通報。", 0]] } },
    { m: 5, k: "互動", ic: "hospital", h: "其他跨單位情境：你會怎麼接？（點卡片翻面）", flip: [
      ["兒科 8 點接班醫師沒來，聯絡後說今天沒排班，前一班醫師無法留下", "立刻告知急診主治與科主管或行政值班確認排班；期間兒科病人由急診主治先接手評估；檢傷調整兒科候診並告知家屬；寫進交班本並通報。"],
      ["檢驗報告發到錯的病人", "先確認兩位病人的處置是否已受影響；告知醫師與檢驗科；依異常事件流程通報。"],
      ["病房醫師說急診收太多，不接病人", "不在電話中爭論收治是否適當；請雙方主治溝通；Leader 記錄時間與對象並呈報；病人在急診期間持續照護與再評估。"],
      ["轉院時對方醫院拒收", "請醫師對醫師溝通並記錄拒收原因；聯絡其他醫院或轉診中心；告知家屬目前進度；病人持續監測。"]] },
    { m: 4, k: "互動", ic: "talk", h: "練習：用 DESC 打一通跨單位電話", build: { parts: [["D 描述事實", "急診 3 床呼吸衰竭已插管 2 小時，目前 FiO₂ 60%"], ["E 表達感受", "我很擔心他在急診等太久會惡化"], ["S 建議做法", "請 ICU 主治與我們主治直接討論床位"], ["C 說明後果", "如果 30 分鐘內沒有床，我們會往上通報行政值班協調"]], model: ["「急診 3 床呼吸衰竭已經插管 2 小時，FiO₂ 60%。」", "「我很擔心他在急診等太久會惡化。」", "「能不能請 ICU 主治和我們主治直接討論床位？」", "「如果 30 分鐘內還沒有結果，我會往上通報行政值班協調。」"] }, tip: "後果不是威脅，是說明你下一步會怎麼做。" },
    { m: 5, k: "演練", ic: "biohaz", h: "真實事件：國中泳池氯氣外洩", branch: { q: "國中來電：泳池氯氣外洩，約 20 名學生咳嗽、眼睛刺痛、呼吸困難，救護車、校車、家長自行送醫，陸續到院。你第一件事？", o: [
      ["請所有學生先到檢傷排隊", "集體到院會塞爆檢傷，化學暴露也可能需要先除污。", 0],
      ["通知主治與主管評估啟動 888 與化災流程；開設戶外檢傷與除污區；交代同仁防護；指定一人對接學校與家長、一人造冊", "先處理動線、除污與自身防護，並把窗口和名單交給固定的人。", 1],
      ["先打給衛生局通報", "通報要做，但不是第一件事；先處理到院動線、除污與防護。", 0]] }, tip: "可接著用「急診調派戰情板」的氯氣情境把三波都推完。" },
    { m: 3, k: "小結", ic: "shield", h: "帶走三句話", steps: ["病人安全先確認，再處理誰對誰錯", "收治與醫療決定，請主治對主治；Leader 負責往上通報與協調資源", "每一次跨單位卡關都寫進交班本，讓下一班與單位學得到"] },
  ], quiz: [
    ["跨單位電話一接起來對方就很激動，Leader 的第一步是？", ["先指出對方的錯誤", "確認病人安全並先聽完事實", "請對方去找護理長", "掛掉電話"], 1, "危機處理五步的第一步：病人先穩住，再收集事實。"],
    ["同一個安全疑慮已經講了兩次，對方仍沒回應，下一步是？", ["算了", "再講第三次", "往上升級給主管或行政值班", "請家屬自己處理"], 2, "兩次挑戰原則：講兩次沒回應就升級。"],
    ["ICU 醫師不同意加床，誰來溝通收治？", ["Leader 與 ICU 醫師", "急診主治與 ICU 主治", "家屬與 ICU 醫師", "傳送人員"], 1, "收治是醫療決定，由主治對主治；Leader 負責通報與協調。"]] },
  { id: "c5", time: "14:00–15:00", t: "人力管理及調派技巧", who: "秀霞", blocks: [
    { m: 2, k: "暖身", ic: "talk", h: "暖身：你上一次聽到「大家幫忙一下」是什麼時候？", think: { q: "回想一個忙亂的班，有人喊「大家幫忙一下」。結果有誰去了？", a: "多半是「最好心的那個人」去了，或是沒有人去。今天要練的，就是把「大家」變成「指定的那個人」。" } },
    { m: 3, k: "講述", ic: "nurse", h: "調派，就是把「每個人」變成「指定的那個人」", compare: [
      ["沒有調派時", "沒有人知道那個人是誰，出事時沒有人負責", ["「大家幫忙一下」", "「等一下誰去看一下 5 床」", "「有空的人去支援急救室」"]],
      ["有調派時", "誰做、誰補位、什麼時候回頭確認", ["「你現在去接急救室 2 床」", "「你原本的內科區我請另一位先顧」", "「20 分鐘後我回來看你狀況」"]]] },
    { m: 3, k: "講述", ic: "works", h: "人力管理 ≠ 人力調派", table: { head: ["", "人力管理", "人力調派"], rows: [["時間尺度", "週／月", "分鐘／小時"], ["在做什麼", "排班、能力進階、訓練、人力盤點", "現在把誰移到哪一區、誰補他的位"], ["誰負責", "護理長、督導", "當班小組長"], ["做不好的後果", "長期人力失衡、離職", "當下病人受害、同仁受傷"], ["可以事後補救嗎", "可以，下個月調整", "不行，過了就過了"]] } },
    { m: 3, k: "講述", ic: "record", icons: ["nurse", "bed", "timer"], fig: "books", h: "Leader 的三個帳本：接班前 10 分鐘打開", cards: [["人帳｜今天班上有誰", "能力層級 N1／N2／N3；今天狀態（新人、身體不適、剛被家屬罵完）；手上有沒有走不開的病人"], ["位帳｜哪些位置不能空", "檢傷、急救室、各治療區的最低安全人力；誰是唯一會操作那台機器的人"], ["時帳｜哪些病人不能等", "tPA、D2B、Major trauma、敗血症 bundle。時效一過，人力再多也補不回來；這一本永遠優先"]],
      note: "調派＝在「時帳」的壓力下，用「人帳」去補「位帳」的缺口。" },
    { m: 3, k: "講述", ic: "map", fig: "swap", h: "調派四步驟", steps: ["盤點：三個帳本打開，人在哪、哪格空了、誰在倒數", "排序：時效 > 安全 > 效率 > 舒適，順序不能顛倒", "調動：「誰去做」和「誰補他的空」要同時講", "追蹤：約定回頭時間。最常漏掉的就是這一步"] },
    { m: 2, k: "互動", ic: "clip", h: "排排看：調派四步驟", order: { items: ["盤點：人在哪、哪格空了、誰在倒數", "排序：時效 > 安全 > 效率 > 舒適", "調動：誰去做、誰補他的空，同時講", "追蹤：約定回頭時間"], why: "最常漏掉的是第 4 步追蹤。" } },
    { m: 3, k: "講述", ic: "look", icons: ["timer", "stand", "nurse2"], h: "調派三問：動人之前，30 秒想一遍", cards: [["誰的病人最不能等？", "時帳優先：tPA 在倒數，跌倒的在等，先處理倒數的"], ["誰現在最可以離開？", "不是誰最閒，是誰離開後傷害最小；資深的手上通常最重"], ["他離開後，誰補位？", "沒有補位的調派，只是把洞從 A 區搬到 B 區"]], note: "三問答不出來，就不要動人。動錯比不動更貴。" },

// 情境排序遊戲
function sortGame(key, onEnd){
  const S = WSORT[key], n = S.items.length, order = shuffle([...Array(n).keys()]); let picks = [];
  const col = WZ[key].color;
  const draw = () => {
    $("view").innerHTML = `<section class="panel stack"><b>${esc(S.title)}</b><p class="hint" style="margin:0">${esc(S.intro)}</p></section>
      <div class="sorts">${order.map(i => { const p = picks.indexOf(i); return `<button class="scard ${p >= 0 ? "on" : ""}" data-s="${i}" style="--c:var(${col})"><span class="sno">${p >= 0 ? p + 1 : ""}</span><span>${esc(S.items[i][0])}</span></button>`; }).join("")}</div>
      <div class="row"><button class="btn" id="sChk" style="background:var(${col})" ${picks.length < n ? "disabled" : ""}>看答案</button><button class="btn ghost" id="sClr">重來</button><span class="hint">已排 ${picks.length} / ${n}；點已排的卡可取消</span></div>`;
    $("view").onclick = e => { const c = e.target.closest("[data-s]");
      if (c) { const i = +c.dataset.s, p = picks.indexOf(i); if (p >= 0) picks.splice(p, 1); else picks.push(i); draw(); return; }
      if (e.target.id === "sClr") { picks = []; draw(); }
      if (e.target.id === "sChk") result(); };
  };
  const result = () => {
    const ok = picks.filter((v, k) => v === k).length, top = picks[0] === 0;
    const stars = ok === n ? 3 : top && ok >= n - 2 ? 2 : top ? 1 : 0;
    $("view").onclick = null;
    $("view").innerHTML = `<section class="panel stack" style="text-align:center;justify-items:center"><span class="label">${stars ? "排得好！" : "最優先的那一件要再想想"}</span><span class="qstars">${"★".repeat(stars)}${"☆".repeat(3 - stars)}</span><span>${ok} / ${n} 個位置排對</span></section>
      <section class="panel stack"><h3 class="bh">建議順序與理由</h3><div class="road">${S.items.map((it, k) => { const me = picks.indexOf(k) + 1, good = me === k + 1;
        return `<div class="rstep wst" style="grid-template-columns:40px minmax(0,1fr);--i:${k}"><span class="no" style="background:var(${col});color:#fff">${k + 1}</span><div><b style="font-size:15px">${esc(it[0])}</b><span style="display:block;color:var(--ink-2);font-size:14px;margin-top:2px">${esc(it[1])}</span><span class="smark ${good ? "ok" : "bad"}">${good ? "✓ 你也排第 " + me : "你排第 " + me}</span></div></div>`; }).join("")}</div></section>
      ${onEnd(stars)}`;
    if (stars) setTimeout(confetti, 60);
    const r = $("sRetry"); if (r) r.onclick = () => sortGame(key, onEnd);
  };
  draw();
}
function sortPage(key){

/* 手寫簽名板 */
function sigPad(cv){
  const ctx = cv.getContext("2d"); let drawing = false, any = false, last = null;
  const fit = () => { const w = cv.offsetWidth, h = cv.offsetHeight, d = devicePixelRatio || 1; cv.width = w * d; cv.height = h * d; ctx.setTransform(d, 0, 0, d, 0, 0); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h); ctx.lineWidth = 2.4; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#111"; any = false; };
  fit();
  const pt = e => { const r = cv.getBoundingClientRect(), k = cv.offsetWidth / (r.width || 1); return [(e.clientX - r.left) * k, (e.clientY - r.top) * k]; };   // 版面有放大（zoom）時換算回畫布座標
  cv.addEventListener("pointerdown", e => { drawing = true; last = pt(e); cv.setPointerCapture(e.pointerId); e.preventDefault(); });
  cv.addEventListener("pointermove", e => { if (!drawing) return; const p = pt(e); ctx.beginPath(); ctx.moveTo(last[0], last[1]); ctx.lineTo(p[0], p[1]); ctx.stroke(); last = p; any = true; e.preventDefault(); });
  const up = () => { drawing = false; }; cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
  return { clear: fit, empty: () => !any,
    data: () => { const o = document.createElement("canvas"); o.width = 420; o.height = 140; const c = o.getContext("2d"); c.fillStyle = "#fff"; c.fillRect(0, 0, 420, 140); c.drawImage(cv, 0, 0, 420, 140); return o.toDataURL("image/png"); } };
}

let HSR = null;
function hubDictate(id, btn){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return toast("這個瀏覽器不支援語音輸入，可以按手機鍵盤上的麥克風", true);
  if (HSR) { try { HSR.stop(); } catch (e) {} return; }
  const el = $(id), base = el ? el.value.trim() : "", r = new SR(); r.lang = "zh-TW"; r.interimResults = true; r.continuous = true;
  r.onresult = ev => { let x = ""; for (const res of ev.results) x += res[0].transcript; if (el) el.value = (base ? base + "\n" : "") + x; };
  r.onerror = ev => toast(ev.error === "not-allowed" ? "沒有麥克風權限" : "語音辨識中斷，再按一次 🎤", true);
  r.onend = () => { HSR = null; if (btn) btn.classList.remove("on"); };
  HSR = r; if (btn) btn.classList.add("on"); try { r.start(); toast("請說話…再按一次 🎤 停止"); } catch (e) { HSR = null; }
}

  const n = S.results.length, ok = S.results.filter(r => r.levelOk).length;
  const under = S.results.filter(r => !r.levelOk && r.mine > r.ans).length, over = S.results.filter(r => !r.levelOk && r.mine < r.ans).length, cplOk = S.results.filter(r => r.cplOk).length;
  const now = new Date(), p2 = x => String(x).padStart(2,"0"), when = `${now.getFullYear()}/${p2(now.getMonth()+1)}/${p2(now.getDate())} ${p2(now.getHours())}:${p2(now.getMinutes())}`;
  const hist = store.get("history", []); hist.push({ when, scope: S.scope, score: ok, total: n }); store.set("history", hist.slice(-30));
  const csv = ["姓名,時間,範圍,題號,來源,參考級數,作答級數,級數正確,主訴正確,關鍵依據"].concat(S.results.map(r => { const c = CASES.find(x => x.id === r.id); return [S.name||"未填", when, S.scope, r.id, c.src, r.ans, r.mine, r.levelOk?"Y":"N", r.cplOk?"Y":"N", r.keyOk?"Y":"N"].join(","); })).join("\n");
  $("view").innerHTML = `
    <section class="panel stack"><h2 style="font-size:20px">${esc(S.scope)}｜${ok} / ${n} 題級數正確</h2>
      <div class="stats"><div class="stat"><b>${n ? Math.round(ok/n*100) : 0}%</b><span>級數正確率</span></div><div class="stat"><b>${under}</b><span>判太輕（under）</span></div><div class="stat"><b>${over}</b><span>判太重（over）</span></div><div class="stat"><b>${cplOk}</b><span>主訴選對</span></div></div>
      ${under ? `<p style="margin:0">有 ${under} 題判得比答案輕。檢傷寧可稍重勿輕，請先複習這幾題。</p>` : ""}</section>
    <section class="panel stack"><div class="label">逐題回顧</div><div class="review">${S.results.map(r => { const c = CASES.find(x => x.id === r.id); return `<div class="row" style="justify-content:space-between;flex-wrap:nowrap"><b class="${r.levelOk?"ok":"bad"}">${r.levelOk?"✓":"✗"}</b><span style="flex:1;min-width:0">${esc(c.text.slice(0,30))}…</span><span>${lvChip(r.mine)}${r.levelOk?"":" → "+lvChip(r.ans)}</span></div>`; }).join("")}</div></section>
    <section class="panel stack"><div class="label">練習紀錄（交給輔導員）</div><textarea id="csv" readonly>${esc(csv)}</textarea>
      <div class="row"><button class="btn" id="copyBtn">複製紀錄</button><span class="hint" id="copyMsg"></span></div></section>
    <div class="row"><button class="btn" id="againBtn">再練一次</button></div>`;
  $("copyBtn").onclick = async () => { try { await navigator.clipboard.writeText(csv); $("copyMsg").textContent = "已複製，可貼到 Excel"; } catch(e){ $("csv").select(); $("copyMsg").textContent = "已選取，請按 Ctrl+C / ⌘C 複製"; } };
  $("againBtn").onclick = pHome;
}

const REFS = [["levels","五級定義與再評估","levels"],["flow","判定三步驟","flow"],["spo2","呼吸窘迫 SpO₂","lungs"],["gcs","意識程度 GCS","brain"],["pain","疼痛：分數 × 部位","pain"],
  ["reassess","再評估時間軸","timer"],["abcd","外傷 ABCD-P-M","bandage"],["moi","高危險受傷機轉","crash"],["fever","成人發燒","fever"],["stroke","中風時間","brain"],
  ["pat","小兒評估三角","baby"],["pedshr","兒童心跳區間","child"],["pedsfever","兒童發燒","fever"],["ob","懷孕大於 20 週","preg"],["start","START 大量傷患","siren"]];
function ref(){
  setBar("速查卡", "點「逐步看」可一項一項出現", "triage");
  $("view").innerHTML = `<div class="refnav">${REFS.map(r => `<a class="chip" href="#ref" data-j="${r[0]}" style="text-decoration:none;color:inherit">${r[1]}</a>`).join("")}</div>` +
    REFS.map(r => `<section class="panel stack refcard" id="ref-${r[0]}"><h3>${img(r[2])}${r[1]}</h3><div class="viz">${VIZ[r[0]]()}</div></section>`).join("") +
    `<p class="foot">依衛福部急診五級檢傷分類基準與首要調節變數表整理；中風：成人「中風症狀」6 小時、「肢體無力」4.5 小時，兒童 4.5 小時。</p>`;
  bindPat($("view"));
  $("view").querySelectorAll(".viz").forEach(v => { const items = stepItems(v); if (items.length < 3) return;
    const bar = document.createElement("div"); bar.className = "vizbar";
    bar.innerHTML = `<button type="button" class="vb next">▶ 逐步看</button><button type="button" class="vb all" hidden>全部顯示</button><span class="vb-n" aria-live="polite"></span>`;
    v.prepend(bar); v._items = items; v._i = -1; });
  $("view").onclick = e => { const vb = e.target.closest(".vb"); if (vb){ vizStep(vb.closest(".viz"), vb.classList.contains("all") ? "all" : "next"); return; }
    const j = e.target.closest("[data-j]"); if (j){ e.preventDefault(); $("ref-" + j.dataset.j).scrollIntoView({ behavior: "smooth", block: "start" }); } };
}
function stepItems(v){
  const sel = [".ladder > .rung", ".flow > .fstep", ".stepper > .chipcard", ".moi > .m", ".start > .q", ".pgrid > .c", ".tl > .mk", ".hr > .hrrow", ".bar > .seg", ".say > .yes"];
  for (const s of sel){ const f = [...v.querySelectorAll(s)]; if (f.length >= 3) return s === ".bar > .seg" && v.querySelector(".hr") ? [...v.querySelectorAll(".hrrow")] : f; }
  return [];
}
function vizStep(v, mode){
  const it = v._items, bar = v.querySelector(".vizbar");
  if (mode === "all"){ it.forEach(x => x.classList.remove("veil","pop")); v._i = -1; bar.querySelector(".next").textContent = "▶ 逐步看"; bar.querySelector(".all").hidden = true; bar.querySelector(".vb-n").textContent = ""; return; }
  if (v._i < 0 || v._i >= it.length){ it.forEach(x => x.classList.add("veil")); v._i = 0; }
  const x = it[v._i]; x.classList.remove("veil"); x.classList.add("pop"); v._i++;
  bar.querySelector(".all").hidden = false; bar.querySelector(".vb-n").textContent = `${v._i} / ${it.length}`;
  bar.querySelector(".next").textContent = v._i >= it.length ? "↺ 重來" : "▶ 下一個";
}
